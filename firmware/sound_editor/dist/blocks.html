<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHRleHQgeD0iMzIiIHk9IjU0IiBmb250LWZhbWlseT0iQXJpYWwsSGVsdmV0aWNhLHNhbnMtc2VyaWYiIGZvbnQtd2VpZ2h0PSI3MDAiIGZvbnQtc2l6ZT0iNjgiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiMyNTYzZWIiPkE8L3RleHQ+PC9zdmc+" />
<title>Конструктор Блок Схем</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161b26; --panel2:#1e2533; --line:#2b3547;
    --text:#e7ecf5; --muted:#e7ecf5; --accent:#4a9eff; --ok:#4caf72; --on-accent:#04101f; --ok-ink:#6fe0a0;
    --warn:#e0a24a; --err:#ff8f8f; --node:#1b2230; --nodehd:#242f42;
    --stage:#0c1119; --grid:#1a2230; --link:#6f8bb0;
  }
  html[data-theme=light]{
    --bg:#eef1f7; --panel:#ffffff; --panel2:#f4f6fb; --line:#d3dae8;
    --text:#0b0f16; --muted:#0b0f16; --accent:#2f6fd0; --ok:#1f9d63; --on-accent:#ffffff; --ok-ink:#127a45;
    --warn:#8a5a00; --err:#b3261e; --node:#ffffff; --nodehd:#eef2f9;
    --stage:#f7f9fd; --grid:#dde3ee; --link:#8a99b5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  body{display:flex;flex-direction:column;overflow:hidden}
  .boot-overlay{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(6,10,18,.72);backdrop-filter:blur(2px)}
  .boot-overlay.hide{display:none}
  .boot-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
  .boot-title{font-size:16px;font-weight:700;margin-bottom:6px}
  .boot-text{font-size:12px;color:var(--muted);min-height:18px;margin-bottom:12px;overflow-wrap:anywhere}
  .boot-track{height:10px;border:1px solid var(--line);border-radius:6px;background:var(--input,var(--panel2));overflow:hidden}
  .boot-track i{display:block;height:100%;width:0;background:var(--accent);transition:width .18s ease}
  .boot-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px;font-size:11px;color:var(--muted)}
  .boot-skip{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:6px 10px;font:inherit;font-size:11px;cursor:pointer}
  .boot-skip:hover{border-color:var(--accent)}
  header.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  .hd-left{display:flex;align-items:center;gap:8px;justify-self:start;min-width:0}
  .hd-mid{display:flex;align-items:center;gap:8px;justify-self:center;flex-wrap:wrap}
  .hd-right{display:flex;align-items:center;gap:8px;justify-self:end}
  .brand{font-weight:600}
  .brand span{color:var(--accent);font-weight:400}
  .grow{flex:1}
  .status{font-size:12px;color:var(--muted)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--err);margin-right:5px;vertical-align:middle}
  .dot.on{background:var(--ok)}
  button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  button.apply{background:var(--ok);border-color:var(--ok);color:#04170c;font-weight:600}
  button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.sm{padding:3px 7px;font-size:12px}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:0 0 auto}
  .seg button{border:none;border-radius:0;background:transparent;padding:6px 10px}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
  .scheme-bar{display:flex;flex-direction:column;gap:6px}
  .scheme-bar.hidden{display:none}
  .scheme-bar label{font-size:12px;color:var(--muted)}
  .scheme-list{display:grid;grid-template-columns:1fr;gap:5px}
  .scheme-chip{display:flex;align-items:stretch;min-width:0;min-height:40px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:7px;line-height:1.2}
  .scheme-pick{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:5px 4px 5px 8px;background:transparent;border:none;border-radius:0;text-align:left;color:inherit}
  .scheme-pick:hover{border-color:transparent}
  .scheme-pick b{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .scheme-chip.on{border-color:var(--accent);border-left-color:var(--accent);background:rgba(74,158,255,.16);box-shadow:0 0 0 1px var(--accent) inset}
  .scheme-chip.on .scheme-pick b{color:var(--accent)}
  .scheme-rename{flex:1 1 auto;min-width:0;margin:4px 4px 4px 6px;padding:3px 6px;background:var(--panel);border:1px solid var(--accent);color:var(--text);border-radius:5px;font:12px/1.3 system-ui,Segoe UI,Roboto,sans-serif}
  .scheme-edit-btn,.scheme-x{flex:0 0 26px;display:flex;align-items:center;justify-content:center;padding:0;background:transparent;border:none;color:var(--muted);opacity:.55}
  .scheme-edit-btn:hover{color:var(--accent);opacity:1}
  .scheme-x{border-left:1px solid var(--line);border-radius:0 6px 6px 0}
  .scheme-x:hover{color:var(--err);border-color:var(--err);opacity:1}
  .scheme-chip.on .scheme-x{border-left-color:rgba(74,158,255,.5)}
  .scheme-chip.scheme-new{grid-column:1/-1;justify-content:center;align-items:center;min-height:32px;padding:5px 8px;border-style:dashed;border-left-style:dashed;border-left-color:var(--line);color:var(--muted);font-size:12px}
  .scheme-chip.scheme-new:hover{color:var(--accent);border-color:var(--accent)}
  aside.left{overflow-x:hidden}
  aside.left .mode-switch-wrap{margin-bottom:10px;box-sizing:border-box}
  aside.left .seg{display:flex;width:100%;box-sizing:border-box}
  aside.left .seg button{flex:1 1 0;min-width:0;padding:6px 4px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  aside.left .scheme-bar{width:100%;margin-top:8px;box-sizing:border-box}
  .node .hd .tt{flex:0 0 auto;font-size:10px;color:var(--text);opacity:.75;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:5px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
  .tm{position:relative}
  .tm>.tm-btn::after{content:"▾";margin-left:6px;font-size:10px;opacity:.7}
  .tm-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:208px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;z-index:60;box-shadow:0 12px 32px rgba(0,0,0,.4)}
  .tm.open>.tm-panel{display:block}
  .tm-panel button{display:block;width:100%;text-align:left;margin:3px 0;background:transparent;border-color:transparent}
  .tm-panel button:hover{background:var(--panel2);border-color:var(--line)}
  .tm-panel button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  main{flex:1;display:flex;min-height:0;border-bottom:1px solid var(--line)}
  aside{background:var(--panel);border-right:1px solid var(--line);width:230px;overflow:auto;padding:10px}
  aside.right{border-right:none;border-left:1px solid var(--line);width:290px}
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 6px}
  aside h2:first-child{margin-top:0}
  .pal-group{margin-bottom:10px}
  .pal-group>header{font-size:11px;color:var(--muted);margin-bottom:4px}
  .pal button{display:block;width:100%;text-align:left;margin-bottom:5px}
  .pal button b{display:block;font-weight:600}
  .pal button small{color:var(--muted)}
  #stage{position:relative;flex:1;overflow:hidden;background:var(--stage);--gstep:20px;--gx:0px;--gy:0px}
  #stage.grid-bg{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:var(--gstep) var(--gstep);background-position:var(--gx) var(--gy)}
  #marquee{position:absolute;border:1px solid var(--accent);background:rgba(74,158,255,.15);pointer-events:none;z-index:6;display:none}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;width:6000px;height:6000px}
  #texts{pointer-events:none}
  .textnode{pointer-events:auto;position:absolute;min-width:24px;min-height:1.3em;max-width:640px;padding:3px 7px;border:1px dashed transparent;border-radius:6px;color:var(--text);font:16px/1.3 system-ui,Segoe UI,Roboto,sans-serif;white-space:pre-wrap;word-break:break-word;cursor:move;user-select:none}
  .textnode:hover{border-color:var(--line)}
  .textnode.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(74,158,255,.35);background:rgba(74,158,255,.06)}
  .textnode.editing{cursor:text;user-select:text;border-color:var(--accent);background:var(--panel2);outline:none}
  button.tbtn{font-weight:700;font-family:Georgia,'Times New Roman',serif;min-width:34px;line-height:1}
  #links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  #links path.link{stroke:var(--link);stroke-width:2;fill:none;pointer-events:none}
  #links path.link.sel{stroke:var(--accent);stroke-width:2.6}
  /* Invisible fat stroke on top of each link gives it a comfortable click area;
     vector-effect keeps that area the same on screen at any zoom. */
  #links path.link-hit{stroke:transparent;stroke-width:16;fill:none;pointer-events:stroke;cursor:pointer;vector-effect:non-scaling-stroke}
  #links path.link-hit:hover+path.link{stroke:var(--err)}
  #links path.temp{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-dasharray:6 5;pointer-events:none}
  #arrow path{stroke:var(--link)}
  #arrowTemp path{stroke:var(--accent)}
  .node{position:absolute;width:240px;height:80px;background:var(--node);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35);user-select:none}
  .node.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(74,158,255,.35)}
  .node.engine{border-color:#f97316}
  .node.output{border-color:#22c55e}
  .node.logic{border-color:#a855f7}
  .node .hd{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:9px 9px 0 0;background:var(--nodehd);cursor:grab}
  .node .hd b{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .hd .x{background:none;border:none;color:var(--muted);padding:0 3px;cursor:pointer;display:flex;align-items:center}
  .node .hd .x:hover{color:var(--err)}
  .node .hd .okbadge{color:var(--ok-ink);font-weight:700;font-size:13px;flex:0 0 auto}
  .node .hd .chain{background:none;border:none;color:var(--muted);padding:0 3px;cursor:pointer;display:flex;align-items:center;font-size:11px}
  .node .hd .chain:hover{color:var(--ok-ink)}
  .node .bd{padding:4px 44px;font-size:11px;line-height:1.35;color:var(--muted);min-height:30px;max-height:46px;overflow:hidden}
  .node .bd .k{color:var(--text)}
  .port{position:absolute;top:32px;width:14px;height:14px;border-radius:50%;border:2px solid var(--node);cursor:crosshair}
  .port.in{left:-8px;background:var(--accent)}
  .port.out{right:-8px;background:var(--ok)}
  .outports{position:absolute;right:-8px;top:34px;bottom:10px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end}
  .outports .port.out{position:relative;top:auto;right:auto}
  .port .lbl{position:absolute;top:50%;transform:translateY(-50%);font-size:9px;white-space:nowrap;pointer-events:none;color:var(--text)}
  .port.in .lbl{left:16px}
  .port.out .lbl{right:16px;text-align:right}
  aside.right label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
  aside.right input,aside.right select{width:100%;padding:5px 7px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .frow{display:flex;gap:6px;align-items:center}
  .frow select{flex:1;min-width:0}
  .frow .play{flex:0 0 auto;padding:5px 9px;font-size:12px}
  .diag .ok{color:var(--ok-ink)}
  .hint{font-size:11px;color:var(--muted);margin:6px 0}
  .right-status{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .diag{max-height:140px;overflow:auto;font-size:11px;width:100%;margin-top:6px}
  .diag .d{color:var(--err)}.diag .w{color:var(--warn)}
  .legend-box{margin-top:14px;padding:10px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:12px;line-height:1.45;color:var(--text)}
  .legend-box h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
  .legend-box .leg-row{margin:5px 0}
  .legend-box .leg-row b{color:var(--text)}
  .legend-item{margin:6px 0;padding-left:8px;border-left:3px solid var(--line);font-size:11.5px;line-height:1.38}
  .hidden{display:none}
  .mob{display:none}
  @media (max-width:760px){
    aside{position:fixed;top:0;bottom:0;z-index:30;width:86%;max-width:330px;box-shadow:0 0 30px #000a;transition:transform .18s}
    aside.left{left:0;border-right:1px solid var(--line);transform:translateX(-105%)}
    aside.right{right:0;transform:translateX(105%)}
    body.show-pal aside.left{transform:none}
    body.show-insp aside.right{transform:none}
    .mob{display:inline-block}
    .brand span{display:none}
    header.top{display:flex;flex-wrap:wrap}
    .hd-left{flex:1 1 auto}
    .hd-right{order:1}
    .hd-mid{order:2;flex:1 1 100%;justify-content:flex-start}
  }
</style>
</head>
<body>
<div class="boot-overlay" id="boot_overlay" role="dialog" aria-modal="true" aria-labelledby="boot_title">
  <div class="boot-card">
    <div class="boot-title" id="boot_title" data-i18n="boot_title">Загрузка редактора…</div>
    <div class="boot-text" id="boot_text" data-i18n="boot_project">Подготовка проекта…</div>
    <div class="boot-track" id="boot_track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="boot_bar"></i></div>
    <div class="boot-meta">
      <span id="boot_pct">0%</span>
      <button type="button" id="boot_skip" class="boot-skip" data-i18n="boot_skip">Продолжить без загрузки</button>
    </div>
  </div>
</div>
<header class="top">
  <div class="hd-left">
    <button id="b_pal" class="mob" title="Палитра" data-i18n-title="palette">☰</button>
    <div class="brand">AURA-X <span data-i18n="brand_sub">Конструктор Блок Схем</span></div>
    <div class="status"><i class="dot" id="on"></i><span id="on_txt" data-i18n="offline">Нет связи</span></div>
  </div>
  <div class="hd-mid">
  <div class="tm" data-menu>
    <button type="button" class="tm-btn" data-i18n="m_file">Файл</button>
    <div class="tm-panel">
      <button id="b_new" data-i18n="new">Новый</button>
      <button id="b_default" data-i18n="default_project">Тепловоз ЧМЭ3</button>
      <button id="b_check_blocks" data-i18n="check_blocks">Проверить блоки</button>
      <button id="b_export_scheme" data-i18n="export_scheme">Экспорт схемы для пакета (.json)</button>
      <button id="b_file_png" data-i18n="download_png">Скачать картинку</button>
      <button id="b_file_txt" data-i18n="download_txt">Скачать текст</button>
      <div style="padding:6px 8px;border-top:1px solid var(--line)">
        <label class="hint" data-i18n="project_name">Имя проекта</label>
        <input id="p_name" style="width:100%;margin:2px 0">
      </div>
    </div>
  </div>
  <button id="b_text" class="tbtn" title="Добавить текст" data-i18n-title="text_tip" aria-label="Добавить текст" data-i18n-aria="text_tip">T</button>
  <button id="b_undo" class="tbtn" title="Отменить (Ctrl+Z)" data-i18n-title="undo_tip" aria-label="Отменить" data-i18n-aria="undo_tip">↶</button>
  <button id="b_redo" class="tbtn" title="Повторить (Ctrl+Y)" data-i18n-title="redo_tip" aria-label="Повторить" data-i18n-aria="redo_tip">↷</button>
  <div class="tm" data-menu>
    <button type="button" class="tm-btn" data-i18n="m_settings">Настройки</button>
    <div class="tm-panel">
      <button id="b_snap" class="on">Сетка: вкл</button>
      <button id="b_fit" data-i18n="fit_view">Показать всё</button>
      <button id="b_play_target">Воспроизведение: ПК</button>
      <button id="b_theme" title="Светлая / тёмная тема" data-i18n-title="theme_tip">☀ Тема: тёмная</button>
      <button id="b_lang" title="Switch to English" data-i18n-title="lang_tip">Язык: RU</button>
    </div>
  </div>
  <button id="b_save" disabled data-i18n="save">Сохранить</button>
  <button id="b_sim_top" data-i18n="simulator">Симулятор</button>
  <button id="b_exit" onclick="exitEditor()"><span data-i18n="to_decoder">Выйти</span></button>
  <input type="file" id="f_import" accept=".json,application/json" class="hidden" />
  </div>
  <div class="hd-right">
    <button id="b_insp" class="mob" title="Настройки" data-i18n-title="insp_tip">⚙</button>
  </div>
</header>

<main>
  <aside class="left">
    <div class="mode-switch-wrap">
      <div class="seg" id="mode_switch" data-i18n-title="mode_hint">
        <button type="button" id="b_mode_mix" class="on" data-i18n="mode_mix">Миксы</button>
        <button type="button" id="b_mode_scheme" data-i18n="mode_scheme">Звуковые схемы</button>
      </div>
      <div class="scheme-bar hidden" id="scheme_bar">
        <label data-i18n="scheme_sel">Звуковые схемы</label>
        <div class="scheme-list" id="scheme_list"></div>
      </div>
    </div>
    <h2 data-i18n="palette_blocks">Блоки</h2>
    <div class="pal" id="palette"></div>
  </aside>

  <section id="stage" class="grid-bg">
    <div id="world">
      <svg id="links" width="6000" height="6000">
        <defs>
          <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M3 2 L9 6 L3 10" fill="none" stroke="#7fa4cf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
          </marker>
          <marker id="arrowTemp" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M3 2 L9 6 L3 10" fill="none" stroke="#4a9eff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
          </marker>
        </defs>
        <g id="linkLayer"></g>
        <path id="tempLink" class="temp hidden" marker-end="url(#arrowTemp)"></path>
      </svg>
      <div id="nodes"></div>
      <div id="texts"></div>
    </div>
    <div id="marquee"></div>
  </section>

  <aside class="right">
    <h2 data-i18n="block_setup">Настройка блока</h2>
    <div id="inspector"><p class="hint" data-i18n="select_hint">Выберите блок на холсте или добавьте новый слева.</p></div>
    <div class="right-status">
      <div id="status_txt" data-i18n="ready">Готово</div>
      <div id="return_bar" class="hidden" style="margin-top:8px"></div>
      <div class="diag" id="diag"></div>
    </div>
    <div id="block_legend"></div>
  </aside>
</main>

<script>
(function(){
"use strict";

/* ---- i18n (Russian / English), chosen by ?lang= or the site preference --- */
const I18N={
ru:{

function normalizeGraph(g){
  if(!Array.isArray(g.blocks))g.blocks=[];
  if(!Array.isArray(g.links))g.links=[];
  if(!Array.isArray(g.texts))g.texts=[];
  for(const b of g.blocks){
    if(!b||typeof b!=="object")continue;
    if(!b.files||typeof b.files!=="object")b.files={};
    if(b.type==="signal"){b.type="whistle";b.name=b.name||tr(BY_TYPE.whistle.name);}
    else if(b.type==="lightfx"||LEGACY_FX[b.type]!==undefined){b.effect=LEGACY_FX[b.type]!==undefined?LEGACY_FX[b.type]:(b.effect||0);b.type="output";b.channel=1;b.name=tr(BY_TYPE.output.name);}
    else if(b.type==="aux"){b.type="output";b.channel=((b.channel|0)+1)||1;b.name=tr(BY_TYPE.output.name);}
    else if(b.type==="headlight"){b.type="output";b.channel=0;b.name=tr(BY_TYPE.output.name);}
    if(!BY_TYPE[b.type]){b.type="output";b.channel=0;b.name=b.name||tr(BY_TYPE.output.name);}
    if(b.type==="set_var"&&(b.name==="Установить переменную"||b.name==="Set Variable"))b.name=tr(BY_TYPE.set_var.name);
    const cat=BY_TYPE[b.type];
    if(cat&&cat.kind==="output"){
      if(b.channel===undefined||(b.channel|0)<0||(b.channel|0)>7)b.channel=0;
      if(b.effect===undefined)b.effect=0;
      if(b.level===undefined)b.level=100;
      if(["auto","fwd","rev","any"].indexOf(b.dir)<0)b.dir="auto";
      if(["any","moving","stopped"].indexOf(b.state)<0)b.state="any";
    }
    if(cat&&cat.kind==="logicout"){
      if(!(b.op>=1&&b.op<=8))b.op=1;
      if(["fwd","rev","any"].indexOf(b.dir)<0)b.dir="any";
      if(["any","moving","stopped"].indexOf(b.state)<0)b.state="any";
    }
    if(cat&&cat.kind==="logicv"){if(!Array.isArray(b.conds))b.conds=[];if(b.join!=="or")b.join="and";}
    if(cat&&cat.kind==="var"){if(typeof b.varName!=="string")b.varName="";if(b.value===undefined||b.value===null)b.value=1;else b.value=Math.max(-32768,Math.min(32767,b.value|0));}
    if(cat&&cat.kind==="delay"){if(!(b.delayMs>0))b.delayMs=500;else b.delayMs=Math.max(50,Math.min(10000,b.delayMs));}
    if(cat&&cat.kind==="input"){if(!(b.fn>=0&&b.fn<=28))b.fn=nextFn(g);if(["toggle","hold","strobe"].indexOf(b.fxMode)<0)b.fxMode="toggle";}
    if(cat&&cat.kind!=="input")b.fn=-1;
    if(cat&&cat.kind==="cue"){if(typeof b.volume!=="number"||b.volume<0||b.volume>100)b.volume=100;}
    if(cat&&cat.mode==="mute"){if(!(b.outDelay>0))b.outDelay=500;}
    if(b.trigger===undefined||b.trigger==="fn")b.trigger="auto";
    if(b.outEvent===undefined)b.outEvent="finish";
    if(cat&&(cat.mode==="simple"||cat.mode==="loop"))b.outEvent="finish";
    if(b.outDelay===undefined)b.outDelay=0;
    if(b.shortMs===undefined)b.shortMs=400;
    if(b.type==="speed"){if(!Array.isArray(b.bands))b.bands=[0,SPEED_STEP,SPEED_STEP*2,SPEED_STEP*3].map((from,i,arr)=>({from:from,to:arr[i+1]==null?100:arr[i+1],file:""}));if(b.hyst==null)b.hyst=SPEED_HYST;}
    if(b.type==="random"&&!Array.isArray(b.files.random))b.files.random=["","","",""];
    if(b.type==="engine"){if(b.files&&Array.isArray(b.files.run)){b.run=b.files.run.map((f,i)=>({from:i*SPEED_STEP,to:(i+1)*SPEED_STEP,file:f||""}));delete b.files.run;}if(!Array.isArray(b.run))b.run=[0,25,50,75].map((f,i,a)=>({from:f,to:a[i+1]==null?100:a[i+1],file:""}));if(b.hyst==null)b.hyst=SPEED_HYST;}
    if(b.type==="volume"){if(b.master===undefined)b.master=20;if(b.engine===undefined)b.engine=20;if(b.effects===undefined)b.effects=20;}
  }
  g.texts.forEach(tx=>{if(!tx||typeof tx!=="object")return;if(typeof tx.text!=="string")tx.text="";if(typeof tx.x!=="number"||!isFinite(tx.x))tx.x=0;if(typeof tx.y!=="number"||!isFinite(tx.y))tx.y=0;if(!(tx.size>0))tx.size=16;});
}
function normalizeProject(p){
  if(!p||typeof p!=="object")return p;
  /* v1 (one flat graph) -> v2 (Mixes + named sound schemes). */
  if(!p.mix||typeof p.mix!=="object"){
    p.mix={blocks:Array.isArray(p.blocks)?p.blocks:[],links:Array.isArray(p.links)?p.links:[],texts:Array.isArray(p.texts)?p.texts:[]};
    delete p.blocks;delete p.links;delete p.texts;
  }
  ensureGraph(p.mix);
  if(!Array.isArray(p.schemes))p.schemes=[];
  p.schemes=p.schemes.filter(s=>s&&typeof s==="object");
  p.schemes.forEach((s,i)=>{if(!s.id)s.id="scheme"+(i+1);if(!s.name)s.name=t("scheme_new");ensureGraph(s);});
  p.schemaVersion=2;
  if(!Array.isArray(p.vars))p.vars=[];
  VAR_BUILTINS.forEach(bi=>{if(!p.vars.some(v=>v&&v.kind===bi.kind))p.vars.push({name:bi.name,kind:bi.kind,init:0});});
  p.vars.forEach(v=>{if(!v||typeof v!=="object")return;if(!v.kind)v.kind="user";if(!v.name)v.name=v.kind==="user"?"var":v.kind;if(v.kind!=="user"||v.init==null)v.init=0;});
  if(!p.editor)p.editor={};
  if(!p.editor.viewport)p.editor.viewport={x:40,y:40,zoom:1};
  if(!Array.isArray(p.editor.bindTuples))p.editor.bindTuples=[];
  if(!Array.isArray(p.editor.auxChannels))p.editor.auxChannels=[];
  if(p.editor.mode!=="scheme")p.editor.mode="mix";
  if(typeof p.editor.activeScheme!=="string")p.editor.activeScheme="";
  installGraphAccessors(p);
  viewMode=p.editor.mode;activeSchemeId=p.editor.activeScheme;
  normalizeGraph(p.mix);
  p.schemes.forEach(s=>normalizeGraph(s));
  /* Engine and Volume are fixed device settings and live in Mixes only. */
  withMix(()=>{if(!p.mix.blocks.some(b=>b.type==="engine"))addBlockTo(p,"engine");if(!p.mix.blocks.some(b=>b.type==="volume"))addBlockTo(p,"volume");});
  /* Migrate legacy standalone Brake blocks in Mixes into a Sound scheme + Sound cue connected to the Engine's Brake port. */
  const engBlk=p.mix.blocks.find(b=>b.type==="engine");
  const legacyBrakes=p.mix.blocks.filter(b=>b&&b.type==="brake");
  legacyBrakes.forEach(br=>{
    const wav=(br.files&&br.files.sound)||"bremse-anlegen_lokbremse.wav";
    const sName=br.name||t("default_brake_scheme");
    let sch=p.schemes.find(s=>s.id==="brake_scheme"||s.name===sName);
    if(!sch){
      let sid="brake_scheme",k=1;
      while(p.schemes.some(s=>s.id===sid))sid="brake_scheme_"+(k++);
      sch={id:sid,name:sName,blocks:[{id:"br_start",type:"start",name:sName,fn:-1,trigger:"auto",volume:br.volume||80,rate:1000,level:100,files:{sound:wav},outEvent:"finish",outDelay:0,shortMs:400,x:60,y:80}],links:[],texts:[]};
      normalizeGraph(sch);
      p.schemes.push(sch);
    }
    const hadIn=p.mix.links.some(l=>l.to===br.id);
    br.type="sound_cue";br.scheme=sch.id;br.files={};
    if(!hadIn&&engBlk){
      p.mix.links.push({id:nid("l",p.mix.links.map(l=>l.id)),from:engBlk.id,to:br.id,kind:"after",cond:"eng_brake"});
    }
  });
  return p;
}

function ensureGraph(g){if(!g.blocks)g.blocks=[];if(!g.links)g.links=[];if(!g.texts)g.texts=[];return g;}
function schemeById(id){return (project&&Array.isArray(project.schemes))?project.schemes.find(s=>s&&s.id===id):null;}
function activeScheme(){if(!project||!Array.isArray(project.schemes))return null;let s=schemeById(activeSchemeId);if(!s)s=project.schemes[0]||null;if(s)activeSchemeId=s.id;return s;}
function curGraph(){if(viewMode==="scheme"){const s=activeScheme();if(s)return ensureGraph(s);}return ensureGraph(project.mix);}
function installGraphAccessors(p){
  const pick=()=>{
    if(viewMode==="scheme"){
      const list=Array.isArray(p.schemes)?p.schemes:[];
      let s=list.find(x=>x&&x.id===activeSchemeId)||list[0];
      if(s)return ensureGraph(s);
    }
    return ensureGraph(p.mix);
  };
  ["blocks","links","texts"].forEach(key=>Object.defineProperty(p,key,{configurable:true,enumerable:false,get(){return pick()[key];},set(v){pick()[key]=v;}}));
}
function newScheme(name){
  const ids=(project.schemes||[]).map(s=>s&&s.id);
  const s={id:nid("scheme",ids),name:name||t("scheme_new"),blocks:[],links:[],texts:[]};
  project.schemes.push(s);return s;
}
function withMix(fn){const s=viewMode;viewMode="mix";try{return fn();}finally{viewMode=s;}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const labelKey=s=>String(s||"").toLowerCase().replace(/[^a-zа-яё0-9]+/gi,"");
const sameLabel=(a,b)=>labelKey(a)===labelKey(b);
const blockName=b=>{if(!b)return "";const cat=BY_TYPE[b.type];if(!b.name)return cat?tr(cat.name):"";if(cat&&(b.name===cat.name.ru||b.name===cat.name.en))return tr(cat.name);return b.name;};
const schemeName=()=>{const n=project&&project.name;if(n===I18N.ru.new_scheme_name||n===I18N.en.new_scheme_name)return t("new_scheme_name");return n||(project&&project.id)||"";};
const hexA=(hex,a)=>{const h=hex.replace("#","");const n=parseInt(h.length===3?h.split("").map(x=>x+x).join(""):h,16);return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";};
const pctSpeed=p=>Math.max(0,Math.min(255,Math.round((Number(p)||0)*255/100)));
const snap=v=>project.editor.snap?Math.round(v/GRID)*GRID:Math.round(v);

function newProject(){
  const p={format:"sound-blocks",schemaVersion:2,id:"blocks_graph",name:t("new_scheme_name"),
    mix:{blocks:[],links:[],texts:[]},schemes:[],
    vars:VAR_BUILTINS.map(bi=>({name:bi.name,kind:bi.kind,init:0})),
    editor:{viewport:{x:40,y:40,zoom:1},snap:true,bindTuples:[],auxChannels:[],mode:"mix",activeScheme:""}};
  installGraphAccessors(p);
  withMix(()=>{addBlockTo(p,"engine");addBlockTo(p,"volume");
    const e=p.blocks.find(b=>b.type==="engine"),v=p.blocks.find(b=>b.type==="volume");
    if(e){e.x=80;e.y=120;}if(v){v.x=430;v.y=120;}});
  return p;
}

  installGraphAccessors(p);
  const add=(g,id,type,props)=>{
    const cat=BY_TYPE[type];
    const b={id,type,name:tr(cat.name),fn:-1,trigger:"auto",volume:80,rate:1000,level:100,
      files:{},outEvent:"finish",outDelay:0,shortMs:400,x:0,y:0};
    if(cat.kind==="input"){b.fn=0;b.fxMode="toggle";}
    if(cat.kind==="output"){b.channel=0;b.effect=0;b.level=100;b.dir="auto";b.state="any";}
    if(cat.kind==="logicout"){b.op=1;b.dir="auto";b.state="any";}
    if(cat.kind==="cue"){b.scheme="";b.volume=100;}
    if(type==="engine"){b.files={};b.run=[];}
    (cat.roles||[]).forEach(r=>{b.files[r]="";});
    Object.assign(b,props||{});
    g.blocks.push(b);return b;
  };
  const link=(g,a,b,cond)=>g.links.push({id:"dl"+g.links.length+"_"+(a.id||"x"),from:a.id,to:b.id,kind:"after",cond:cond||"out"});
  const bind=(g,a,b,cond)=>g.links.push({id:"db"+g.links.length+"_"+(a.id||"x"),from:a.id,to:b.id,kind:"bind",cond:cond||"true"});

      const conds=(b.conds||[]).filter(c=>c&&varIndexByName(c.var)>=0);
      const mkCond=(c,neg)=>{let op=(c.op|0);if(!!c.not!==!!neg)op=NEG_OP[op];const cond={type:"var_cmp",var:varIndexByName(c.var),op:op};
        const rv=varIndexByName(c.rhsVar);if(c.rhsVar&&rv>=0)cond.var2=rv;else cond.value=Math.max(-32768,Math.min(32767,c.value|0));return cond;};

        if(b.join==="or"){

      if(b.files.sound&&trigs.length){const ph=b.id+"_play";addState(ph,blockName(b),b.files.sound,false,vol,rate);

      addState(b.id+"_idle",t("s_engine_idle"),idle,true,vol,rate);
      runs.forEach((x,i)=>addState(b.id+"_run"+i,t("s_engine_run")+(i+1),x.file,true,vol,rate));

      if(has(start))addEdge(b.id+"_start",b.id+"_idle",{type:"sample_done"},10);
      const stopTarget=has(stop)?b.id+"_stop":b.id+"_off";

      if(has(start))addEdge(b.id+"_start",stopTarget,{type:"engine_off"},255);

    }
    const isEngOwned=engineChainIds.has(b.id);

    const mode0=BY_TYPE[b.type].mode;
    const isChainedPrimitive=isEngOwned||((mode0==="end"||mode0==="simple"||mode0==="loop"||mode0==="mute"||mode0==="start")&&!inputTrigs(b.id).length&&!directTargets.has(b.id)&&graphHasIn(b.id));
    if(!isChainedPrimitive)silent(entry,blockName(b)+t("s_silent_in"));
    if(mode0==="speed"){

      bands.forEach(x=>{const s=b.id+"_sp"+items.length;addState(s,blockName(b)+" "+Math.round(x.from||0)+"-"+Math.round(x.to==null?100:x.to)+"%",x.file,true,vol,rate);items.push({state:s,lo:pctSpeed(x.from),hi:pctSpeed(x.to==null?100:x.to)});});

      if(b.files.sound){

        if(trigs.length){

          const armed=b.id+"_armed";silent(armed,blockName(b)+t("s_choose"));

        }

      continue;
    }
    if(mode0==="random"){
      const files=(Array.isArray(b.files.random)?b.files.random:[]).filter(Boolean),rStarts=inputTrigs(b.id);

        files.forEach((f,i)=>{const s=b.id+"_r"+i;addState(s,blockName(b)+" "+(i+1),f,false,vol,rate);addEdge(ready,s,{type:"random",min:100},10);addEdge(s,done,{type:"sample_done"},10);});
        addEdge(done,entry,{type:"sample_done"},5);

    }

    if(mode0==="start"){
      /* Start is a normal sounding block. If it is the scheme root, the cue's

      const trigs=inputTrigs(b.id);
      const trig=trigs[0]||null;
      const hasAfterIn=project.links.some(l=>{if(l.to!==b.id||l.kind!=="after")return false;const f=project.blocks.find(x=>x.id===l.from);return !!f&&BY_TYPE[f.type].kind!=="input"&&f.type!=="engine";});
      startCondOf[b.id]=trig;

      if(!isEngOwned&&b.files.sound&&(trigs.length||directTargets.has(b.id)))effects.push({id:b.id,entry,fn:(lFn!=null?lFn:0),hasFn:(lFn!=null),label:b.cueName||blockName(b)});

      if(trigs.length||directTargets.has(b.id))effects.push({id:b.id,entry,fn:(mFn!=null?mFn:0),hasFn:(mFn!=null),label:b.cueName||blockName(b)});

      const hasShort=!!b.files.short;
      if(hasShort)addState(b.id+"_short",blockName(b)+t("s_short"),b.files.short,false,vol,rate);

      if(hasShort&&first&&startCond){

      audible[b.id]=first||(hasShort?b.id+"_short":"");

    }else if(mode==="loopHeld"){
      if(b.files.sound){addState(b.id+"_loop",blockName(b),b.files.sound,true,vol,rate);

        const stops=[];
        if(trig==="speed"){
          if(speedRange.min>0){const c={type:"speed",min:0,max:speedRange.min-1};addEdge(b.id+"_loop",entry,c,5,"after_sample");stops.push(c);}

        }else{

        }

      if(b.files.sound){addState(b.id+"_play",blockName(b),b.files.sound,true,vol,rate);
        if(startCond)addEdge(entry,b.id+"_play",startCond,10);
        const held=startCond||triggerCondOf(b.id);
        if(held){const c=holdStopOf(held)||stopCond||{type:"sample_done"};addEdge(b.id+"_play",entry,c,10);stopCondOf[b.id]=c;}

  const controlPort=(b,l)=>{

    if(cat.kind==="logicv"){const port=l.cond==="false"?"false":"true";return {state:b.id+(port==="false"?"_false":"_true"),cond:{type:"state_enter"},port:port};}
    if(cat.kind==="var")return {state:ctlEntry[b.id],cond:{type:"state_enter"},port:"out"};
    return {state:ctlEntry[b.id],cond:{type:"timeout",min:Math.max(1,Math.min(255,Math.round((b.delayMs||500)/50)))},port:"out"};
  };
  for(const l of project.links){
    if(l.kind!=="after")continue;
    const from=project.blocks.find(x=>x.id===l.from),to=project.blocks.find(x=>x.id===l.to);
    if(!from||!to)continue;
    const fk=BY_TYPE[from.type].kind,tk=BY_TYPE[to.type].kind;
    if(fk==="output"||fk==="input"||fk==="engine")continue;   /* input/engine links are triggers, output links are binds */

      const src=controlPort(from,l);
      const dst=tk==="output"?null:(tk==="sound"?audible[to.id]:entryOf(to.id));
      if(!src.state||!src.cond){dropped.push({id:from.id,reason:"src"});continue;}
      if(!dst){dropped.push({id:to.id,reason:"dst"});continue;}
      addEdge(src.state,dst,src.cond,prioFor(src.state));
      continue;
    }
    const delay=(BY_TYPE[from.type].mode==="mute")?0:Math.max(0,from.outDelay|0);
    const waitUnits=Math.max(1,Math.min(255,Math.round(delay/50)));
    if(tk==="sound"||tk==="cue"){
      const a=audible[to.id];if(!a){dropped.push({id:to.id,reason:"dst"});continue;}
      const ev=from.outEvent==="start"?"start":"finish";
      const stop=stopCondOf[from.id];
      const conds=(ev==="start"?[startCondOf[from.id]]:(Array.isArray(stop)?stop:[stop||{type:"sample_done"}])).filter(Boolean);
      const srcState=ev==="start"?(to.id+"_off"):terminal[from.id];
      if(!srcState||!conds.length){dropped.push({id:from.id,reason:"src"});continue;}
      const prio=prioFor(srcState);
      const edgeTiming=(c)=>c&&c.type==="speed"?"after_sample":"immediate";
      if(delay>0){const w=from.id+"_w"+(++waitN);silent(w,blockName(from)+t("s_delay"));conds.forEach(c=>addEdge(srcState,w,c,prioFor(srcState),edgeTiming(c)));addEdge(w,a,{type:"timeout",min:waitUnits},prio);}
      else conds.forEach(c=>addEdge(srcState,a,c,prioFor(srcState),edgeTiming(c)));
    }else{
      const dst=tk==="output"?null:entryOf(to.id),srcState=terminal[from.id]||audible[from.id];
      if(!srcState||!dst){dropped.push({id:from.id,reason:"src"});continue;}
      const rawCond=stopCondOf[from.id]||{type:"sample_done"};
      const conds=Array.isArray(rawCond)?rawCond:[rawCond];
      const edgeTiming=(c)=>c&&c.type==="speed"?"after_sample":"immediate";
      if(delay>0){
        const w=from.id+"_w"+(++waitN);silent(w,blockName(from)+t("s_delay"));
        conds.forEach(c=>{if(c)addEdge(srcState,w,c,prioFor(srcState),edgeTiming(c));});

     chain root so the next F press can play the whole chain again. */
  const baseEntryOf=id=>{
    if(engineChainIds.has(id))return engineEntry;
    const b=project.blocks.find(x=>x.id===id),k=b&&BY_TYPE[b.type]&&BY_TYPE[b.type].kind;
    if(k==="logicv"||k==="var"||k==="delay")return id+"_off";

  for(const b of project.blocks){
    const cat=BY_TYPE[b.type];
    if(!cat)continue;

      const trig=inputTrigs(b.id)[0]||triggerCondOf(b.id)||null;
      if(trig&&(trig.type==="fn_on"||trig.type==="fn_press")){

        if(endBlk&&endBlk.files&&endBlk.files.sound){

        }
      }
    }
    if(cat.mode==="speed"||cat.mode==="decel")continue; /* ambient blocks have no chain completion */
    if(cat.kind!=="sound"&&cat.kind!=="logicv"&&cat.kind!=="var"&&cat.kind!=="delay")continue;
    const root=chainRootOf(b.id);
    if(root==null||root===b.id)continue;
    const dst=baseEntryOf(root);if(!dst)continue;
    if(cat.mode==="end"){
      const term=b.id+"_end";
      if(term!==dst)addEdge(term,dst,{type:"sample_done"},5);
    }else if(cat.kind==="logicv"||cat.kind==="var"||cat.kind==="delay"){
      const src=b.id+"_off";
      if(src!==dst&&transitions.some(t=>t.target===src)&&!transitions.some(t=>t.source===src&&t.target===dst))addEdge(src,dst,{type:"sample_done"},5);
    }else{
      const src=entryOf(b.id);
      if(states.some(s=>s.id===src)&&src!==dst)addEdge(src,dst,{type:"sample_done"},5);
      else if(!states.some(s=>s.id===src)&&isLeaf(b.id)&&terminal[b.id]){
        const stops=Array.isArray(stopCondOf[b.id])?stopCondOf[b.id]:[stopCondOf[b.id]||{type:"sample_done"}];
        stops.forEach((c,i)=>{if(c)addEdge(terminal[b.id],dst,c,10+i);});
      }
    }
  }
  const positions={};project.blocks.forEach(b=>positions[b.id]={x:b.x,y:b.y});
  const vars=(project.vars||[]).map(v=>v.kind==="user"?{name:v.name,kind:"user",init:(v.init|0)}:{name:v.name,kind:v.kind});
  const hystUnits=speedHysts.length?Math.max.apply(null,speedHysts.map(p=>Math.max(0,Math.min(32,pctSpeed(p))))):(engine?Math.max(0,Math.min(32,pctSpeed(engine.hyst==null?SPEED_HYST:engine.hyst))):0);
  /* Global logic/var/delay blocks (no input and no incoming control link) run
     once at startup and keep their resulting state; this flag makes the runner
     tick from boot so they can be evaluated. */
  const observers=project.blocks.some(b=>{const k=BY_TYPE[b.type]&&BY_TYPE[b.type].kind;return (k==="logicv"||k==="var"||k==="delay")&&!graphHasIn(b.id)&&!inputTrigs(b.id).length;});
  const payload={format:"sound-graph",schemaVersion:1,id:project.id,name:project.name,
    engine:{entry:engineEntry,fn:engine?engineFn:255,hold:!!(engineInBlock&&engineInBlock.fxMode!=="toggle")},hysteresis:hystUnits,observers:observers,
    variables:vars,states,transitions,effects,assets:Object.keys(assets).map(f=>assets[f]),
    editor:{positions,viewport:project.editor.viewport}};
  /* Keep an editor copy inside the ignored `editor` object so a project can be
     loaded back from the device. It is optional and omitted when it would push
     the request over the device body limit. */
  const v2={format:"sound-blocks",schemaVersion:2,id:project.id,name:project.name,
    mix:project.mix||{blocks:project.blocks,links:project.links,texts:project.texts||[]},
    schemes:project.schemes||[],vars:project.vars||[],
    editor:{viewport:project.editor.viewport,snap:project.editor.snap,mode:project.editor.mode,activeScheme:project.editor.activeScheme}};
  payload.editor.project=v2;
  let noEditorCopy=false;
  try{if(new TextEncoder().encode(JSON.stringify(payload)).length>120000){delete payload.editor.project;noEditorCopy=true;}}catch(e){delete payload.editor.project;noEditorCopy=true;}
  return {payload,files:[...files],dropped,noEditorCopy};
}

/* ---- compile outputs -> func_binding_t ------------------------------- */
function outputBlocks(){return project.blocks.filter(b=>BY_TYPE[b.type].kind==="output");}
/* Resolve the F-key that actually drives a block by walking incoming links
   back to an Input (Fx), a cue or a legacy F-keyed sound. Logic/Var/Delay
   blocks do not own an F-key, so they are transparent here. */
function triggerFnOf(id,seen){
  seen=seen||0;if(seen>40)return null;
  const b=project.blocks.find(x=>x.id===id);if(!b)return null;
  for(const l of project.links){
    if(l.to!==id)continue;
    const fn=triggerFnOf(l.from,seen+1);
    if(fn!=null)return fn;
  }
  const cat=BY_TYPE[b.type]||{};
  if(cat.kind==="input")return (b.fn>=0&&b.fn<=28)?b.fn:null;
  return null;
}
function sourceFnsOf(id){
  const out=[],seen=new Set();
  for(const l of project.links){
    if(l.to!==id)continue;
    const fn=triggerFnOf(l.from);
    if(fn!=null&&fn>=0&&fn<=28&&!seen.has(fn)){seen.add(fn);out.push(fn);}
  }

}
function sourceFnOf(id){const f=sourceFnsOf(id);return f.length?f[0]:null;}

  seen=seen||0;if(seen>40)return null;

    if(l.to!==id)continue;
    const f=project.blocks.find(x=>x.id===l.from);if(!f)continue;
    const fc=BY_TYPE[f.type]||{};
    if(fc.kind==="input")return (f.fn>=0&&f.fn<=28)?("F"+f.fn):null;
    if(f.type==="engine")return enginePortLabel(f,l.cond||"eng_idle");
    const up=sourceLabelOf(f.id,seen+1);
    if(up)return up;
  }

}

   reuses legacy binding fields, so only value comparisons are representable:
   up to two conditions, AND/OR, plus the False branch inversion. */
function upstreamLogicLinkOf(id,seen){
  seen=seen||0;if(seen>40)return null;
  for(const l of project.links){
    if(l.to!==id)continue;
    const src=project.blocks.find(b=>b.id===l.from);
    if(!src)continue;
    if(src.type==="logic")return l;
    const up=upstreamLogicLinkOf(src.id,seen+1);
    if(up)return up;
  }
  return null;
}
function bindingCondOf(link){
  let targetLink=link;
  let src=project.blocks.find(b=>b.id===targetLink.from);
  if(src&&src.type!=="logic"){
    const up=upstreamLogicLinkOf(src.id);
    if(up){targetLink=up;src=project.blocks.find(b=>b.id===up.from);}
  }
  if(!src||src.type!=="logic")return null;
  const conds=(src.conds||[]).filter(c=>c&&varIndexByName(c.var)>=0);
  if(!conds.length)return null;
  if(conds.length>2||conds.some(c=>c.rhsVar))return {unsupported:true};
  const enc=c=>{let op=c.op|0;if(c.not)op=NEG_OP[op];return{var:varIndexByName(c.var)&0x0F,op:op&0x07,val:Math.max(-32768,Math.min(32767,c.value|0))};};

  const out=[];

    const cond=bindingCondOf(l);
    if(cond&&cond.unsupported)continue; /* fail closed; validate() warns */

function desiredBindings(){

    const c=cond&&!cond.unsupported?cond:null;
    const ck=c?[c.flags,c.short,c.short_ms,c.min_ms,c.fade_ms].join("."):"";
    const k=fn+":"+type+":"+id+":"+(dir|0)+":"+(state|0)+":"+ck;if(seen.has(k))return;seen.add(k);

    for(const e of sourceBindingEntries(b)){

      if(ch===0){

        else if(b.dir==="fwd")add(fn,1,0,1,state,e.cond);

/* Device AUX indices: 0=F0F, 1=F0R, 2..8=AUX1..7. Editor channels are

function auxConfigs(){
  const out=[],seen=new Set();
  const add=(ch,level,effect)=>{if(ch<0||ch>8||seen.has(ch))return;seen.add(ch);out.push({ch,level:level|0,effect:effect|0});};
  for(const b of outputBlocks()){
    const ch=b.channel|0,level=Math.max(0,Math.min(100,b.level|0)),effect=b.effect|0;

const bindKey=b=>b.fn+":"+b.type+":"+b.id+":"+(b.dir|0)+":"+(b.state|0)+":"+(b.flags|0)+":"+(b.short|0)+":"+(b.short_ms|0)+":"+(b.min_ms|0)+":"+(b.fade_ms|0);

/* ---- client validation ---------------------------------------------- */
function validate(){return withMix(_validate);}
function _validate(){
  const {payload,files,dropped,noEditorCopy}=compile();const out=[];
  const err=(id,message)=>out.push({id,message,severity:"error"});
  const warn=(id,message)=>out.push({id,message,severity:"warning"});
  if(noEditorCopy)warn("",t("v_no_editor_copy"));
  if(payload.states.length>LIMITS.states)err("",t("v_states_a")+payload.states.length+t("v_states_b")+LIMITS.states+t("v_states_c"));
  if(payload.states.filter(s=>s.file).length>LIMITS.soundStates)err("",t("v_sound_states_a")+LIMITS.soundStates+".");
  if(payload.states.filter(s=>!s.file).length>LIMITS.silentStates)err("",t("v_silent_a")+LIMITS.silentStates+".");
  if(payload.transitions.length>LIMITS.transitions)err("",t("v_transitions_a")+payload.transitions.length+t("v_transitions_b")+LIMITS.transitions+".");
  if(payload.effects.length>LIMITS.effects)err("",t("v_effects_a")+LIMITS.effects+".");
  if(files.length>LIMITS.assets)err("",t("v_assets_a")+LIMITS.assets+".");
  if(!/^[A-Za-z0-9_-]{1,31}$/.test(project.id||""))err("",t("v_bad_project_id"));
  if(!project.name||new TextEncoder().encode(String(project.name)).length>63)err("",t("v_bad_project_name"));
  /* Device schema: variables are limited to 16 entries with 23-byte names. */
  const vars=payload.variables||[];
  const utf8Len=s=>{try{return new TextEncoder().encode(String(s||"")).length;}catch(e){return String(s||"").length;}};
  if(vars.length>16)err("",t("v_var_limit_a")+vars.length+t("v_var_limit_b")+16+".");
  const varSeen={};
  vars.forEach(v=>{
    if(!v||!v.name||utf8Len(v.name)>23)err("",t("v_var_name")+(v&&v.name||""));
    else if(varSeen[v.name])err("",t("v_dup_var")+v.name);else varSeen[v.name]=true;
    if(v&&v.kind!=="user"&&v.init!=null&&v.init!==0)err("",t("v_var_builtin_init")+(v.name||""));
  });

     (and could turn a Logic block into "always true"). */
  const varNames=new Set(vars.map(v=>v.name));
  const allGraphs=(project.mix?[project.mix]:[]).concat(project.schemes||[]);
  allGraphs.forEach(g=>(g.blocks||[]).forEach(b=>{
    if(b.type==="set_var"&&!varNames.has(b.varName))err(b.id,t("v_unknown_var")+(b.varName||"?"));
    if(b.type==="logic"&&(!Array.isArray(b.conds)||!b.conds.length))err(b.id,t("v_logic_empty"));
    if(b.type==="logic"&&Array.isArray(b.conds))b.conds.forEach(c=>{
      if(!varNames.has(c.var))err(b.id,t("v_unknown_var")+(c.var||"?"));
      if(c.rhsVar&&!varNames.has(c.rhsVar))err(b.id,t("v_unknown_var")+c.rhsVar);

  const cueBlocks=project.blocks.filter(b=>BY_TYPE[b.type]&&BY_TYPE[b.type].kind==="cue");
  for(const cue of cueBlocks){
    const hasIn=project.links.some(l=>l.to===cue.id);
    if(!hasIn)err(cue.id,t("v_cue_trigger"));
    if(!cue.scheme){
      if(!cue.files.sound)err(cue.id,t("v_cue_empty"));
      continue;
    }
    const s=schemeById(cue.scheme);
    if(!s){err(cue.id,t("v_cue_scheme_missing"));continue;}
    if(!(s.blocks||[]).length)err(cue.id,t("v_scheme_empty"));
  }
  /* Every scheme root is reachable: the cue's trigger is applied to the
     root block(s) during expansion, so a scheme may start with Mute/Var/Delay

     chain. Diagnose them before the device-side validator does. */
  const checkBlockSound=b=>{
    const cat=BY_TYPE[b.type];if(!cat)return;
    const m=cat.mode;
    if(cat.kind==="engine"){
      const runs=engineRuns(b);
      if(!runs.length)warn(b.id,t("tb_no_steps"));
      else if(runs.some(x=>x&&(x.from|0)>(x.to==null?100:x.to|0)))warn(b.id,t("v_bad_band"));
      return;
    }
    if(cat.kind!=="sound")return;
    if(b.trigger==="speed"&&(b.speedMin==null?0:b.speedMin|0)>(b.speedMax==null?100:b.speedMax|0))warn(b.id,t("v_bad_band"));
    if(m==="start"||m==="simple"||m==="loop"||m==="end"){if(!b.files.sound)err(b.id,t("tb_no_wav"));return;}
    if(m==="mute")return;
    if(m==="speed"){
      if(!(b.bands||[]).some(x=>x&&x.file))err(b.id,t("tb_no_band"));
      else if((b.bands||[]).some(x=>x&&(x.from|0)>(x.to==null?100:x.to|0)))warn(b.id,t("v_bad_band"));
      return;
    }
    if(m==="random"){if(!(b.files.random||[]).some(Boolean))err(b.id,t("tb_no_sound"));return;}
    if(!(cat.roles||[]).some(r=>b.files[r]))err(b.id,t("tb_no_wav"));
  };
  const usedSchemes=(project.schemes||[]).filter(s=>cueBlocks.some(c=>c.scheme===s.id));
  [project.mix,...usedSchemes].forEach(g=>(g.blocks||[]).forEach(checkBlockSound));
  /* Device schema: ids are [A-Za-z0-9_-] under 32 chars, effect fn 0..28. */
  const idOk=s=>/^[A-Za-z0-9_-]{1,31}$/.test(String(s||""));
  payload.states.forEach(s=>{if(!idOk(s.id))err("",t("v_bad_id")+s.id);});
  payload.transitions.forEach(x=>{if(!idOk(x.id))err("",t("v_bad_id")+x.id);});
  payload.effects.forEach(e=>{if(!idOk(e.id)||!(e.fn>=0&&e.fn<=28))err(e.id,t("v_bad_effect")+(e.id||""));});
  const silent=new Set(payload.states.filter(s=>!s.file).map(s=>s.id));
  if(!silent.has(payload.engine.entry))err("",t("v_engine_entry"));
  payload.effects.forEach(e=>{if(!silent.has(e.entry))err(e.id,t("v_effect_entry"));});
  const used={};payload.transitions.forEach(e=>{const k=e.source+":"+e.priority;
    if(used[k]){if(!(e.condition&&e.condition.type==="random"&&used[k].condition&&used[k].condition.type==="random"))err(e.id,t("v_dup_prio_a")+e.source+".");}
    else used[k]=e;});
  const ids=new Set(payload.states.map(s=>s.id));
  payload.transitions.forEach(e=>{if(!ids.has(e.source))err(e.id,t("v_no_state_a")+e.source);if(!ids.has(e.target))err(e.id,t("v_no_state_a")+e.target);});
  /* The device rejects unreachable states. Check the same before saving so an
     empty Start or a dropped chain is reported locally in plain language. */
  const reached=new Set([payload.engine.entry,...payload.effects.map(e=>e.entry)]);
  for(let pass=0;pass<payload.states.length;pass++){
    let changed=false;
    payload.transitions.forEach(e=>{if(reached.has(e.source)&&!reached.has(e.target)){reached.add(e.target);changed=true;}});
    if(!changed)break;
  }
  payload.states.forEach(s=>{if(!reached.has(s.id))err(s.id,t("v_unreachable")+s.id);});
  files.forEach(f=>{if(assetsReady&&!assets[f])warn("",t("v_no_wav_a")+f+t("v_no_wav_b"));});
  for(const b of outputBlocks()){
    if((b.channel|0)>7||(b.channel|0)<0)err(b.id,t("v_bad_aux"));
    if(sourceFnOf(b.id)==null)err(b.id,t("v_output_no_src"));
  }
  for(const b of project.blocks.filter(x=>BY_TYPE[x.type]&&BY_TYPE[x.type].kind==="logicout")){
    if((b.op|0)<1||(b.op|0)>8)err(b.id,t("v_bad_logic"));
    if(sourceFnOf(b.id)==null)err(b.id,t("v_output_no_src"));
  }
  for(const l of project.links){
    const a=project.blocks.find(x=>x.id===l.from),c=project.blocks.find(x=>x.id===l.to);
    if(a&&c&&BY_TYPE[a.type]&&BY_TYPE[c.type]&&
       (BY_TYPE[c.type].kind==="output"||BY_TYPE[c.type].kind==="logicout")&&
       (BY_TYPE[a.type].kind==="logicv"||BY_TYPE[a.type].kind==="var"||BY_TYPE[a.type].kind==="delay")){
      if(BY_TYPE[a.type].kind!=="logicv")warn(c.id,t("v_logic_bind"));
      else if(!bindingCondOf(l))warn(c.id,t("v_logic_bind"));
      else if(bindingCondOf(l).unsupported)warn(c.id,t("v_logic_bind_complex"));
    }
    if(a&&a.type==="engine"){
      const n=engineRuns(a).length,idle=l.cond==="eng_idle"||l.cond==="eng_brake",m=l.cond?String(l.cond).match(/^eng(\d+)$/):null;
      if(l.cond&&!idle&&(!m||(+m[1])>=n))err(l.id,t("v_bad_engine_port"));
      if(c&&(BY_TYPE[c.type].kind==="output"||BY_TYPE[c.type].kind==="logicout"))err(l.id,t("v_engine_out_bind"));
    }
  }
  /* F is a property of Input (Fx) only. Every other block gets its trigger from
     a link, so duplicate-F diagnostics apply exclusively to inputs. */
  const fnUse={};const addUse=(f,who)=>{if(f==null||f<0||f>28)return;(fnUse[f]=fnUse[f]||[]).push(who);};
  project.blocks.forEach(b=>{const c=BY_TYPE[b.type];if(c&&c.kind==="input")addUse(b.fn,t("v_name_l")+blockName(b)+t("v_name_r"));});
  Object.keys(fnUse).forEach(f=>{if(fnUse[f].length>1)warn("","F"+f+t("v_multiple_a")+fnUse[f].join(", ")+".");});
  (dropped||[]).forEach(d=>warn(d.id,d.reason==="src"?t("v_link_dropped_src"):t("v_link_dropped_dst")));
  for(const b of project.blocks){
    const c=BY_TYPE[b.type],m=c&&c.mode;
    const hasIn=project.links.some(l=>l.to===b.id);
    if(m==="simple"||m==="loop"||m==="mute"||m==="end"){
      if(!hasIn)err(b.id,t("v_no_link_in"));
    }
    /* Legacy one-shot/latch/loop/random presets have no F-key of their own:
       they need an Input/Engine link (ambient speed/decel blocks do not). */
    if(c&&c.kind==="sound"&&(m==="oneshot"||m==="shortLong"||m==="latched"||m==="loopHeld"||m==="random")&&
       (!b.trigger||b.trigger==="auto"||b.trigger==="fn")&&!hasIn)err(b.id,t("v_no_link_in"));
  }
  const fxSeen={},chSeen={};
  project.blocks.forEach(b=>{const c=BY_TYPE[b.type];if(!c)return;
    if(c.kind==="input"){const k=b.fn;if(fxSeen[k]!==undefined)warn(b.id,t("v_dup_fx"));else fxSeen[k]=b.id;}
    if(c.kind==="output"){const k=b.channel|0;if(chSeen[k]!==undefined)warn(b.id,t("v_dup_ch"));else chSeen[k]=b.id;}});
  /* Parallel fan-out is supported only for Input (Fx): its links assign triggers
     and every target becomes its own channel. Other blocks keep a single branch. */
  const checkMultiBranch=g=>{
    (g.blocks||[]).forEach(b=>{const c=BY_TYPE[b.type];if(!c||c.kind==="input"||c.kind==="output"||c.kind==="logicout"||c.kind==="setting"||c.kind==="engine")return;
      if(c.kind==="logicv"){
        ["true","false"].forEach(port=>{
          const n=(g.links||[]).filter(l=>{if(l.from!==b.id||l.kind!=="after"||(l.cond||"true")!==port)return false;const tb=(g.blocks||[]).find(x=>x.id===l.to),tc=tb?BY_TYPE[tb.type]:null;return tc&&tc.kind!=="output"&&tc.kind!=="logicout";}).length;
          if(n>1)warn(b.id,t("v_multi_branch"));
        });
        return;
      }
      const n=(g.links||[]).filter(l=>{if(l.from!==b.id||l.kind!=="after")return false;const tb=(g.blocks||[]).find(x=>x.id===l.to),tc=tb?BY_TYPE[tb.type]:null;return tc&&tc.kind!=="output"&&tc.kind!=="logicout";}).length;
      if(n>1)warn(b.id,t("v_multi_branch"));});
  };
  [project.mix,...(project.schemes||[])].filter(Boolean).forEach(checkMultiBranch);
  return {payload,files,diagnostics:out};
}

async function req(path,init){
  const r=await fetch(path,Object.assign({cache:"no-store"},init||{}));
  let data;try{data=JSON.parse(await r.text());}catch(e){throw new Error(t("err_not_json")+r.status+")");}
  if(!r.ok||data.ok!==true)throw new Error(data.error||(t("err_http")+r.status));
  return data;
}
const qs=o=>Object.keys(o).map(k=>encodeURIComponent(k)+"="+encodeURIComponent(o[k])).join("&");
async function refreshStatus(){
  try{
    const s=await req("/api/sound/graph/state");online=true;
    const srvRev=Number(s.revision)||0;
    const srvId=s.id||"";
    if(srvId&&srvRev>0&&(srvId!==savedId||srvRev!==revision)&&!localStorage.getItem(STORE_KEY)){
      try{
        const full=await req("/api/sound/graph/project?"+qs({id:srvId,revision:srvRev}));
        const embedded=full&&full.project&&full.project.editor&&full.project.editor.project;
        if(embedded&&embedded.format==="sound-blocks"){
          project=normalizeProject(JSON.parse(JSON.stringify(embedded)));
        }else if(full&&full.project){
          const restored=reverseGraphToProject(full.project,full.project.name||srvId);
          if(restored&&restored.project)project=restored.project;
        }
        savedId=srvId;revision=srvRev;
        render();
      }catch(e){}
    }
    revision=srvRev;if(srvId)savedId=srvId;
  }catch(e){online=false;}
  $("on").classList.toggle("on",online);$("on_txt").textContent=online?t("connected"):t("offline");
  try{const sf=await req("/api/sound-files");soundFiles=(sf.files||[]).filter(f=>/\.wav$/i.test(f));}catch(e){soundFiles=[];}
  try{const rb=await req("/api/func-map?view=bind");deviceBinds=rb.binds||[];}catch(e){deviceBinds=[];}
  try{const ax=await req("/api/aux/cfg");deviceAux=ax.aux||[];}catch(e){deviceAux=[];}
  refreshButtons();
}
async function fetchAssets(files,force,progress){
  const list=Array.from(files||[]);
  let done=0;
  for(const f of list){
    if(!force&&assets[f]){done++;if(progress)progress(done,list.length,f);continue;}
    if(force)delete assets[f];
    try{const a=await req("/api/sound/graph/asset?file="+encodeURIComponent(f));assets[f]=a.asset;}catch(e){delete assets[f];}
    done++;
    if(progress)progress(done,list.length,f);
  }
  assetsReady=true;
}
function refreshAssets(){try{const c=compile();fetchAssets(c.files).then(()=>render()).catch(()=>{});}catch(e){}}
async function doValidate(){
  if(busy)return;busy=true;refreshButtons();setStatus(t("st_checking"));
  try{const v=validate();await fetchAssets(v.files);const v2=validate();diagnostics=v2.diagnostics;
    if(online){try{const r=await req("/api/sound/graph/validate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v2.payload)});if(r.diagnostics)r.diagnostics.forEach(d=>diagnostics.push(d));}catch(e){diagnostics.push({id:"",message:e.message,severity:"error"});}}
    renderSummary();renderDiag();setStatus(diagnostics.some(d=>d.severity!=="warning")?t("st_has_errors"):t("st_check_ok"));
  }catch(e){setStatus(t("st_error_prefix")+e.message);}finally{busy=false;refreshButtons();}
}
async function doSave(){
  if(busy)return;
  const sb=$("b_save");
  if(sb)sb.classList.add("primary");
  if(viewMode==="scheme"){
    if(mixReturnState)mixReturnState.saved=true;
    else mixReturnState={cueId:"",viewport:null,saved:true};
    renderReturnBar();
    if(!online){
      saveDraft();
      setStatus(t("st_saved_version"));
      setTimeout(()=>{if(sb&&!busy)sb.classList.remove("primary");},300);
      return;
    }
  }
  busy=true;refreshButtons();setStatus(t("st_saving"));
  try{const v=validate();if(v.diagnostics.some(d=>d.severity!=="warning")){diagnostics=v.diagnostics;renderDiag();throw new Error(t("err_fix_before_save"));}
    /* Always refresh asset metadata: after a sound-pack replacement the cached
       size/CRC would make apply fail with a stale manifest. */
    await fetchAssets(v.files,true);
    const missing=v.files.filter(f=>!assets[f]);
    if(missing.length){diagnostics=v.diagnostics.concat(missing.map(f=>({id:"",message:t("v_assets_missing")+f,severity:"error"})));renderDiag();throw new Error(t("v_assets_missing")+missing.join(", "));}
    v.payload.assets=v.files.map(f=>assets[f]).filter(Boolean);
    const r=await req("/api/sound/graph/save?"+qs({id:project.id,expectedRevision:project.id===savedId?revision:0}),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v.payload)});
    revision=Number(r.revision)||revision;savedId=project.id;
    let applied=false,applyErr="";
    try{await req("/api/sound/graph/apply?"+qs({id:project.id,revision}),{method:"POST"});await applyOutputs();applied=true;}
    catch(e){applyErr=e&&e.message?e.message:String(e);}
    await refreshStatus();
    if(applied){
      setStatus(t("st_saved_version"));
    }
    else{
      diagnostics=v.diagnostics.concat([{id:"",message:t("st_not_applied")+applyErr,severity:"error"}]);
      renderDiag();
      setStatus(t("st_saved_not_applied")+": "+applyErr);
    }
  }catch(e){setStatus(t("st_not_saved")+e.message);}finally{busy=false;refreshButtons();setTimeout(()=>{if(sb&&!busy)sb.classList.remove("primary");},400);}
}

async function applyOutputs(){
  await applyVolumes();
  const desired=desiredBindings();
  const list=async()=>(await req("/api/func-map?view=bind")).binds||[];
  const existing=await list();
  const bindObj=x=>({fn:x.fn,type:x.type,id:x.id,dir:x.dir||0,state:x.state||0,flags:x.flags||0,short:x.short||0,short_ms:x.short_ms||0,min_ms:x.min_ms||0,fade_ms:x.fade_ms||0});
  const have=new Set(existing.map(x=>bindKey(bindObj(x))));
  const desiredKeys=new Set(desired.map(bindKey));
  for(const b of desired){if(!have.has(bindKey(b)))await req("/api/func-map?bind=1&"+qs(b),{method:"POST"});}
  /* Remove any existing Output (type 1) or LogicOut (type 4) binding on the
     device that is not in desiredKeys so deleted or modified bindings do not
     linger on the device. */
  while(true){
    const now=await list();
    const idx=now.findIndex(x=>((x.type|0)===1||(x.type|0)===4)&&!desiredKeys.has(bindKey(bindObj(x))));
    if(idx<0)break;
    await req("/api/func-map?bind=1&remove=1&idx="+idx,{method:"POST"});
  }
  const desiredAux=auxConfigs(),desiredAuxCh=new Set(desiredAux.map(c=>c.ch));
  for(let ch=0;ch<=8;ch++){
    if(!desiredAuxCh.has(ch)){try{await req("/api/aux/cfg?"+qs({ch:ch,level:0,effect:0}),{method:"POST"});}catch(e){}}
  }
  for(const c of desiredAux){try{await req("/api/aux/cfg?"+qs({ch:c.ch,level:c.level,effect:c.effect}),{method:"POST"});}catch(e){}}
  project.editor.bindTuples=desired.map(bindKey);
  project.editor.auxChannels=desiredAux.map(c=>c.ch);
  saveDraft();
}

/* Best-effort reverse compiler: rebuild an editable Mixes project from a
   compiled sound-graph payload (schema v1). It recognises the state patterns
   emitted by this editor (Start/Simple/Loop/Mute/End, legacy presets, engine,
   speed/random/decel) and reconstructs Input blocks, links and variables.
   Arbitrary hand-written graph states that have no editor equivalent are
   reported as warnings and left out. */
function reverseGraphToProject(payload,fallbackName){
  const states=Array.isArray(payload&&payload.states)?payload.states:[];
  const trans=Array.isArray(payload&&payload.transitions)?payload.transitions:[];
  const byId={};states.forEach(s=>{if(s&&s.id)byId[s.id]=s;});
  const suffix=id=>{const m=String(id||"").match(/_(off|play|loop|mute|end|ready|hold|short|start|idle|stop|run\d+|sp\d+|r\d+|e\d+|true|false|gate|w\d+)$/);return m?m[1]:null;};
  const prefix=id=>{const s=suffix(id);return s?String(id).slice(0,-s.length-1):String(id||"");};
  const from=id=>trans.filter(t=>t&&t.source===id);
  const has=(p,s)=>!!byId[p+"_"+s];
  const fileOf=id=>{const s=byId[id];return s&&s.file?s.file:"";};
  const volOf=id=>{const s=byId[id];return s&&s.volume!=null?(s.volume|0):80;};
  const rateOf=id=>{const s=byId[id];return s&&s.rate?(s.rate|0):1000;};
  const posOf=id=>{const ps=payload&&payload.editor&&payload.editor.positions;const p=ps&&ps[id];return p?{x:p.x|0,y:p.y|0}:null;};
  const fmtPct=v=>Math.max(0,Math.min(100,Math.round((v==null?0:v)*100/255)));
  const warnings=[],blocks=[],links=[];
  const safe=s=>String(s||"").replace(/[^A-Za-z0-9_-]/g,"_").slice(0,31)||"restored";
  const cutUtf=(s,n)=>{let r=String(s||"");while(r&&new TextEncoder().encode(r).length>n)r=r.slice(0,-1);return r;};
  const autoPos=()=>({x:80+(blocks.length%4)*280,y:80+Math.floor(blocks.length/4)*140});
  const mk=(id,type,extra)=>{
    const cat=BY_TYPE[type]||{name:{ru:type,en:type}},at=posOf(id)||autoPos();
    return Object.assign({id,type,name:tr(cat.name),fn:-1,trigger:"auto",volume:80,rate:1000,level:100,files:{},
      outEvent:"finish",outDelay:0,shortMs:400,x:at.x,y:at.y},extra||{});
  };
  const addLink=(a,b,cond)=>{if(!a||!b)return;const c=cond||"out";if(links.some(l=>l.from===a.id&&l.to===b.id&&(l.cond||"out")===c))return;links.push({id:nid("l",links.map(l=>l.id)),from:a.id,to:b.id,kind:"after",cond:c});};
  const addInput=(fn,hold,at)=>{
    if(fn==null||fn<0||fn>28)return null;
    let inp=blocks.find(b=>b.type==="fx_in"&&b.fn===fn);
    if(!inp){
      inp=mk("fx_"+fn,"fx_in",{fn,x:(at?at.x-220:40),y:(at?at.y:60+blocks.length*18),fxMode:"toggle"});
      inp.name="F"+fn;blocks.push(inp);
    }
    if(hold)inp.fxMode="hold";
    return inp;
  };
  const entryCond=p=>{
    let list=from(p+"_off").filter(t=>t&&t.condition&&prefix(t.target)===p);
    if(!list.length&&engineEntry)list=from(engineEntry).filter(t=>t&&t.condition&&prefix(t.target)===p);
    return list.length?list[0].condition:null;
  };
  const exitCond=(p,s)=>{
    const st=byId[p+"_"+s];if(!st)return null;
    const t=from(st.id).find(x=>x&&((prefix(x.target)===p&&suffix(x.target)==="off")||x.target===engineEntry))||from(st.id)[0];
    return t&&t.condition?t.condition:null;
  };
  const applyTrigger=(p,b,entry,isEffect)=>{
    let conds=from(entry).filter(t=>t&&t.condition&&prefix(t.target)===p).map(t=>t.condition);
    if(!conds.length&&engineEntry)conds=from(engineEntry).filter(t=>t&&t.condition&&prefix(t.target)===p).map(t=>t.condition);
    let any=false;
    for(const c of conds){
      if(!c||!c.type)continue;
      if(c.fn!=null&&c.type.indexOf("fn_")===0){
        const inp=addInput(c.fn,c.type==="fn_on"||c.type==="fn_off",posOf(p));
        if(inp){addLink(inp,b);any=true;}
      }else if(c.type==="engine_on"){b.trigger="engine";any=true;}
      else if(c.type==="dir_fwd"||c.type==="dir_rev"){b.trigger="dir";b.dirTrigger=c.type==="dir_rev"?"rev":"fwd";any=true;}
      else if(c.type==="speed"){b.trigger="speed";b.speedMin=fmtPct(c.min);b.speedMax=fmtPct(c.max==null?255:c.max);any=true;}
    }
    if(!any&&isEffect&&["simple","loop","mute","end","random","horn"].indexOf(b.type)>=0)
      warnings.push({message:t("rev_no_trigger")+blockName(b),severity:"warning"});
  };
  const runStates=p=>states.filter(s=>s&&prefix(s.id)===p&&/^run\d+$/.test(suffix(s.id)||"")).sort((a,b)=>states.indexOf(a)-states.indexOf(b));
  const engineEntry=payload&&payload.engine&&payload.engine.entry||"engine_off";
  const enginePrefix=prefix(engineEntry);
  const engineRuns=runStates(enginePrefix);
  if(enginePrefix&&(has(enginePrefix,"idle")||has(enginePrefix,"start")||engineRuns.length)){
    const idle=byId[enginePrefix+"_idle"],ranges={};
    if(idle)from(idle.id).forEach(t=>{
      if(t&&t.condition&&t.condition.type==="speed"&&prefix(t.target)===enginePrefix&&/^run\d+$/.test(suffix(t.target)||""))
        ranges[suffix(t.target)]={from:fmtPct(t.condition.min),to:fmtPct(t.condition.max==null?255:t.condition.max)};
    });
    const run=engineRuns.map((s,i)=>{
      const key=suffix(s.id),r=ranges[key],step=Math.floor(100/Math.max(1,engineRuns.length));
      return {from:r?r.from:i*step,to:r?r.to:(i===engineRuns.length-1?100:(i+1)*step),file:s.file||""};
    }).sort((a,b)=>a.from-b.from);
    const eng=mk(enginePrefix,"engine",{
      volume:volOf(enginePrefix+"_idle")||80,
      hyst:Math.max(0,Math.min(100,Math.round((payload.hysteresis||3)*100/255))),
      files:{start:fileOf(enginePrefix+"_start"),idle:fileOf(enginePrefix+"_idle"),stop:fileOf(enginePrefix+"_stop")},
      run
    });
    blocks.push(eng);
    if(payload.engine&&payload.engine.fn<=28){const inp=addInput(payload.engine.fn,!!payload.engine.hold,posOf(enginePrefix));if(inp)addLink(inp,eng);}
  }
  const volume=mk("vol_1","volume",{master:20,engine:20,effects:20});
  const engBlock=blocks.find(b=>b.type==="engine");if(engBlock){volume.x=engBlock.x+360;volume.y=engBlock.y;}
  blocks.push(volume);
  const effectList=Array.isArray(payload&&payload.effects)?payload.effects:[];
  const effectPrefixes=new Set(effectList.filter(e=>e&&e.entry).map(e=>prefix(e.entry)));
  const terminal={},controlOut={}; /* block id -> terminal state; control -> [{state,port}] */
  const prefixes=[...new Set(states.map(s=>prefix(s.id)))];
  for(const p of prefixes){
    if(!p||p===enginePrefix||blocks.some(b=>b.id===p))continue;
    const isEffect=effectPrefixes.has(p);
    let b=null;
    const gate=byId[p+"_gate"],entryState=byId[p+"_off"];
    if(has(p,"true")||has(p,"false")){
      const start=gate||entryState;
      const startEdges=start?from(start.id).filter(t=>t&&t.condition&&t.condition.type==="var_cmp"):[];
      const eNext=startEdges.find(t=>/^e\d+$/.test(suffix(t.target)||""));
      const eTrue=startEdges.find(t=>suffix(t.target)==="true");
      const join=(eNext&&eTrue)?"or":"and";
      const pos=trans.filter(t=>t&&prefix(t.source)===p&&t.condition&&t.condition.type==="var_cmp"&&
        (join==="or"?suffix(t.target)==="true":(suffix(t.target)==="true"||/^e\d+$/.test(suffix(t.target)||""))));
      const conds=[],seen=new Set();
      for(const t of pos){
        const c=t.condition,v=(payload.variables&&payload.variables[c.var])||null;
        if(!v)continue;
        const key=(c.var|0)+":"+(c.op|0)+":"+(c.var2!=null?("v"+(c.var2|0)):(c.value|0));
        if(seen.has(key))continue;seen.add(key);
        const x={var:v.name,op:c.op|0,not:false};
        if(c.var2!=null){const v2=(payload.variables&&payload.variables[c.var2])||null;x.rhsVar=v2?v2.name:"";}else x.value=c.value|0;
        conds.push(x);
      }
      if(!conds.length){warnings.push({message:t("rev_logic")+p,severity:"warning"});continue;}
      b=mk(p,"logic",{conds,join});
      blocks.push(b);applyTrigger(p,b,p+"_off",isEffect);
      controlOut[p]=[{state:p+"_true",port:"true"},{state:p+"_false",port:"false"}];
      continue;
    }
    const setState=(gate&&gate.setVar!=null)?gate:((entryState&&entryState.setVar!=null)?entryState:null);
    if(setState){
      const vi=setState.setVar|0,v=(payload.variables&&payload.variables[vi])||null;
      b=mk(p,"set_var",{varName:v?v.name:"",value:setState.setValue|0});
      blocks.push(b);applyTrigger(p,b,p+"_off",isEffect);
      controlOut[p]=[{state:setState.id,port:"out"}];continue;
    }
    const ctl=gate||entryState;
    if(ctl&&from(ctl.id).some(t=>t&&t.condition&&t.condition.type==="timeout")){
      const tmo=from(ctl.id).find(t=>t&&t.condition&&t.condition.type==="timeout");
      b=mk(p,"delay",{delayMs:Math.max(50,Math.min(10000,(tmo.condition.min|0)*50))});
      blocks.push(b);applyTrigger(p,b,p+"_off",isEffect);
      controlOut[p]=[{state:ctl.id,port:"out"}];continue;
    }
    if(has(p,"mute")){
      const ex=exitCond(p,"mute"),units=ex&&ex.type==="timeout"?(ex.min|0):10;
      b=mk(p,"mute",{outDelay:Math.max(50,Math.min(12750,units*50))});
      terminal[p]=p+"_mute";
    }else if(has(p,"end")&&!has(p,"short")&&!has(p,"hold")&&!has(p,"start")&&!has(p,"loop")){
      b=mk(p,"end",{volume:volOf(p+"_end"),rate:rateOf(p+"_end")});
      b.files.sound=fileOf(p+"_end");terminal[p]=p+"_end";
    }else if(has(p,"ready")||states.some(s=>prefix(s.id)===p&&/^r\d+$/.test(suffix(s.id)||""))){
      const files=states.filter(s=>prefix(s.id)===p&&/^r\d+$/.test(suffix(s.id)||"")).sort((a,b2)=>states.indexOf(a)-states.indexOf(b2)).map(s=>s.file||"");
      b=mk(p,"random",{volume:volOf(p+"_ready"),rate:rateOf(p+"_ready")});
      b.files.random=files.filter(Boolean);if(!b.files.random.length)b.files.random=[""];
    }else if(has(p,"sp0")||states.some(s=>prefix(s.id)===p&&/^sp\d+$/.test(suffix(s.id)||""))){
      const bands=states.filter(s=>prefix(s.id)===p&&/^sp\d+$/.test(suffix(s.id)||""))
        .sort((a,b2)=>states.indexOf(a)-states.indexOf(b2))
        .map((s,i,a)=>{
          const m=String(s.name||"").match(/(\d+)\s*[-–]\s*(\d+)\s*%/);
          const step=Math.floor(100/Math.max(1,a.length));
          return {from:m?Number(m[1]):i*step,to:m?Number(m[2]):(i===a.length-1?100:(i+1)*step),file:s.file||""};
        });
      b=mk(p,"speed",{volume:volOf(p+"_sp0"),rate:rateOf(p+"_sp0"),hyst:Math.max(0,Math.min(100,Math.round((payload.hysteresis||5)*100/255)))});
      b.bands=bands;
    }else if(has(p,"hold")||has(p,"short")||(has(p,"start")&&has(p,"end")&&!has(p,"play"))){
      const h=byId[p+"_hold"],timeout=h?from(h.id).find(t=>t&&t.condition&&t.condition.type==="timeout"):null;
      b=mk(p,"horn",{
        volume:volOf(p+"_short")||volOf(p+"_start")||80,
        shortMs:timeout?Math.max(50,(timeout.condition.min|0)*50):400,
        files:{start:fileOf(p+"_start"),loop:fileOf(p+"_loop")||fileOf(p+"_hold"),end:fileOf(p+"_end"),short:fileOf(p+"_short")||fileOf(p+"_end")}
      });
      terminal[p]=has(p,"end")?p+"_end":(has(p,"start")?p+"_start":null);
    }else if(has(p,"loop")){
      const entry=entryCond(p),stop=exitCond(p,"loop");
      b=mk(p,"compressor",{volume:volOf(p+"_loop"),rate:rateOf(p+"_loop")});
      b.files.sound=fileOf(p+"_loop");
      if(entry&&entry.type==="speed"){b.trigger="speed";b.speedMin=fmtPct(entry.min);b.speedMax=fmtPct(entry.max==null?255:entry.max);}
      terminal[p]=p+"_loop";
    }else if(has(p,"play")){
      const play=byId[p+"_play"],entry=entryCond(p),stop=exitCond(p,"play");
      if(play&&play.loop){
        if(stop&&stop.type==="speed"){
          b=mk(p,"compressor",{volume:volOf(p+"_play"),rate:rateOf(p+"_play")});
          b.files.sound=fileOf(p+"_play");b.trigger="speed";
          if(entry&&entry.type==="speed"){b.speedMin=fmtPct(entry.min);b.speedMax=fmtPct(entry.max==null?255:entry.max);}
        }else{
          b=mk(p,"loop",{volume:volOf(p+"_play"),rate:rateOf(p+"_play")});
          b.files.sound=fileOf(p+"_play");b.loopMode="hold";
          if(stop&&stop.type==="timeout"){b.loopMode="time";b.loopMs=Math.max(50,(stop.min|0)*50);}
          else if(stop&&stop.type==="sample_done"){b.loopMode="count";b.loopCount=Math.max(1,play.loops||2);}
          else if(stop&&stop.type==="engine_off"){b.loopMode="event";b.trigger="engine";}
          else if(stop&&(stop.type==="dir_fwd"||stop.type==="dir_rev")){b.loopMode="event";b.trigger="dir";b.dirTrigger=stop.type==="dir_rev"?"rev":"fwd";}
        }
        terminal[p]=p+"_play";
      }else if(entry&&entry.type==="decel"){
        b=mk(p,"brake",{volume:volOf(p+"_play"),rate:rateOf(p+"_play")});
        b.files.sound=fileOf(p+"_play");terminal[p]=p+"_play";
      }else if(entry&&(entry.type==="engine_on"||entry.type==="speed"||entry.type==="dir_fwd"||entry.type==="dir_rev")){
        b=mk(p,"whistle",{volume:volOf(p+"_play"),rate:rateOf(p+"_play")});
        b.files.sound=fileOf(p+"_play");terminal[p]=p+"_play";
      }else{
        b=mk(p,"simple",{volume:volOf(p+"_play"),rate:rateOf(p+"_play")});
        b.files.sound=fileOf(p+"_play");terminal[p]=p+"_play";
      }
    }
    if(!b){warnings.push({message:t("rev_unsupported")+p,severity:"warning"});continue;}
    blocks.push(b);
    if(b.type!=="speed"&&b.type!=="brake")applyTrigger(p,b,p+"_off",isEffect);
  }
  /* Recreate chain links from terminal states to other blocks. */
  const idSet=new Set(blocks.map(b=>b.id));
  for(const b of blocks){
    const t=terminal[b.id];if(!t)continue;
    for(const tr of from(t)){
      let tgt=tr.target,delayMs=0;
      const ws=suffix(tgt);
      if(ws&&/^w\d+$/.test(ws)&&prefix(tgt)===b.id){
        if(tr.condition&&tr.condition.type==="timeout")delayMs=Math.max(50,Math.min(10000,(tr.condition.min|0)*50));
        const nextTr=from(tgt)[0];
        if(nextTr){
          if(!delayMs&&nextTr.condition&&nextTr.condition.type==="timeout")delayMs=Math.max(50,Math.min(10000,(nextTr.condition.min|0)*50));
          tgt=nextTr.target;
        }
      }
      const tp=prefix(tgt);
      if(!tp||tp===b.id||!idSet.has(tp))continue;
      const target=blocks.find(x=>x.id===tp);if(!target)continue;
      const ts=suffix(tgt);
      if(!ts)continue;
      if(ts==="off"&&target.type!=="end"&&target.type!=="logic"&&target.type!=="set_var"&&target.type!=="delay")continue;
      if(!/^(play|mute|end|ready|loop|off|gate)$/.test(ts))continue;
      if(delayMs&&b.type!=="mute")b.outDelay=delayMs;
      addLink(b,target);
    }
  }
  for(const b of blocks){
    const outs=controlOut[b.id];if(!outs)continue;
    for(const out of outs){
      for(const tr of from(out.state)){
        const tp=prefix(tr.target);
        if(!tp||tp===b.id||!idSet.has(tp))continue;
        const target=blocks.find(x=>x.id===tp);
        if(target)addLink(b,target,out.port);
      }
    }
  }
  /* Reattach speed-triggered root blocks (idle and speed bands) to the Engine
     block's ports when the Engine has no internal WAVs of its own. */
  const speedRoots=blocks.filter(b=>b.trigger==="speed"&&!links.some(l=>l.to===b.id));
  if(speedRoots.length&&!blocks.some(b=>b.type==="engine")){
    const idleRoot=speedRoots.find(b=>(b.speedMin|0)===0&&(b.speedMax|0)===0);
    const bandRoots=speedRoots.filter(b=>b!==idleRoot).sort((a,b)=>(a.speedMin|0)-(b.speedMin|0));
    const run=bandRoots.length
      ? bandRoots.map((b,i)=>({from:i>0?(bandRoots[i-1].speedMax==null?i*25:(bandRoots[i-1].speedMax|0)):((b.speedMin|0)<=1?0:(b.speedMin|0)),to:b.speedMax==null?100:(b.speedMax|0),file:""}))
      : [0,25,50,75].map((f,i,a)=>({from:f,to:a[i+1]==null?100:a[i+1],file:""}));
    const eng=mk(enginePrefix||"eng","engine",{
      volume:80,
      hyst:Math.max(0,Math.min(100,Math.round((payload&&payload.hysteresis||5)*100/255))),
      files:{},
      run
    });
    blocks.unshift(eng);
    if(idleRoot){idleRoot.trigger="auto";if(idleRoot.type==="whistle"||idleRoot.type==="simple")idleRoot.type="start";addLink(eng,idleRoot,"eng_idle");}
    bandRoots.forEach((b,i)=>{b.trigger="auto";if(b.type==="compressor"){b.type="loop";b.loopMode="hold";}addLink(eng,b,"eng"+i);});
  }
  blocks.forEach(b=>{if(b.type==="simple"&&!links.some(l=>l.to===b.id&&l.kind==="after"&&(blocks.find(x=>x.id===l.from)||{}).type!=="fx_in"&&(blocks.find(x=>x.id===l.from)||{}).type!=="engine"))b.type="start";});
  const vars=(payload.variables||[]).filter(v=>v&&v.kind==="user").map(v=>({name:cutUtf(v.name,23),kind:"user",init:v.init|0}));
  const p={format:"sound-blocks",schemaVersion:2,id:safe(payload.id||fallbackName),name:cutUtf(payload.name||fallbackName||t("st_restored"),63),
    vars,schemes:[],mix:{blocks,links,texts:[]},
    editor:{viewport:(payload.editor&&payload.editor.viewport)||{x:40,y:40,zoom:1},snap:true,bindTuples:[],auxChannels:[],mode:"mix",activeScheme:""}};
  return {project:normalizeProject(p),warnings};
}
async function loadDeviceProjectUI(){
