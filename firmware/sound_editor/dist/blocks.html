async function importOutputs(){
  if(busy)return;busy=true;refreshButtons();
  try{
    if(viewMode!=="mix")switchMode("mix");
    const [fm,ax]=await Promise.all([req("/api/func-map?view=bind"),req("/api/aux/cfg")]);
    const binds=Array.isArray(fm.binds)?fm.binds:[];
    const aux=Array.isArray(ax.aux)?ax.aux:[];
    if(!binds.some(b=>Number(b.type)===1||Number(b.type)===4)){setStatus(t("st_no_outputs"));return;}
    let created=0,updated=0;
    const ensureInput=fn=>{
      let inp=project.blocks.find(b=>BY_TYPE[b.type]&&BY_TYPE[b.type].kind==="input"&&b.fn===fn);
      if(inp)return inp;
      inp={id:nid("fx_",project.blocks.map(b=>b.id)),type:"fx_in",name:"F"+fn,fn,trigger:"auto",volume:80,rate:1000,level:100,files:{},fxMode:"toggle",x:40,y:40+project.blocks.length*28,outEvent:"finish",outDelay:0,shortMs:400};
      project.blocks.push(inp);created++;return inp;
    };
    const linkTo=(inp,target)=>{
      if(project.links.some(l=>l.from===inp.id&&l.to===target.id&&l.kind==="bind"))return;
      project.links.push({id:nid("l",project.links.map(l=>l.id)),from:inp.id,to:target.id,kind:"bind",cond:"out"});
    };
    const linkAfter=(inp,target)=>{
      if(project.links.some(l=>l.from===inp.id&&l.to===target.id&&l.kind==="after"))return;
      project.links.push({id:nid("l",project.links.map(l=>l.id)),from:inp.id,to:target.id,kind:"after",cond:"out"});
    };
    const linkLogic=(logic,target,cond)=>{
      if(project.links.some(l=>l.from===logic.id&&l.to===target.id&&l.kind==="bind"))return;
      project.links.push({id:nid("l",project.links.map(l=>l.id)),from:logic.id,to:target.id,kind:"bind",cond:cond});
    };
    const i16=n=>((n|0)>32767?(n|0)-65536:(n|0));
    const ensureLogic=(cond,inp,out)=>{
      const fl=cond.flags|0;
      const mk=(vi,op,val)=>{
        if(!Array.isArray(project.vars))project.vars=[];
        while(project.vars.length<=vi){
          let n=1;while(project.vars.some(v=>v&&v.name==="var"+n))n++;
          project.vars.push({name:"var"+n,kind:"user",init:0});
        }
        const v=project.vars[vi];return v&&v.name?{var:v.name,op:op|0,value:val,not:false}:null;
      };
      const conds=[mk((cond.short|0)&15,(cond.short_ms|0)&7,i16(cond.min_ms))];
      if(fl&8)conds.push(mk(((cond.short_ms|0)>>12)&15,((cond.short_ms|0)>>3)&7,i16(cond.fade_ms)));
      if(conds.some(c=>!c))return null;
      const join=(fl&16)?"or":"and",key=JSON.stringify({join,conds});
      let lg=project.blocks.find(b=>b.type==="logic"&&JSON.stringify({join:b.join||"and",conds:b.conds||[]})===key);
      if(!lg){
        lg={id:nid("b",project.blocks.map(b=>b.id)),type:"logic",name:tr(BY_TYPE.logic.name),fn:-1,trigger:"auto",volume:80,rate:1000,level:100,
          files:{},join,conds,x:inp.x+240,y:inp.y+created*8,outEvent:"finish",outDelay:0,shortMs:400};
        project.blocks.push(lg);created++;
      }
      linkAfter(inp,lg);linkLogic(lg,out,(fl&2)?"false":"true");
      return lg;
    };
    const groups={};
    for(const b of binds){
      const type=Number(b.type),fn=Number(b.fn),id=Number(b.id);
      if(type!==1||fn<0||fn>28||id<0||id>8)continue;
      const ch=id<=1?0:id-1,dir=Number(b.dir)||0,state=Number(b.state)||0;
      const cond={flags:Number(b.flags)||0,short:Number(b.short)||0,short_ms:Number(b.short_ms)||0,min_ms:Number(b.min_ms)||0,fade_ms:Number(b.fade_ms)||0};
      const ck=(cond.flags&4)?[cond.flags,cond.short,cond.short_ms,cond.min_ms,cond.fade_ms].join("."):"";
      /* Group F0F (id=0, dir=1) and F0R (id=1, dir=2) together into one auto headlight group. */
      const gdir=(ch===0&&((id===0&&dir===1)||(id===1&&dir===2)))?"auto_pair":String(dir);
      const key=fn+":"+ch+":"+gdir+":"+state+":"+ck;
      groups[key]=groups[key]||{fn,ch,dir,state,ids:[],dirs:[],cond:(cond.flags&4)?cond:null};
      groups[key].ids.push(id);groups[key].dirs.push(dir);
    }
    for(const g of Object.values(groups)){
      const inp=ensureInput(g.fn);
      let dn;
      if(g.ch===0){
        const hasF0F=g.ids.indexOf(0)>=0&&g.dirs[g.ids.indexOf(0)]===1;
        const hasF0R=g.ids.indexOf(1)>=0&&g.dirs[g.ids.indexOf(1)]===2;
        if(hasF0F&&hasF0R)dn="auto";
        else if(g.dir===0)dn="any";
        else if(g.dir===1)dn="fwd";
        else if(g.dir===2)dn="rev";
        else dn="auto";
      }else{
        dn=g.dir===1?"fwd":g.dir===2?"rev":"any";
      }
      const sn=g.state===1?"moving":g.state===2?"stopped":"any";
      let out=project.blocks.find(o=>BY_TYPE[o.type]&&BY_TYPE[o.type].kind==="output"&&(o.channel|0)===g.ch&&((o.dir||"auto")===dn&&(o.state||"any")===sn));
      if(!out&&g.ch===0)out=project.blocks.find(o=>BY_TYPE[o.type]&&BY_TYPE[o.type].kind==="output"&&(o.channel|0)===0);
      let level=0,effect=0;
      for(const id of g.ids){const c=aux[id];if(c){level=Math.max(level,c.level|0);if(!effect&&c.effect)effect=c.effect|0;}}
      if(!level&&!effect)level=100;
      if(!out){
        out={id:nid("b",project.blocks.map(b=>b.id)),type:"output",name:tr(BY_TYPE.output.name),fn:-1,trigger:"auto",volume:80,rate:1000,level,effect,channel:g.ch,dir:dn,state:sn,files:{},x:inp.x+240,y:inp.y+created*8,outEvent:"finish",outDelay:0,shortMs:400};
        project.blocks.push(out);created++;
      }else{out.level=level;out.effect=effect;out.dir=dn;out.state=sn;updated++;}
      if(g.cond){
        if(ensureLogic(g.cond,inp,out))project.links=project.links.filter(l=>!(l.from===inp.id&&l.to===out.id&&l.kind==="bind"));
        else linkTo(inp,out);
      }else linkTo(inp,out);
    }
    for(const b of binds){
      if(Number(b.type)!==4)continue;
      const fn=Number(b.fn),op=Number(b.id);
      if(fn<0||fn>28||op<1||op>8)continue;
      const inp=ensureInput(fn);
      const dn=b.dir===1?"fwd":b.dir===2?"rev":"any",sn=b.state===1?"moving":b.state===2?"stopped":"any";
      let out=project.blocks.find(o=>BY_TYPE[o.type]&&BY_TYPE[o.type].kind==="logicout"&&(o.op|0)===op&&(o.dir||"auto")===dn&&(o.state||"any")===sn);
      if(!out){
        out={id:nid("b",project.blocks.map(b=>b.id)),type:"logic_out",name:tr(BY_TYPE.logic_out.name),fn:-1,trigger:"auto",volume:80,rate:1000,level:100,op,dir:dn,state:sn,files:{},x:inp.x+240,y:inp.y+created*8,outEvent:"finish",outDelay:0,shortMs:400};
        project.blocks.push(out);created++;
      }else updated++;
      const cond={flags:Number(b.flags)||0,short:Number(b.short)||0,short_ms:Number(b.short_ms)||0,min_ms:Number(b.min_ms)||0,fade_ms:Number(b.fade_ms)||0};
      if((cond.flags&4)){
        if(ensureLogic(cond,inp,out))project.links=project.links.filter(l=>!(l.from===inp.id&&l.to===out.id&&l.kind==="bind"));
        else linkTo(inp,out);
      }else linkTo(inp,out);
    }
    render();saveDraft();
    setStatus(t("st_imported_outputs_a")+created+t("st_imported_outputs_b")+updated+".");
  }catch(e){setStatus(t("st_import_error")+e.message);}
  finally{busy=false;refreshButtons();}
}

/* ---- scheme/mix simulator ------------------------------------------- */
let sim=null;
function simulatorPayload(){
  if(viewMode==="scheme"){
    const s=activeScheme();if(!s)return null;
    const blocks=JSON.parse(JSON.stringify(s.blocks||[]));
    const links=JSON.parse(JSON.stringify(s.links||[]));

    const targets=roots.length?roots:(blocks.length?[blocks[0]]:[]);

      blocks.push({id:"sim_fx",type:"fx_in",name:"F0",fn:0,trigger:"auto",volume:80,rate:1000,level:100,files:{},fxMode:"toggle",x:40,y:40,outEvent:"finish",outDelay:0,shortMs:400});
      targets.forEach((tb,i)=>links.push({id:"sim_l"+i,from:"sim_fx",to:tb.id,kind:"after",cond:"out"}));
    }
    const tmp={format:"sound-blocks",schemaVersion:2,id:"sim",name:s.name||"Sim",vars:project.vars||[],
      blocks:blocks,links:links,texts:[],
      mix:{blocks,links,texts:[]},schemes:[],editor:{viewport:{x:0,y:0,zoom:1},snap:true,mode:"mix",activeScheme:""}};
    const real=project;
    project=tmp;
    try{const v=compile();return {payload:v.payload,title:s.name||t("scheme"),autoFn:targets.length?0:null,bindings:desiredBindings(),holdFns:new Set()};}
    finally{project=real;}
  }
  const v=compile();
  const mixBlocks=project.mix?project.mix.blocks:project.blocks;
  const mixLinks=project.mix?project.mix.links:project.links;

  sim.running=false;if(sim.timer){clearInterval(sim.timer);sim.timer=null;}
  stopSimAudio();if(update!==false)renderSim();
}
function simStart(){
  if(!sim)return;
  unlockSimAudio();
  if(sim.running){simStop();return;}
  sim.running=true;sim.prevSpeed=Math.round(sim.speed*255/100);
  if(sim.autoFn!=null&&!sim.autoPressed){sim.autoPressed=true;simPress(sim.autoFn,true);}
  sim.chans.forEach(ch=>{const st=sim.states[ch.state];if(st&&st.file&&!ch.playing&&!ch.done)playSimAudio(ch,st);});
  sim.timer=setInterval(simTick,50);
  renderSim();
}
function closeSimulator(){
  if(sim)simStop(false);
  if(sim)sim.chans.forEach(stopSimAudioOne);
  sim=null;
  const el=$("sim_panel");if(el)el.remove();
}

  if(sim.payload.engine&&sim.payload.engine.fn<=28)fns.add(sim.payload.engine.fn);

      '<label style="font-size:14px">'+esc(t("sim_speed"))+' <span id="sim_spd_v">0</span>%</label><input id="sim_speed" type="range" min="0" max="100" value="0" style="width:100%">'+
      '<div class="row" style="gap:8px;align-items:center;margin:8px 0"><label style="flex:1;margin:0;font-size:14px">'+esc(t("sim_dir"))+'</label><select id="sim_dir" style="font-size:13px;padding:4px 7px"><option value="fwd">'+esc(t("dir_fwd"))+'</option><option value="rev">'+esc(t("dir_rev"))+'</option></select><label id="sim_engine_wrap" style="flex:0 0 auto;margin:0;font-size:14px"><input type="checkbox" id="sim_engine"> <span id="sim_engine_lbl">'+esc(t("sim_engine"))+'</span></label></div>'+
      '<div id="sim_chans" style="margin:10px 0;font-size:14px;line-height:1.45"></div><div id="sim_outputs" class="hint" style="margin-bottom:5px;font-size:13px"></div><div id="sim_logic" class="hint" style="margin-bottom:6px;font-size:13px"></div><div id="sim_vars" class="hint" style="margin-bottom:8px;font-size:13px"></div>'+
      '<div style="font-weight:600;margin-bottom:4px;font-size:14px">'+esc(t("sim_log"))+'</div><div id="sim_log" style="font-family:monospace;font-size:13px;max-height:140px;overflow:auto"></div>'+
    '</div>';
  document.body.appendChild(el);
  const hdr=$("sim_hdr"),resizer=$("sim_resize");
  if(hdr){
    hdr.addEventListener("pointerdown",ev=>{
      if(ev.button!==0||ev.target.closest("button"))return;
      ev.preventDefault();
      const r=el.getBoundingClientRect();
      el.style.left=r.left+"px";el.style.top=r.top+"px";el.style.right="auto";el.style.bottom="auto";
      const sx=ev.clientX,sy=ev.clientY,x0=r.left,y0=r.top;
      const mv=e=>{el.style.left=Math.max(4,Math.min(window.innerWidth-120,x0+(e.clientX-sx)))+"px";el.style.top=Math.max(4,Math.min(window.innerHeight-80,y0+(e.clientY-sy)))+"px";};
      const up=()=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);};
      window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
    });
  }
  if(resizer){
    resizer.addEventListener("pointerdown",ev=>{
      if(ev.button!==0)return;

      const sx=ev.clientX,sy=ev.clientY,w0=r.width,h0=r.height,right0=window.innerWidth-r.right,bottom0=window.innerHeight-r.bottom;
      el.style.left="auto";el.style.top="auto";el.style.right=right0+"px";el.style.bottom=bottom0+"px";
      const mv=e=>{
        const nw=Math.max(280,Math.min(window.innerWidth-20,w0+(sx-e.clientX)));

  el.querySelectorAll("[data-simfn]").forEach(b=>{

    if(isHold){
      let heldByPointer=false;
      b.addEventListener("pointerdown",ev=>{if(ev.button!==0)return;heldByPointer=true;simPress(fn,true);});
      const rel=()=>{if(heldByPointer){heldByPointer=false;simPress(fn,false);}};
      b.addEventListener("pointerup",rel);
      b.addEventListener("pointerleave",rel);
      b.addEventListener("pointercancel",rel);
      b.onclick=ev=>{if(ev&&ev.detail>0)return;simPress(fn);};
    }else{
      b.onclick=()=>simPress(fn);
    }
  });
  renderSim();
}
function renderSim(){
  if(!sim)return;
  const fns=$("sim_fns");if(!fns)return;
  fns.querySelectorAll("[data-simfn]").forEach(b=>b.classList.toggle("on",!!sim.fnLevels[Number(b.getAttribute("data-simfn"))]));
  $("sim_runstate").textContent=sim.running?t("sim_running"):t("sim_stopped");
  $("sim_spd_v").textContent=String(sim.speed|0);
  $("sim_speed").value=String(sim.speed|0);
  $("sim_dir").value=sim.forward?"fwd":"rev";
  const moving=sim.speed>0;if(moving)sim.engineOn=true;
  $("sim_engine").checked=!!sim.engineOn;
  $("sim_engine").disabled=moving;
  $("sim_engine_lbl").textContent=moving?t("sim_engine"):t("sim_idle");
  $("sim_engine_wrap").title=moving?t("sim_engine_auto"):t("sim_idle_hint");
  const chans=sim.chans.map(ch=>{
    const st=sim.states[ch.state]||{};
    let label=t("sim_engine");
    if(!ch.engine){
      const ef=ch.effect||{};
      const fnPrefix=ef.hasFn?("F"+ef.fn+" "):"";
      label=fnPrefix+(ef.label||ef.id||"effect");
    }
    return '<div style="padding:2px 0"><b>'+esc(label)+'</b>: '+esc(st.name||"?")+(st.file?' · '+esc(st.file):'')+(ch.playing?' ▶':'')+'</div>';
  }).join("");
  $("sim_chans").innerHTML=chans||'<div class="hint">—</div>';
  const rawSpeed=Math.max(0,Math.min(255,Math.round(sim.speed*255/100)));
  simSyncBuiltins();
  if(!sim.running)simApplyLogic(rawSpeed);
  else{const fb=simEvalBindings();sim.outMask=fb.mask;sim.logicActive=fb.logic;}
  const outNames=["F0F","F0R",...AUX_NAMES],active=[];
  for(let i=0;i<outNames.length;i++)if(sim.outMask&(1<<i))active.push(outNames[i]);
  $("sim_outputs").textContent=t("sim_outputs")+": "+(active.length?active.join(", "):"—");
  const logic=sim.logicActive.map(id=>{const x=LOGIC_TARGETS.find(l=>l.v===id);return x?tr(x.n):("L"+id);});
  if(sim.notchOffset)logic.push("notch "+(sim.notchOffset>0?"+":"")+sim.notchOffset);
  $("sim_logic").textContent=t("sim_logic")+": "+(logic.length?logic.join(", "):"—");
  const vs=Object.keys(sim.vars||{}).map(k=>k+"="+sim.vars[k]).join("  ");
  $("sim_vars").textContent=vs;
  $("sim_log").innerHTML=sim.log.slice(-14).map(x=>'<div>'+esc(x.text)+'</div>').join("");
}

/* ---- persistence ----------------------------------------------------- */
function saveDraft(){try{localStorage.setItem(STORE_KEY,JSON.stringify({project,revision,savedId}));}catch(e){}historyPush();}
const projectSig=()=>JSON.stringify({m:project.mix,s:project.schemes,v:project.vars,id:project.id,name:project.name});
function historyReset(){history=[];hIndex=-1;lastSig=null;historyPush();}
function historyPush(){const sig=projectSig();if(sig===lastSig)return;history=history.slice(0,hIndex+1);history.push(JSON.stringify(project));hIndex=history.length-1;lastSig=sig;if(history.length>100){history.shift();hIndex--;}}
function afterRestore(){installGraphAccessors(project);viewMode=project.editor&&project.editor.mode==="scheme"?"scheme":"mix";activeSchemeId=(project.editor&&project.editor.activeScheme)||"";renamingSchemeId="";}
function undo(){if(hIndex<=0)return;const v=JSON.parse(JSON.stringify(project.editor.viewport));hIndex--;project=JSON.parse(history[hIndex]);afterRestore();project.editor.viewport=v;lastSig=projectSig();selected="";selectedIds=new Set();render();setStatus(t("st_undone"));}
function redo(){if(hIndex>=history.length-1)return;const v=JSON.parse(JSON.stringify(project.editor.viewport));hIndex++;project=JSON.parse(history[hIndex]);afterRestore();project.editor.viewport=v;lastSig=projectSig();selected="";selectedIds=new Set();render();setStatus(t("st_redone"));}
function loadDraft(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return;const d=JSON.parse(raw);if(d&&d.project&&d.project.format==="sound-blocks"){project=normalizeProject(d.project);revision=d.revision||0;savedId=d.savedId||"";if(project.editor.snap===undefined)project.editor.snap=true;}}catch(e){}}
const THEME_KEY="aura_theme";
function applyTheme(th){if(th!=="light")th="dark";document.documentElement.setAttribute("data-theme",th);const b=$("b_theme");if(b)b.textContent=(th==="light"?"☾ ":"☀ ")+t("m_theme")+": "+t(th==="light"?"theme_light":"theme_dark");try{localStorage.setItem(THEME_KEY,th);}catch(e){}}
function toggleTheme(){applyTheme(document.documentElement.getAttribute("data-theme")==="light"?"dark":"light");}

function renderPalette(){
  const hasEngine=project.blocks.some(b=>b.type==="engine"),hasVolume=project.blocks.some(b=>b.type==="volume");
  const allFnsUsed=nextFn(project)<0;
  const allowed=viewMode==="scheme"?["scheme","shared"]:["main","mix"];
  let html="";
  for(const key of allowed){
    const sec=SECTION_ORDER.find(x=>x[0]===key);
    if(!sec)continue;
    const items=CATALOG.filter(c=>{
      if(sec[0]==="legacy")return !c.section&&c.type!=="headlight"&&c.type!=="aux";
      if(sec[0]==="shared")return !!(c.sections&&c.sections.includes("mix")&&c.sections.includes("scheme"));
      const ss=c.sections||(c.section?[c.section]:[]);
      if(sec[0]==="scheme")return ss.includes("scheme")&&!(c.sections&&c.sections.length>1);
      return ss.indexOf(sec[0])>=0;
    });
    if(!items.length)continue;
    html+='<div class="pal-group">'+(sec[0]==="scheme"?"":'<header>'+esc(tr(sec[1]))+"</header>");
    items.forEach(c=>{
      const dis=(c.type==="engine"&&hasEngine)||(c.type==="volume"&&hasVolume)||(c.type==="fx_in"&&allFnsUsed),col=blockColor(c.type);
      const tip=c.type==="fx_in"&&allFnsUsed?t("st_all_fns_used"):((tr(MODE_NAMES[c.mode])||"")+(c.fx?t("pal_fx"):""));
      html+='<button data-add="'+c.type+'" style="border-left:3px solid '+col+'" title="'+esc(tip)+'"'+(dis?" disabled":"")+'><b>'+esc(tr(c.name))+"</b></button>";
    });
    html+="</div>";
  }
  if(viewMode==="scheme"&&!project.schemes.length)html+='<p class="hint">'+esc(t("scheme_empty"))+'</p>';
  $("palette").innerHTML=html;
  $("palette").querySelectorAll("[data-add]").forEach(btn=>btn.onclick=()=>{const b=addBlockTo(project,btn.getAttribute("data-add"));if(b){selected=b.id;selectedIds=new Set([b.id]);render();}});
}
/* Mode switch (Mixes / Sound schemes) and the scheme selector. */
function switchMode(mode){
  const target=(mode==="scheme")?"scheme":"mix";
  if(target==="scheme"&&viewMode==="mix"){
    const vp=project.editor&&project.editor.viewport?{x:project.editor.viewport.x,y:project.editor.viewport.y,zoom:project.editor.viewport.zoom}:null;
    const selB=project.blocks.find(b=>b.id===selected);
    mixReturnState={cueId:selB?selB.id:"",viewport:vp,saved:false};
    if(selB&&selB.type==="sound_cue"&&selB.scheme&&schemeById(selB.scheme))activeSchemeId=selB.scheme;
  }else if(target==="mix"){
    if(mixReturnState){returnToMixEditor();return;}
  }
  viewMode=target;
  if(viewMode==="scheme"&&!project.schemes.length)newScheme();
  project.editor.mode=viewMode;
  const s=activeScheme();project.editor.activeScheme=s?s.id:"";
  selected="";selectedIds=new Set();selectedLink="";
  renderSnapBtn();render();
}
function createSchemeFromCue(b){
  if(!b)return;
  const defName=tr(BY_TYPE.sound_cue.name);
  const rawName=(b.name&&b.name.trim()&&b.name.trim()!==defName)?b.name.trim():(t("scheme_new")+" "+(project.schemes.length+1));
  const vp=project.editor&&project.editor.viewport?{x:project.editor.viewport.x,y:project.editor.viewport.y,zoom:project.editor.viewport.zoom}:null;
  const prevScheme=b.scheme||"";
  const prevName=b.name||"";
  const s=newScheme(rawName);
  mixReturnState={cueId:b.id,viewport:vp,saved:false,createdSchemeId:s.id,prevScheme,prevName};
  b.scheme=s.id;
  if(!b.name||b.name===defName)b.name=s.name;
  activeSchemeId=s.id;project.editor.activeScheme=s.id;
  viewMode="scheme";project.editor.mode="scheme";
  project.editor.viewport={x:40,y:40,zoom:1};
  applyViewport();
  selected="";selectedIds=new Set();selectedLink="";
  renderSnapBtn();render();
}
function returnToMixEditor(){
  const st=mixReturnState;
  mixReturnState=null;
  if(st&&!st.saved&&st.createdSchemeId){
    project.schemes=project.schemes.filter(s=>s.id!==st.createdSchemeId);
    const cueBlk=project.mix.blocks.find(b=>b.id===st.cueId);
    if(cueBlk){
      cueBlk.scheme=st.prevScheme||"";
      cueBlk.name=st.prevName||"";
    }
    if(activeSchemeId===st.createdSchemeId){
      activeSchemeId=project.schemes.length?project.schemes[0].id:"";
      project.editor.activeScheme=activeSchemeId;
    }
  }
  viewMode="mix";project.editor.mode="mix";
  if(st&&st.viewport){project.editor.viewport=st.viewport;applyViewport();}
  if(st&&st.cueId&&project.blocks.some(b=>b.id===st.cueId)){
    selected=st.cueId;selectedIds=new Set([st.cueId]);
  }else{
    selected="";selectedIds=new Set();
  }
  selectedLink="";
  renderSnapBtn();render();
}

  const rb=$("return_bar");if(!rb)return;
  if(viewMode==="scheme"&&mixReturnState){
    rb.classList.remove("hidden");
    rb.innerHTML='<button type="button" class="'+(mixReturnState.saved?"primary":"")+'" id="b_return_mix" style="width:100%">'+esc(t("back_to_editor"))+'</button>';

    rb.classList.add("hidden");

}

function selectScheme(id){
  if(id===activeSchemeId)return;
  renamingSchemeId="";
  activeSchemeId=id;if(project.editor)project.editor.activeScheme=id;
  selected="";selectedIds=new Set();selectedLink="";render();
}
function renameSchemeUI(id){
  const s=schemeById(id);if(!s)return;
  activeSchemeId=id;if(project.editor)project.editor.activeScheme=id;
  renamingSchemeId=id;
  selected="";selectedIds=new Set();selectedLink="";render();

}
function addSchemeUI(){
  const s=newScheme(t("scheme_new")+" "+(project.schemes.length+1));
  activeSchemeId=s.id;project.editor.activeScheme=s.id;
  switchMode("scheme");
  renamingSchemeId=s.id;render();

}
function removeSchemeUI(id){
  const cur=activeScheme();
  const s=id?schemeById(id):cur;if(!s)return;
  if(!confirm(t("confirm_del_scheme")+(s.name||s.id)+t("confirm_del_scheme_b")))return;
  const wasActive=!cur||cur.id===s.id;
  project.schemes=project.schemes.filter(x=>x!==s);
  if(project.mix&&Array.isArray(project.mix.blocks)){
    project.mix.blocks.forEach(b=>{if(b.type==="sound_cue"&&b.scheme===s.id)b.scheme="";});
  }
  if(renamingSchemeId===s.id)renamingSchemeId="";
  if(wasActive){
    activeSchemeId=project.schemes.length?project.schemes[0].id:"";
    project.editor.activeScheme=activeSchemeId;
  }
  if(!project.schemes.length)viewMode="mix",project.editor.mode="mix";
  selected="";selectedIds=new Set();selectedLink="";renderSnapBtn();render();
}
function nodeSummary(b){
  const kind=BY_TYPE[b.type].kind;
  if(kind==="setting")return t("vol_master")+" <span class='k'>"+(b.master|0)+"</span> · "+t("vol_engine")+" "+(b.engine|0)+" · "+t("vol_effects")+" "+(b.effects|0);

  on("i_test","click",()=>testBlock(b));
  on("i_chain","click",()=>openSimulator());
}

function renderTextInspector(insp,tx){
  let h='<label>'+esc(t("text_label"))+'</label><textarea id="tx_val" rows="3" style="width:100%;padding:5px 7px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;font:inherit;resize:vertical">'+esc(tx.text)+'</textarea>';
  h+='<label>'+esc(t("text_size"))+'</label><div class="row"><input type="range" id="tx_size" min="10" max="72" value="'+(tx.size||16)+'"><span id="tx_size_v" style="flex:0 0 34px;text-align:right">'+(tx.size||16)+'</span></div>';
  h+='<label>'+esc(t("text_color"))+'</label><input type="color" id="tx_color" value="'+(tx.color||"#e7ecf5")+'">';
  h+='<p class="hint">'+esc(t("text_hint"))+'</p>';
  insp.innerHTML=h;
  const on=(id,ev,fn)=>{const el=$(id);if(el)el.addEventListener(ev,fn);};
  const live=fn=>{const el=$("texts").querySelector('[data-text="'+tx.id+'"]');if(el)fn(el);};
  on("tx_val","input",e=>{tx.text=e.target.value;live(el=>{el.textContent=tx.text;});});
  on("tx_val","change",()=>render());
  on("tx_size","input",e=>{tx.size=Number(e.target.value)||16;const v=$("tx_size_v");if(v)v.textContent=String(tx.size);live(el=>{el.style.fontSize=tx.size+"px";});});
  on("tx_size","change",()=>render());

  on("tx_color","change",()=>render());
}

function removeBlock(id){
  if(project.blocks.find(b=>b.id===id&&(b.type==="engine"||b.type==="volume")))return;
  project.blocks=project.blocks.filter(b=>b.id!==id);
  project.links=project.links.filter(l=>l.from!==id&&l.to!==id);
  selectedIds.delete(id);
  if(selected===id)selected=[...selectedIds][0]||"";
  render();
}
function deleteSelected(){
  const ids=[...selectedIds].filter(id=>{const b=project.blocks.find(x=>x.id===id);return b&&b.type!=="engine"&&b.type!=="volume";});
  if(!ids.length)return;
  const drop=new Set(ids);
  project.blocks=project.blocks.filter(b=>!drop.has(b.id));
  project.links=project.links.filter(l=>!drop.has(l.from)&&!drop.has(l.to));

}

function cloneBlock(src,dx,dy){
  if((BY_TYPE[src.type]||{}).kind==="input"&&nextFn(project)<0){setStatus(t("st_all_fns_used"));return null;}
  const b=JSON.parse(JSON.stringify(src));
  b.id=nid(b.type==="engine"?"engine_":"b",project.blocks.map(x=>x.id));
  b.fn=(BY_TYPE[b.type]||{}).kind==="input"?nextFn(project):-1;
  if((BY_TYPE[b.type]||{}).kind==="input"&&(!src.name||src.name==="F"+src.fn||src.name===tr(BY_TYPE.fx_in.name)))b.name="F"+b.fn;
  b.x=snapTo(project,b.x+(dx==null?GRID*2:dx));b.y=snapTo(project,b.y+(dy==null?GRID*2:dy));
  project.blocks.push(b);return b;
}
function cloneText(src,dx,dy){
  const tx=JSON.parse(JSON.stringify(src));
  tx.id=nextTextId(project);
  tx.x=snapTo(project,tx.x+(dx==null?GRID*2:dx));tx.y=snapTo(project,tx.y+(dy==null?GRID*2:dy));
  project.texts.push(tx);return tx;
}
function isBlockAllowedInMode(type,mode){
  const c=BY_TYPE[type];if(!c)return false;
  const ss=c.sections||(c.section?[c.section]:[]);
  if(mode==="scheme")return ss.includes("scheme");
  return !c.section||ss.includes("main")||ss.includes("mix");
}
function cloneGroup(blocks,links,texts,dx,dy){
  const idMap={},pastedBlocks=[],pastedTexts=[];
  (blocks||[]).forEach(src=>{
    if(!isBlockAllowedInMode(src.type,viewMode))return;
    const c=cloneBlock(src,dx,dy);
    if(!c)return;
    idMap[src.id]=c.id;pastedBlocks.push(c.id);
  });
  (links||[]).forEach(l=>{
    if(idMap[l.from]&&idMap[l.to]){
      const nl=JSON.parse(JSON.stringify(l));
      nl.id=nid("l",project.links.map(x=>x.id));
      nl.from=idMap[l.from];nl.to=idMap[l.to];
      project.links.push(nl);
    }
  });
  (texts||[]).forEach(src=>{const c=cloneText(src,dx,dy);pastedTexts.push(c.id);});
  return {pastedBlocks,pastedTexts};
}
function duplicateSelected(){
  const tx=(project.texts||[]).find(x=>x.id===selected);
  if(tx){const c=cloneText(tx);selected=c.id;selectedIds=new Set();render();setStatus(t("st_duplicated"));return;}
  const blockIds=selectedIds.size?[...selectedIds]:(selected?[selected]:[]);
  const rawBlocks=project.blocks.filter(b=>blockIds.indexOf(b.id)>=0);
  if(!rawBlocks.length)return;
  const blocks=rawBlocks.filter(b=>b.type!=="engine"&&b.type!=="volume");
  if(!blocks.length){setStatus(t("st_cant_dup"));return;}
  const idSet=new Set(blocks.map(b=>b.id));
  const links=project.links.filter(l=>idSet.has(l.from)&&idSet.has(l.to));
  const {pastedBlocks}=cloneGroup(blocks,links,[],GRID*2,GRID*2);
  if(!pastedBlocks.length)return;
  selectedIds=new Set(pastedBlocks);selected=pastedBlocks[pastedBlocks.length-1];
  render();setStatus(t("st_duplicated"));
}
function copySelected(){
  const blockIds=selectedIds.size?[...selectedIds]:(selected?[selected]:[]);
  const blocks=project.blocks.filter(b=>blockIds.indexOf(b.id)>=0&&b.type!=="engine"&&b.type!=="volume");
  const texts=(project.texts||[]).filter(tx=>tx.id===selected);
  if(!blocks.length&&!texts.length){setStatus(t("st_nothing_copy"));return;}
  const idSet=new Set(blocks.map(b=>b.id));
  const links=project.links.filter(l=>idSet.has(l.from)&&idSet.has(l.to));
  clip={blocks:blocks.map(b=>JSON.parse(JSON.stringify(b))),links:links.map(l=>JSON.parse(JSON.stringify(l))),texts:texts.map(tx=>JSON.parse(JSON.stringify(tx)))};
  pasteCount=0;setStatus(t("st_copied"));
}
function pasteClip(){
  if(!clip||(!(clip.blocks||[]).length&&!(clip.texts||[]).length)){setStatus(t("st_clip_empty"));return;}
  pasteCount++;const off=GRID*2*pasteCount;
  const {pastedBlocks,pastedTexts}=cloneGroup(clip.blocks,clip.links,clip.texts,off,off);
  if(!pastedBlocks.length&&!pastedTexts.length){setStatus(t("st_nothing_copy"));return;}
  if(pastedBlocks.length){selectedIds=new Set(pastedBlocks);selected=pastedBlocks[pastedBlocks.length-1];}
  else{selectedIds=new Set();selected=pastedTexts[pastedTexts.length-1]||"";}
  render();setStatus(t("st_pasted"));

function isReady(b,graph){
  const g=graph||project;
  const cat=BY_TYPE[b.type];if(!cat)return false;
  if(cat.kind==="engine")return engineRuns(b).length>0;
  if(cat.kind==="setting")return true;
  if(cat.kind==="output")return (b.channel|0)>=0&&(b.channel|0)<=7&&(g.links||[]).some(l=>l.to===b.id);
  if(cat.kind==="logicout")return (b.op|0)>=1&&(b.op|0)<=8&&(g.links||[]).some(l=>l.to===b.id);
  if(cat.kind==="input")return b.fn>=0&&b.fn<=28;
  if(cat.kind==="logicv")return (b.conds||[]).length>0;
  if(cat.kind==="var")return !!b.varName;
  if(cat.kind==="delay")return (b.delayMs|0)>0;
  if(cat.kind==="cue"){
    const s=b.scheme?schemeById(b.scheme):null;
    const schemeReady=s&&Array.isArray(s.blocks)&&s.blocks.length>0&&s.blocks.every(sb=>{
      const sc=BY_TYPE[sb.type];if(!sc)return false;
      if(sc.kind==="sound"&&sc.mode!=="mute")return !!(sb.files&&sb.files.sound);
      return true;
    });
    return (g.links||[]).some(l=>l.to===b.id)&&(s?schemeReady:!!b.files.sound);
  }
  const hasIn=(g.links||[]).some(l=>l.to===b.id);
  if(cat.mode==="speed")return (b.bands||[]).some(x=>x.file);
  if(cat.mode==="random")return hasIn&&(b.files.random||[]).some(Boolean);
  if(cat.mode==="decel")return !!b.files.sound;
  if(cat.mode==="mute")return (hasIn||viewMode==="scheme")&&(b.outDelay|0)>0;
  if(cat.mode==="start")return !!b.files.sound;
  if(cat.mode==="simple"||cat.mode==="loop"||cat.mode==="end")return (hasIn||viewMode==="scheme")&&!!b.files.sound;
  if(cat.kind==="sound"&&["oneshot","shortLong","latched","loopHeld"].indexOf(cat.mode)>=0)
    return hasIn||(b.trigger&&b.trigger!=="auto"&&b.trigger!=="fn")?!!(cat.roles||[]).some(r=>b.files[r]):false;
  return !!(cat.roles||[]).some(r=>b.files[r]);
}

function graphLayers(){
  const nodes=project.blocks,adj={},pred={},indeg={};
  const kindOf=id=>{const b=nodes.find(n=>n.id===id);return b?BY_TYPE[b.type].kind:"";};
  nodes.forEach(n=>{adj[n.id]=[];pred[n.id]=[];indeg[n.id]=0;});
  project.links.forEach(l=>{if(l.from===l.to)return;if(adj[l.from]===undefined||indeg[l.to]===undefined)return;if(kindOf(l.from)==="output")return;adj[l.from].push(l.to);pred[l.to].push(l.from);indeg[l.to]++;});
  const layer={},q=[];
  nodes.forEach(n=>{if(indeg[n.id]===0){layer[n.id]=0;q.push(n.id);}});
  if(!q.length)nodes.forEach((n,i)=>layer[n.id]=i);
  while(q.length){const u=q.shift();adj[u].forEach(v=>{layer[v]=Math.max(layer[v]==null?0:layer[v],layer[u]+1);if(--indeg[v]===0)q.push(v);});}
  nodes.forEach(n=>{if(layer[n.id]==null)layer[n.id]=0;});
  const cols={};nodes.forEach(n=>{(cols[layer[n.id]]=cols[layer[n.id]]||[]).push(n);});
  const order={};Object.keys(cols).forEach(L=>cols[L].forEach((n,i)=>order[n.id]=i));
  for(let pass=0;pass<3;pass++){
    Object.keys(cols).map(Number).sort((a,b)=>a-b).forEach(L=>{
      cols[L].forEach(n=>{const ps=pred[n.id].filter(p=>order[p]!=null);n._b=ps.length?ps.reduce((s,p)=>s+order[p],0)/ps.length:(order[n.id]||0);});
      cols[L].sort((a,b)=>a._b-b._b);cols[L].forEach((n,i)=>order[n.id]=i);
    });
  }
  return {cols,layer};
}

function wrapSvgLine(str,maxChars){
  const s=String(str||"");
  if(s.length<=maxChars)return [s];

  while(rem.length>maxChars){
    let cut=rem.lastIndexOf(" ",maxChars);
    if(cut<Math.floor(maxChars*0.45))cut=rem.lastIndexOf("·",maxChars);
    if(cut<Math.floor(maxChars*0.45))cut=rem.lastIndexOf("-",maxChars);
    if(cut<Math.floor(maxChars*0.45))cut=rem.lastIndexOf("_",maxChars);
    if(cut<Math.floor(maxChars*0.45))cut=maxChars;
    else cut+=1;
    out.push(rem.slice(0,cut).trim());
    rem=rem.slice(cut).trim();
  }
  if(rem)out.push(rem);
  return out.slice(0,3);
}

  svg+='<defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M3 2 L9 6 L3 10" fill="none" stroke="'+linkCol+'" stroke-width="1.7" stroke-linecap="round"/></marker></defs>';

  svg+='<text x="'+(totalW-24)+'" y="28" fill="'+mutedCol+'" font-size="12" text-anchor="end">'+esc(subTitle)+'</text>';
  const outLinksByFrom={},inLinksByTo={};
  project.links.forEach(l=>{
    if(!pos[l.from]||!pos[l.to])return;
    (outLinksByFrom[l.from]=outLinksByFrom[l.from]||[]).push(l);
    (inLinksByTo[l.to]=inLinksByTo[l.to]||[]).push(l);
  });
  Object.keys(outLinksByFrom).forEach(fid=>{
    outLinksByFrom[fid].sort((a,b)=>(pos[a.to]?pos[a.to].y:0)-(pos[b.to]?pos[b.to].y:0));
  });
  Object.keys(inLinksByTo).forEach(tid=>{
    inLinksByTo[tid].sort((a,b)=>(pos[a.from]?pos[a.from].y:0)-(pos[b.from]?pos[b.from].y:0));
  });
  const portY=(blkId,l,isOut)=>{
    const p=pos[blkId];if(!p)return 0;
    const b=project.blocks.find(x=>x.id===blkId);
    if(isOut&&b){
      if(b.type==="engine"){
        const ports=enginePorts(b),idx=Math.max(0,ports.indexOf(outPortOf(l)));
        return p.y+26+idx*((p.h-34)/Math.max(1,ports.length-1||1));
      }
      const cat=BY_TYPE[b.type];
      if(cat&&cat.outputs&&cat.outputs.length>1){
        const idx=Math.max(0,cat.outputs.indexOf(outPortOf(l)));
        return p.y+28+idx*((p.h-40)/Math.max(1,cat.outputs.length-1));
      }
      const list=outLinksByFrom[blkId]||[l];
      if(list.length>1){
        const idx=Math.max(0,list.indexOf(l));
        return p.y+p.h*0.3+idx*(p.h*0.4/Math.max(1,list.length-1));
      }
    }else if(!isOut){
      const list=inLinksByTo[blkId]||[l];
      if(list.length>1){
        const idx=Math.max(0,list.indexOf(l));
        return p.y+p.h*0.28+idx*(p.h*0.44/Math.max(1,list.length-1));
      }
    }
    return p.y+p.h/2;
  };
  project.links.forEach((l,li)=>{const a=pos[l.from],b=pos[l.to];if(!a||!b)return;
    const x1=a.x+CARD_W,y1=Math.round(portY(l.from,l,true)),x2=b.x,y2=Math.round(portY(l.to,l,false)),dx=Math.max(45,Math.abs(x2-x1)*0.48);
    svg+='<path d="M'+x1+' '+y1+' C'+(x1+dx)+' '+y1+' '+(x2-dx)+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="'+linkCol+'" stroke-width="1.6" marker-end="url(#arr)"/>';
    const siblings=outLinksByFrom[l.from]||[l],sIdx=siblings.indexOf(l);
    const tParam=siblings.length>1?(0.36+(sIdx%3)*0.14):0.5;
    const mt=1-tParam,lx=Math.round(mt*mt*mt*x1+3*mt*mt*tParam*(x1+dx)+3*mt*tParam*tParam*(x2-dx)+tParam*tParam*tParam*x2);
    const ly=Math.round(mt*mt*mt*y1+3*mt*mt*tParam*y1+3*mt*tParam*tParam*y2+tParam*tParam*tParam*y2)-5;
    const cTxt=linkCondText(l);
    const tw=Math.max(28,cTxt.length*5.6+8);
    svg+='<rect x="'+(lx-tw/2)+'" y="'+(ly-10)+'" width="'+tw+'" height="13" rx="3" fill="'+lblBg+'"/>';
    svg+='<text x="'+lx+'" y="'+ly+'" fill="'+linkCol+'" font-size="10" text-anchor="middle">'+esc(cTxt)+'</text>';});
  layers.forEach(L=>cols[L].forEach(n=>{const p=pos[n.id];const c=blockColor(n.type);
    svg+='<rect x="'+p.x+'" y="'+p.y+'" width="'+CARD_W+'" height="'+p.h+'" rx="8" fill="'+cardBg+'" stroke="'+c+'" stroke-width="1.5"/>';
    svg+='<rect x="'+p.x+'" y="'+p.y+'" width="'+CARD_W+'" height="24" rx="8" fill="'+hexA(c,isLight?0.18:0.26)+'"/>';
    svg+='<text x="'+(p.x+10)+'" y="'+(p.y+17)+'" fill="'+textCol+'" font-size="13" font-weight="600">'+esc(blockName(n))+'</text>';
    (info[n.id]||[]).forEach((line,i)=>{svg+='<text x="'+(p.x+10)+'" y="'+(p.y+38+i*LH)+'" fill="'+mutedCol+'" font-size="11">'+esc(line)+'</text>';});}));
  if(texts.length){
    texts.forEach((tx,i)=>{
      const col=tx.color||textCol;
      svg+='<text x="24" y="'+(textStartY+i*20)+'" fill="'+esc(col)+'" font-size="12" font-style="italic">• '+esc(tx.text||"")+'</text>';
    });
  }
  svg+='</svg>';return svg;
}
function exportSchemePng(){
  if(!project.blocks.length){setStatus(t("st_no_scheme"));return;}
  const svgStr=buildSchemeSvg();const m=svgStr.match(/width="(\d+)" height="(\d+)"/);const W=m?+m[1]:800,H=m?+m[2]:600;
  const isLight=document.documentElement.getAttribute("data-theme")==="light";
  const img=new Image();
  img.onload=()=>{const sc=2;const cv=document.createElement("canvas");cv.width=W*sc;cv.height=H*sc;const ctx=cv.getContext("2d");
    ctx.fillStyle=isLight?"#eef1f7":"#0f1420";ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);
    const a=document.createElement("a");a.href=cv.toDataURL("image/jpeg",0.92);a.download=exportFileBase()+"-scheme.jpg";a.click();setStatus(t("st_png_saved"));};
  img.onerror=()=>setStatus(t("st_png_fail"));
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgStr);
}
function buildText(){
  const title=viewMode==="scheme"?((activeScheme()||{}).name||t("scheme_new")):schemeName();
  const L=[];L.push(t("bt_scheme")+title);L.push(t("bt_counts_a")+project.blocks.length+t("bt_counts_b")+project.links.length);L.push("");
  L.push(t("bt_blocks"));
  project.blocks.forEach(b=>{L.push("* "+blockName(b)+" ["+tr(BY_TYPE[b.type].name)+"]");blockDetailLines(b).forEach(x=>L.push("    "+x));});
  L.push("");L.push(t("bt_links"));
  project.links.forEach(l=>{const a=project.blocks.find(x=>x.id===l.from),c=project.blocks.find(x=>x.id===l.to);L.push("- "+(a?blockName(a):"?")+" -> "+(c?blockName(c):"?")+" : "+linkCondText(l));});
  if((project.texts||[]).length){L.push("");L.push(t("bt_texts"));project.texts.forEach(tx=>L.push("- "+(tx.text||"")+" ("+Math.round(tx.x)+", "+Math.round(tx.y)+")"));}
  return L.join("\r\n");
}

window.addEventListener("keydown",ev=>{
  if(ev.target&&(ev.target.isContentEditable||/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)))return;
  if((ev.key==="Delete"||ev.key==="Backspace")&&!ev.ctrlKey&&!ev.metaKey){
    if(selectedLink){ev.preventDefault();project.links=project.links.filter(l=>l.id!==selectedLink);selectedLink="";render();return;}
    if(selected&&(project.texts||[]).some(x=>x.id===selected)){ev.preventDefault();removeText(selected);return;}
    if(selectedIds.size){ev.preventDefault();deleteSelected();}
    return;
  }
  /* Shortcuts use ev.code (physical key) so Ctrl+C/V/Z/Y/D work on any
   * keyboard layout (on a Russian layout ev.key is "с"/"м"/... instead). */
  if(ev.ctrlKey&&!ev.shiftKey&&ev.code==="Insert"){ev.preventDefault();copySelected();return;}
  if(ev.shiftKey&&!ev.ctrlKey&&!ev.metaKey&&ev.code==="Insert"){ev.preventDefault();pasteClip();return;}
  if(!(ev.ctrlKey||ev.metaKey))return;
  const k=(ev.key||"").toLowerCase(),code=ev.code||"";
  const is=ch=>code==="Key"+ch||k===ch.toLowerCase();
  if(is("Z")&&!ev.shiftKey){ev.preventDefault();undo();}
  else if(is("Y")||(is("Z")&&ev.shiftKey)){ev.preventDefault();redo();}
  else if(is("D")){ev.preventDefault();duplicateSelected();}
  else if(is("C")){ev.preventDefault();copySelected();}
  else if(is("V")){ev.preventDefault();pasteClip();}
});
