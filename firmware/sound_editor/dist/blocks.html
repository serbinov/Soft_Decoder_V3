<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Конструктор звуковых блоков</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161b26; --panel2:#1e2533; --line:#2b3547;
    --text:#e7ecf5; --muted:#93a0b5; --accent:#4a9eff; --ok:#4caf72;
    --warn:#e0a24a; --err:#e05a5a; --node:#1b2230; --nodehd:#242f42;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  body{display:flex;flex-direction:column;overflow:hidden}
  header.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-weight:600}
  .brand span{color:var(--accent);font-weight:400}
  .grow{flex:1}
  .status{font-size:12px;color:var(--muted)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--err);margin-right:5px;vertical-align:middle}
  .dot.on{background:var(--ok)}
  button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04101f;font-weight:600}
  button.apply{background:var(--ok);border-color:var(--ok);color:#04170c;font-weight:600}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.sm{padding:3px 7px;font-size:12px}
  main{flex:1;display:flex;min-height:0}
  aside{background:var(--panel);border-right:1px solid var(--line);width:220px;overflow:auto;padding:10px}
  aside.right{border-right:none;border-left:1px solid var(--line);width:280px}
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 6px}
  aside h2:first-child{margin-top:0}
  .pal-group{margin-bottom:10px}
  .pal-group>header{font-size:11px;color:var(--muted);margin-bottom:4px}
  .pal button{display:block;width:100%;text-align:left;margin-bottom:5px}
  .pal button b{display:block;font-weight:600}
  .pal button small{color:var(--muted)}
  #stage{position:relative;flex:1;overflow:hidden;background:
    radial-gradient(circle at 1px 1px, #263042 1px, transparent 0) 0 0/22px 22px}
  #world{position:absolute;left:0;top:0;transform-origin:0 0}
  #links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  #links path{stroke:#5b708f;stroke-width:2;fill:none;pointer-events:stroke;cursor:pointer}
  #links path:hover{stroke:var(--err)}
  .node{position:absolute;width:210px;background:var(--node);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35);user-select:none}
  .node.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(74,158,255,.35)}
  .node .hd{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:9px 9px 0 0;background:var(--nodehd);cursor:grab}
  .node .hd b{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .hd .x{background:none;border:none;color:var(--muted);padding:0 2px}
  .node .bd{padding:7px 9px;font-size:12px;color:var(--muted)}
  .node .bd .k{color:var(--text)}
  .node .badge{font-size:10px;padding:1px 5px;border-radius:8px;background:#0006}
  .port{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--accent);top:26px;border:2px solid var(--node)}
  .port.in{left:-6px}.port.out{right:-6px;background:var(--ok)}
  .port{cursor:crosshair}
  aside.right label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
  aside.right input,aside.right select{width:100%;padding:5px 7px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .hint{font-size:11px;color:var(--muted);margin:6px 0}
  footer.foot{display:flex;gap:12px;align-items:center;padding:6px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
  .diag{max-height:80px;overflow:auto;font-size:11px;width:100%}
  .diag .d{color:var(--err)}.diag .w{color:var(--warn)}
  .banner{padding:6px 12px;font-size:12px;background:#332a12;color:var(--warn);border-bottom:1px solid var(--line)}
  .hidden{display:none}
</style>
</head>
<body>
<header class="top">
  <div class="brand">AURA-X <span>КОНСТРУКТОР БЛОКОВ</span></div>
  <div class="status"><i class="dot" id="on"></i><span id="on_txt">Нет связи</span></div>
  <div class="grow"></div>
  <button id="b_new">Новая</button>
  <button id="b_import">Импорт</button>
  <button id="b_export">Экспорт</button>
  <button id="b_validate">Проверить</button>
  <button class="primary" id="b_save" disabled>Сохранить</button>
  <button class="apply" id="b_apply" disabled>Применить</button>
  <a class="btn" href="/" style="text-decoration:none"><button>Интерфейс декодера</button></a>
  <input type="file" id="f_import" accept=".json,application/json" class="hidden" />
</header>

<main>
  <aside class="left">
    <h2>Готовые блоки</h2>
    <div class="pal" id="palette"></div>
  </aside>

  <section id="stage">
    <div id="world">
      <svg id="links" width="6000" height="4000"></svg>
      <div id="nodes"></div>
    </div>
  </section>

  <aside class="right">
    <h2>Настройка блока</h2>
    <div id="inspector"><p class="hint">Выберите блок на холсте или добавьте новый слева.</p></div>
    <h2>Проверка</h2>
    <div id="summary" class="hint"></div>
  </aside>
</main>

<footer class="foot">
  <span id="status_txt">Готово</span>
  <span class="grow"></span>
  <span id="counts"></span>
  <div class="diag" id="diag"></div>
</footer>

<script>
(function(){
"use strict";

const LIMITS={states:57,soundStates:31,transitions:128,effects:24,assets:31,jsonBytes:131072};
const STORE_KEY="aura_blocks_project_v1";

/* ---- ready block catalog -------------------------------------------- */
const CATALOG=[
  {type:"engine",name:"Двигатель",group:"Основные",mode:"engine",roles:[]},
  {type:"horn",name:"Гудок",group:"Сигналы",mode:"shortLong",roles:["start","loop","end","short"]},
  {type:"whistle",name:"Тифон",group:"Сигналы",mode:"oneshot",roles:["sound"]},
  {type:"signal",name:"Короткий сигнал",group:"Сигналы",mode:"oneshot",roles:["sound"]},
  {type:"bell",name:"Звонок",group:"Сигналы",mode:"latched",roles:["sound"]},
  {type:"compressor",name:"Компрессор",group:"Механика",mode:"loopHeld",roles:["sound"]},
  {type:"brake",name:"Тормоз",group:"Механика",mode:"latched",roles:["sound"]},
  {type:"coupler",name:"Сцепка",group:"Механика",mode:"oneshot",roles:["sound"]},
  {type:"sander",name:"Песочница",group:"Механика",mode:"oneshot",roles:["sound"]},
  {type:"pantograph",name:"Токоприёмник",group:"Механика",mode:"oneshot",roles:["sound"]},
  {type:"doors",name:"Двери",group:"Механика",mode:"oneshot",roles:["sound"]},
  {type:"custom",name:"Свой сценарий",group:"Дополнительно",mode:"shortLong",roles:["start","loop","end","short"]}
];
const BY_TYPE={};CATALOG.forEach(c=>BY_TYPE[c.type]=c);
const ROLE_NAMES={start:"Начало",loop:"Тело (цикл)",end:"Конец",short:"Короткий",sound:"Звук"};
const TRIGGER_NAMES={auto:"Авто (по связи/F)",fn:"F-клавиша",engine:"При двигателе"};
const MODE_NAMES={engine:"Двигатель",shortLong:"Короткий/длинный",oneshot:"Один раз",latched:"Переключатель",loopHeld:"Цикл пока активно"};

/* ---- state ----------------------------------------------------------- */
let project=null;
let selected="";
let dragging=null;             // {id,dx,dy}
let panning=null;              // {x,y,px,py}
let linking=null;              // {from,x,y}
let online=false,busy=false,revision=0,savedId="";
let tracks=[];
let diagnostics=[];
let assets={};

const $=id=>document.getElementById(id);
const clone=v=>JSON.parse(JSON.stringify(v));
const nid=(p,ids)=>{let i=1;while(ids.includes(p+i))i++;return p+i;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function newProject(){
  const p={format:"sound-blocks",schemaVersion:1,id:"blocks_graph",name:"Новая схема тепловоза",
    blocks:[],links:[],editor:{viewport:{x:40,y:40,zoom:1}}};
  addBlockTo(p,"engine");
  return p;
}
function addBlockTo(p,type){
  const cat=BY_TYPE[type];if(!cat)return null;
  if(type==="engine"&&p.blocks.some(b=>b.type==="engine"))return null;
  const id=nid(type==="engine"?"engine_":"b",p.blocks.map(b=>b.id));
  const b={id,type,name:cat.name,fn:type==="engine"?8:nextFn(p),trigger:"auto",volume:80,rate:1000,files:{}};
  (cat.roles||[]).forEach(r=>b.files[r]="");
  if(type==="engine"){b.steps=3;b.files={start:"",idle:"",stop:"",run:["","",""]};}
  const n=p.blocks.length;
  b.x=60+(n%3)*240;b.y=60+Math.floor(n/3)*140;
  p.blocks.push(b);return b;
}
function nextFn(p){const used=new Set(p.blocks.filter(b=>b.type!=="engine").map(b=>b.fn));let f=0;while(used.has(f)&&f<28)f++;return f;}

/* ---- compile blocks -> device sound-graph (schema v1) ---------------- */
function compile(){
  const states=[],transitions=[],effects=[];
  const files=new Set();let tid=0;
  const addState=(id,name,file,loop,volume=80,rate=1000)=>{
    if(states.some(s=>s.id===id))return;
    states.push({id,name,file:file||"",loop:!!loop,volume,rate});if(file)files.add(file);
  };
  const silent=(id,name)=>addState(id,name,"",false,100,1000);
  const addEdge=(source,target,condition,priority=10,timing="immediate")=>{
    transitions.push({id:"t"+(++tid),source,target,priority,timing,condition});
  };
  const engine=project.blocks.find(b=>b.type==="engine");
  const engineEntry=engine?engine.id+"_off":"engine_off";
  silent(engineEntry,"Выкл / тихий вход");

  const linkedFromEngine=id=>project.links.some(l=>l.to===id&&(project.blocks.find(b=>b.id===l.from)||{}).type==="engine");
  const triggerOf=b=>b.trigger==="auto"?(linkedFromEngine(b.id)?"engine":"fn"):b.trigger;

  for(const b of project.blocks){
    const fn=b.fn,vol=b.volume,rate=b.rate||1000;
    if(b.type==="engine"){
      const has=f=>!!f;
      const start=b.files.start,idle=b.files.idle,stop=b.files.stop||"";
      const run=Array.isArray(b.files.run)?b.files.run:[];
      const steps=Math.max(1,Math.min(10,b.steps||1));
      if(has(start))addState(b.id+"_start","Запуск двигателя",start,false,vol,rate);
      addState(b.id+"_idle","Холостой ход",idle,true,vol,rate);
      for(let i=1;i<=steps;i++)if(run[i-1])addState(b.id+"_run"+i,"Движение "+i,run[i-1],true,vol,rate);
      if(has(stop))addState(b.id+"_stop","Останов двигателя",stop,false,vol,rate);
      const first=has(start)?b.id+"_start":b.id+"_idle";
      addEdge(b.id+"_off",first,{type:"engine_on"},10);
      if(has(start))addEdge(b.id+"_start",b.id+"_idle",{type:"sample_done"},10);
      const stopTarget=has(stop)?b.id+"_stop":b.id+"_off";
      addEdge(b.id+"_idle",stopTarget,{type:"engine_off"},255);
      if(has(start))addEdge(b.id+"_start",stopTarget,{type:"engine_off"},255);
      if(has(stop))addEdge(b.id+"_stop",b.id+"_off",{type:"sample_done"},10);
      const band=i=>[Math.floor((i-1)*255/steps)+1,Math.floor(i*255/steps)];
      for(let i=1;i<=steps;i++)if(run[i-1]){
        const [lo,hi]=band(i);
        addEdge(b.id+"_idle",b.id+"_run"+i,{type:"speed",min:lo,max:hi},i,"after_sample");
        addEdge(b.id+"_run"+i,b.id+"_idle",{type:"speed",min:0,max:0},0,"after_sample");
        addEdge(b.id+"_run"+i,stopTarget,{type:"engine_off"},255);
        for(let j=1;j<=steps;j++)if(j!==i&&run[j-1])addEdge(b.id+"_run"+i,b.id+"_run"+j,{type:"speed",min:band(j)[0],max:band(j)[1]},j,"after_sample");
      }
      continue;
    }
    const entry=b.id+"_off";silent(entry,b.name+" / тихий вход");
    effects.push({id:b.id,entry,fn});
    const trig=triggerOf(b),startCond=trig==="engine"?{type:"engine_on"}:{type:"fn_press",fn};
    const stopCond=trig==="engine"?{type:"engine_off"}:{type:"fn_release",fn};
    const mode=BY_TYPE[b.type].mode;
    if(mode==="oneshot"){
      if(b.files.sound){addState(b.id+"_play",b.name,b.files.sound,false,vol,rate);addEdge(entry,b.id+"_play",startCond,10);addEdge(b.id+"_play",entry,{type:"sample_done"},10);}
    }else if(mode==="shortLong"){
      if(b.files.short){addState(b.id+"_short",b.name+" (короткий)",b.files.short,false,vol,rate);addEdge(entry,b.id+"_short",startCond,1);addEdge(b.id+"_short",entry,{type:"sample_done"},1);}
      const first=b.files.start?b.id+"_start":b.files.loop?b.id+"_loop":b.files.end?b.id+"_end":"";
      if(b.files.start)addState(b.id+"_start",b.name+" начало",b.files.start,false,vol,rate);
      if(b.files.loop)addState(b.id+"_loop",b.name+" цикл",b.files.loop,true,vol,rate);
      if(b.files.end)addState(b.id+"_end",b.name+" конец",b.files.end,false,vol,rate);
      if(first)addEdge(entry,first,startCond,10);
      if(b.files.start&&b.files.loop)addEdge(b.id+"_start",b.id+"_loop",{type:"sample_done"},10);
      if(b.files.end){addEdge(first||entry,b.id+"_end",stopCond,5);addEdge(b.id+"_end",entry,{type:"sample_done"},10);}
      else if(b.files.loop)addEdge(b.id+"_loop",entry,stopCond,5);
      else if(b.files.start)addEdge(b.id+"_start",entry,{type:"sample_done"},10);
    }else if(mode==="loopHeld"){
      if(b.files.sound){addState(b.id+"_loop",b.name,b.files.sound,true,vol,rate);addEdge(entry,b.id+"_loop",startCond,10);addEdge(b.id+"_loop",entry,stopCond,10);}
    }else if(mode==="latched"){
      if(b.files.sound){addState(b.id+"_play",b.name,b.files.sound,true,vol,rate);addEdge(entry,b.id+"_play",trig==="engine"?{type:"engine_on"}:{type:"fn_on",fn},10);addEdge(b.id+"_play",entry,trig==="engine"?{type:"engine_off"}:{type:"fn_off",fn},10);}
    }
  }
  const positions={};project.blocks.forEach(b=>{positions[b.id]={x:b.x,y:b.y};});
  const payload={format:"sound-graph",schemaVersion:1,id:project.id,name:project.name,
    engine:{entry:engineEntry,fn:engine?engine.fn:8},hysteresis:engine?3:0,
    effectTables:[],sources:[],blocks:[],sinks:[],wires:[],
    states,transitions,effects,assets:Object.keys(assets).map(f=>assets[f]),
    editor:{positions,viewport:project.editor.viewport}};
  return {payload,files:[...files]};
}

/* ---- client validation ---------------------------------------------- */
function validate(){
  const {payload,files}=compile();
  const out=[];
  const err=(code,id,message)=>out.push({code,id,message,severity:"error"});
  const warn=(code,id,message)=>out.push({code,id,message,severity:"warning"});
  if(payload.states.length>LIMITS.states)err("cap","","Состояний "+payload.states.length+" > "+LIMITS.states+". Упростите схему.");
  if(payload.states.filter(s=>s.file).length>LIMITS.soundStates)err("cap","","Звуковых состояний > "+LIMITS.soundStates+".");
  if(payload.transitions.length>LIMITS.transitions)err("cap","","Переходов "+payload.transitions.length+" > "+LIMITS.transitions+".");
  if(payload.effects.length>LIMITS.effects)err("cap","","Эффектов > "+LIMITS.effects+".");
  const silent=new Set(payload.states.filter(s=>!s.file).map(s=>s.id));
  if(!silent.has(payload.engine.entry))err("entry","","Вход двигателя должен быть тихим.");
  payload.effects.forEach(e=>{if(!silent.has(e.entry))err("entry",e.id,"Вход эффекта должен быть тихим.");});
  const used={};payload.transitions.forEach(e=>{const k=e.source+":"+e.priority;if(used[k])err("priority",e.id,"Дублирующийся приоритет у источника "+e.source+".");used[k]=1;});
  const ids=new Set(payload.states.map(s=>s.id));
  payload.transitions.forEach(e=>{if(!ids.has(e.source))err("ref",e.id,"Нет состояния "+e.source);if(!ids.has(e.target))err("ref",e.id,"Нет состояния "+e.target);});
  files.forEach(f=>{if(!assets[f])warn("asset","","Нет WAV на устройстве: "+f+" (проверьте перед применением).");});
  return {payload,files,diagnostics:out};
}

/* ---- API ------------------------------------------------------------- */
async function req(path,init){
  const r=await fetch(path,Object.assign({cache:"no-store"},init||{}));
  let data;try{data=JSON.parse(await r.text());}catch(e){throw new Error("Устройство вернуло не-JSON ("+r.status+")");}
  if(!r.ok||data.ok!==true)throw new Error(data.error||("Ошибка "+r.status));
  return data;
}
async function refreshStatus(){
  try{const s=await req("/api/sound/graph/state");online=true;revision=Number(s.revision)||0;}
  catch(e){online=false;}
  $("on").classList.toggle("on",online);$("on_txt").textContent=online?"Подключено":"Нет связи";
  try{const t=await req("/api/audio/tracks");tracks=(t.tracks||[]).map(x=>String(x.file||"").replace(/^audio\//,"")).filter(f=>/^[A-Za-z0-9_-]+\.wav$/.test(f));}catch(e){tracks=[];}
  $("b_save").disabled=!online||busy;$("b_apply").disabled=!online||busy||!revision;
}
async function fetchAssets(files){
  for(const f of files){if(assets[f])continue;try{const a=await req("/api/sound/graph/asset?file="+encodeURIComponent(f));assets[f]=a.asset;}catch(e){}}
}

async function doValidate(){
  if(busy)return;busy=true;refreshButtons();setStatus("Проверка...");
  try{const v=validate();await fetchAssets(v.files);const v2=validate();diagnostics=v2.diagnostics;
    if(online){try{const r=await req("/api/sound/graph/validate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v.payload)});if(r.diagnostics)r.diagnostics.forEach(d=>diagnostics.push(d));}catch(e){diagnostics.push({code:"device",id:"",message:e.message,severity:"error"});}}
    renderSummary(v2);renderDiag();setStatus(diagnostics.some(d=>d.severity!=="warning")?"Есть ошибки":"Проверка пройдена");
  }catch(e){setStatus("Ошибка: "+e.message);}finally{busy=false;refreshButtons();}
}
async function doSave(){
  if(busy)return;busy=true;refreshButtons();setStatus("Сохранение...");
  try{const v=validate();if(v.diagnostics.some(d=>d.severity!=="warning")){diagnostics=v.diagnostics;renderDiag();throw new Error("Исправьте ошибки перед сохранением");}
    await fetchAssets(v.files);v.payload.assets=Object.keys(assets).map(f=>assets[f]);
    const q="?id="+encodeURIComponent(project.id)+"&expectedRevision="+(project.id===savedId?revision:0);
    const r=await req("/api/sound/graph/save"+q,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v.payload)});
    revision=Number(r.revision)||revision;savedId=project.id;setStatus("Сохранена версия "+revision);await refreshStatus();
  }catch(e){setStatus("Не сохранено: "+e.message);}finally{busy=false;refreshButtons();}
}
async function doApply(){
  if(busy||!revision)return;busy=true;refreshButtons();setStatus("Применение...");
  try{await req("/api/sound/graph/apply?id="+encodeURIComponent(project.id)+"&revision="+revision,{method:"POST"});setStatus("Применена версия "+revision);}
  catch(e){setStatus("Не применено: "+e.message);}finally{busy=false;refreshButtons();}
}

/* ---- persistence ----------------------------------------------------- */
function saveDraft(){try{localStorage.setItem(STORE_KEY,JSON.stringify({project,revision,savedId}));}catch(e){}}
function loadDraft(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return;const d=JSON.parse(raw);if(d&&d.project&&d.project.format==="sound-blocks"){project=d.project;revision=d.revision||0;savedId=d.savedId||"";}}catch(e){}}

/* ---- rendering ------------------------------------------------------- */
function renderPalette(){
  const groups={};CATALOG.forEach(c=>{(groups[c.group]=groups[c.group]||[]).push(c);});
  const hasEngine=project.blocks.some(b=>b.type==="engine");
  let html="";
  for(const g in groups){html+='<div class="pal-group"><header>'+esc(g)+"</header>";groups[g].forEach(c=>{
    const dis=c.type==="engine"&&hasEngine;
    html+='<button data-add="'+c.type+'"'+(dis?" disabled":"")+'><b>'+esc(c.name)+"</b><small>"+esc(MODE_NAMES[c.mode])+"</small></button>";
  });html+="</div>";}
  $("palette").innerHTML=html;
  $("palette").querySelectorAll("[data-add]").forEach(btn=>btn.onclick=()=>{const b=addBlockTo(project,btn.getAttribute("data-add"));if(b){selected=b.id;render();}});
}
function nodeSummary(b){
  if(b.type==="engine")return "Ступени: <span class='k'>"+((b.files.run||[]).filter(Boolean).length||0)+"</span> · F"+b.fn;
  const cat=BY_TYPE[b.type],parts=[];
  (cat.roles||[]).forEach(r=>{if(b.files[r])parts.push(ROLE_NAMES[r]+": "+esc(b.files[r]));});
  return "F"+b.fn+" · "+(parts.length?parts.join("<br>"):"файлы не заданы");
}
function renderNodes(){
  const box=$("nodes");box.innerHTML="";
  for(const b of project.blocks){
    const el=document.createElement("div");
    el.className="node"+(selected===b.id?" sel":"");el.style.left=b.x+"px";el.style.top=b.y+"px";el.dataset.id=b.id;
    el.innerHTML='<div class="hd" data-drag="'+b.id+'"><span class="badge">'+(b.type==="engine"?"двигатель":esc(BY_TYPE[b.type].name))+'</span><b>'+esc(b.name)+'</b><button class="x" data-del="'+b.id+'">✕</button></div>'+
      '<div class="bd">'+nodeSummary(b)+"</div>"+
      (b.type!=="engine"?'<div class="port in" data-in="'+b.id+'"></div>':'')+
      '<div class="port out" data-out="'+b.id+'"></div>';
    box.appendChild(el);
  }
  box.querySelectorAll("[data-drag]").forEach(h=>h.addEventListener("pointerdown",onNodeDown));
  box.querySelectorAll("[data-del]").forEach(x=>x.onclick=e=>{e.stopPropagation();removeBlock(x.getAttribute("data-del"));});
  box.querySelectorAll("[data-out]").forEach(p=>p.addEventListener("pointerdown",onPortDown));
  box.querySelectorAll(".node .bd").forEach(bd=>bd.addEventListener("pointerdown",()=>{const id=bd.closest(".node").dataset.id;if(selected!==id){selected=id;render();}}));
}
const NODE_W=210,NODE_H=96;
function renderLinks(){
  const byId={};project.blocks.forEach(b=>byId[b.id]=b);
  let html="";
  for(const l of project.links){const a=byId[l.from],b=byId[l.to];if(!a||!b)continue;
    const x1=a.x+NODE_W,y1=a.y+32,x2=b.x,y2=b.y+32,dx=Math.max(40,Math.abs(x2-x1)/2);
    html+='<path data-link="'+l.id+'" d="M'+x1+' '+y1+' C'+(x1+dx)+' '+y1+' '+(x2-dx)+' '+y2+' '+x2+' '+y2+'"></path>';}
  $("links").innerHTML=html;
  $("links").querySelectorAll("[data-link]").forEach(p=>p.onclick=()=>{project.links=project.links.filter(l=>l.id!==p.getAttribute("data-link"));render();});
}
function renderInspector(){
  const b=project.blocks.find(x=>x.id===selected);
  const insp=$("inspector");
  if(!b){insp.innerHTML='<p class="hint">Выберите блок на холсте или добавьте новый слева.</p>';return;}
  const cat=BY_TYPE[b.type];
  let h='<label>Название</label><input id="i_name" value="'+esc(b.name)+'">';
  h+='<div class="row"><label>F-клавиша</label><label>Громкость</label></div><div class="row">'+
     '<select id="i_fn">'+Array.from({length:29},(_,i)=>'<option value="'+i+'"'+(b.fn===i?" selected":"")+">F"+i+"</option>").join("")+"</select>"+
     '<input type="number" id="i_vol" min="0" max="100" value="'+b.volume+'"></div>';
  if(b.type!=="engine")h+='<label>Запуск</label><select id="i_trig">'+Object.keys(TRIGGER_NAMES).map(k=>'<option value="'+k+'"'+(b.trigger===k?" selected":"")+">"+TRIGGER_NAMES[k]+"</option>").join("")+"</select>";
  if(b.type==="engine"){
    h+='<label>Ступени скорости</label><input type="number" id="i_steps" min="1" max="10" value="'+(b.steps||1)+'">';
    h+='<label>Начало (запуск)</label>'+fileSelect("start",b);h+='<label>Холостой ход (цикл)</label>'+fileSelect("idle",b);
    const run=b.files.run||[];for(let i=1;i<=(b.steps||1);i++){h+='<label>Движение '+i+' (цикл)</label><input id="i_run'+i+'" data-run="'+(i-1)+'" list="files" value="'+esc(run[i-1]||"")+'">';}
    h+='<label>Останов</label>'+fileSelect("stop",b);
  }else{
    (cat.roles||[]).forEach(r=>{h+='<label>'+ROLE_NAMES[r]+'</label>'+fileSelect(r,b);});
  }
  h+='<datalist id="files">'+tracks.map(f=>'<option value="'+esc(f)+'"></option>').join("")+"</datalist>";
  h+='<div class="row" style="margin-top:10px"><button class="primary" id="i_close">Готово</button><button id="i_del">Удалить</button></div>';
  insp.innerHTML=h;
  const on=(id,ev,fn)=>{const el=$(id);if(el)el.addEventListener(ev,fn);};
  on("i_name","change",e=>{b.name=e.target.value;render();});
  on("i_fn","change",e=>{b.fn=Number(e.target.value);render();});
  on("i_vol","change",e=>{b.volume=Math.max(0,Math.min(100,Number(e.target.value)));render();});
  on("i_trig","change",e=>{b.trigger=e.target.value;render();});
  on("i_steps","change",e=>{b.steps=Math.max(1,Math.min(10,Number(e.target.value)));const run=b.files.run||[];const arr=[];for(let i=0;i<b.steps;i++)arr.push(run[i]||"");b.files.run=arr;render();});
  insp.querySelectorAll("[data-role]").forEach(el=>el.addEventListener("change",e=>{b.files[el.getAttribute("data-role")]=e.target.value;render();}));
  insp.querySelectorAll("[data-run]").forEach(el=>el.addEventListener("change",e=>{if(!b.files.run)b.files.run=[];b.files.run[Number(el.getAttribute("data-run"))]=e.target.value;render();}));
  on("i_close","click",()=>{selected="";render();});
  on("i_del","click",()=>removeBlock(b.id));
}
function fileSelect(role,b){
  return '<input data-role="'+role+'" list="files" value="'+esc(b.files[role]||"")+'" placeholder="выберите или введите .wav">';
}
function removeBlock(id){
  if(project.blocks.find(b=>b.id===id&&b.type==="engine")&&project.blocks.filter(b=>b.type==="engine").length<=1)return;
  project.blocks=project.blocks.filter(b=>b.id!==id);
  project.links=project.links.filter(l=>l.from!==id&&l.to!==id);
  if(selected===id)selected="";render();
}
function renderSummary(v){
  const p=(v&&v.payload)||compile().payload;
  $("counts").textContent="Состояний "+p.states.length+"/"+LIMITS.states+" · переходов "+p.transitions.length+"/"+LIMITS.transitions+" · эффектов "+p.effects.length+"/"+LIMITS.effects+" · блоков "+project.blocks.length;
  const e=diagnostics.filter(d=>d.severity!=="warning").length,w=diagnostics.filter(d=>d.severity==="warning").length;
  $("summary").textContent=e+" ошибок / "+w+" предупреждений";
}
function renderDiag(){
  $("diag").innerHTML=diagnostics.map(d=>'<div class="'+(d.severity==="warning"?"w":"d")+'">'+esc(d.message)+"</div>").join("");
}
function render(){renderPalette();renderNodes();renderLinks();renderInspector();renderSummary();saveDraft();}
function setStatus(t){$("status_txt").textContent=t;}
function refreshButtons(){$("b_save").disabled=!online||busy;$("b_apply").disabled=!online||busy||!revision;$("b_validate").disabled=busy;}

/* ---- interaction ----------------------------------------------------- */
function worldPoint(ev){const r=$("stage").getBoundingClientRect(),v=project.editor.viewport;return {x:(ev.clientX-r.left-v.x)/v.zoom,y:(ev.clientY-r.top-v.y)/v.zoom};}
function onNodeDown(ev){
  if(ev.target.classList.contains("x"))return;
  const id=ev.currentTarget.getAttribute("data-drag"),b=project.blocks.find(x=>x.id===id);if(!b)return;
  if(selected!==id){selected=id;render();}
  const p=worldPoint(ev);dragging={id,dx:p.x-b.x,dy:p.y-b.y};
  try{if(ev.currentTarget.setPointerCapture)ev.currentTarget.setPointerCapture(ev.pointerId);}catch(e){}
}
function onPortDown(ev){ev.stopPropagation();const id=ev.currentTarget.getAttribute("data-out"),p=worldPoint(ev);linking={from:id,x:p.x,y:p.y};}
function endLink(ev){
  if(!linking)return;
  const el=document.elementFromPoint(ev.clientX,ev.clientY);
  const target=el&&(el.getAttribute&&(el.getAttribute("data-in")||(el.closest&&el.closest("[data-in]")&&el.closest("[data-in]").getAttribute("data-in"))));
  if(target&&target!==linking.from&&!project.links.some(l=>l.from===linking.from&&l.to===target)){
    project.links.push({id:"l"+Date.now().toString(36),from:linking.from,to:target});
  }
  linking=null;render();
}
$("stage").addEventListener("pointerdown",ev=>{if(ev.target===$("stage")||ev.target.id==="world"||ev.target.id==="links"){const v=project.editor.viewport;panning={px:ev.clientX,py:ev.clientY,x:v.x,y:v.y};}});
window.addEventListener("pointermove",ev=>{
  if(dragging){const b=project.blocks.find(x=>x.id===dragging.id);if(b){const p=worldPoint(ev);b.x=Math.round(p.x-dragging.dx);b.y=Math.round(p.y-dragging.dy);const el=$("nodes").querySelector('[data-id="'+b.id+'"]');if(el){el.style.left=b.x+"px";el.style.top=b.y+"px";}renderLinks();}}
  else if(panning){const v=project.editor.viewport;v.x=panning.x+(ev.clientX-panning.px);v.y=panning.y+(ev.clientY-panning.py);applyViewport();}
});
window.addEventListener("pointerup",ev=>{if(dragging){dragging=null;saveDraft();}panning=null;endLink(ev);});
$("stage").addEventListener("wheel",ev=>{ev.preventDefault();const v=project.editor.viewport,r=$("stage").getBoundingClientRect();const mx=ev.clientX-r.left,my=ev.clientY-r.top;const f=ev.deltaY<0?1.1:0.9;const nz=Math.max(.3,Math.min(2.5,v.zoom*f));v.x=mx-(mx-v.x)*(nz/v.zoom);v.y=my-(my-v.y)*(nz/v.zoom);v.zoom=nz;applyViewport();saveDraft();},{passive:false});
function applyViewport(){const v=project.editor.viewport;$("world").style.transform="translate("+v.x+"px,"+v.y+"px) scale("+v.zoom+")";}

/* ---- toolbar --------------------------------------------------------- */
$("b_new").onclick=()=>{if(!confirm("Создать новую схему? Несохранённые правки будут потеряны."))return;project=newProject();selected="";revision=0;savedId="";assets={};diagnostics=[];applyViewport();render();setStatus("Новая схема");};
$("b_export").onclick=()=>{const blob=new Blob([JSON.stringify(project,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=project.id+".blocks.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$("b_import").onclick=()=>$("f_import").click();
$("f_import").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const p=JSON.parse(await f.text());if(!p||p.format!=="sound-blocks")throw new Error("Это не файл блоков");project=p;selected="";assets={};diagnostics=[];applyViewport();render();setStatus("Импортирована схема");}catch(err){alert("Импорт не удался: "+err.message);}};
$("b_validate").onclick=doValidate;
$("b_save").onclick=doSave;
$("b_apply").onclick=doApply;

/* ---- boot ------------------------------------------------------------ */
loadDraft();if(!project)project=newProject();applyViewport();render();refreshStatus();setInterval(refreshStatus,3000);
})();
</script>
</body>
</html>
