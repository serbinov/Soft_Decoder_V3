<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Конструктор звуковых блоков</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161b26; --panel2:#1e2533; --line:#2b3547;
    --text:#e7ecf5; --muted:#93a0b5; --accent:#4a9eff; --ok:#4caf72;
    --warn:#e0a24a; --err:#e05a5a; --node:#1b2230; --nodehd:#242f42;
    --stage:#0c1119; --grid:#1a2230; --link:#6f8bb0;
  }
  html[data-theme=light]{
    --bg:#eef1f7; --panel:#ffffff; --panel2:#f4f6fb; --line:#d3dae8;
    --text:#0b0f16; --muted:#5a6678; --accent:#2f6fd0; --ok:#1f9d63;
    --warn:#b8791a; --err:#d64545; --node:#ffffff; --nodehd:#eef2f9;
    --stage:#f7f9fd; --grid:#dde3ee; --link:#8a99b5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  body{display:flex;flex-direction:column;overflow:hidden}
  header.top{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-weight:600}
  .brand span{color:var(--accent);font-weight:400}
  .grow{flex:1}
  .status{font-size:12px;color:var(--muted)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--err);margin-right:5px;vertical-align:middle}
  .dot.on{background:var(--ok)}
  button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04101f;font-weight:600}
  button.apply{background:var(--ok);border-color:var(--ok);color:#04170c;font-weight:600}
  button.on{background:var(--accent);border-color:var(--accent);color:#04101f}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.sm{padding:3px 7px;font-size:12px}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
  main{flex:1;display:flex;min-height:0}
  aside{background:var(--panel);border-right:1px solid var(--line);width:230px;overflow:auto;padding:10px}
  aside.right{border-right:none;border-left:1px solid var(--line);width:290px}
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 6px}
  aside h2:first-child{margin-top:0}
  .pal-group{margin-bottom:10px}
  .pal-group>header{font-size:11px;color:var(--muted);margin-bottom:4px}
  .pal button{display:block;width:100%;text-align:left;margin-bottom:5px}
  .pal button b{display:block;font-weight:600}
  .pal button small{color:var(--muted)}
  #stage{position:relative;flex:1;overflow:hidden;background:var(--stage);--gstep:20px;--gx:0px;--gy:0px}
  #stage.grid-bg{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:var(--gstep) var(--gstep);background-position:var(--gx) var(--gy)}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;width:6000px;height:4000px}
  #links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  #links path.link{stroke:var(--link);stroke-width:2;fill:none;pointer-events:stroke;cursor:pointer}
  #links path.link:hover{stroke:var(--err)}
  #links path.link.sel{stroke:var(--accent)}
  #links path.temp{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-dasharray:6 5;pointer-events:none}
  #arrow path{stroke:var(--link)}
  #arrowTemp path{stroke:var(--accent)}
  .node{position:absolute;width:240px;height:80px;background:var(--node);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35);user-select:none}
  .node.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(74,158,255,.35)}
  .node.engine{border-color:#e0a24a}
  .node.output{border-color:#5fbf7a}
  .node.logic{border-color:#a06fe0}
  .node .hd{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:9px 9px 0 0;background:var(--nodehd);cursor:grab}
  .node .hd b{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .hd .x{background:none;border:none;color:var(--muted);padding:0 3px;cursor:pointer;display:flex;align-items:center}
  .node .hd .x:hover{color:var(--err)}
  .node .hd .okbadge{color:#3ddc84;font-weight:700;font-size:13px;flex:0 0 auto}
  .node .bd{padding:4px 44px;font-size:11px;line-height:1.35;color:var(--muted);min-height:30px;max-height:46px;overflow:hidden}
  .node .bd .k{color:var(--text)}
  .port{position:absolute;top:32px;width:14px;height:14px;border-radius:50%;border:2px solid var(--node);cursor:crosshair}
  .port.in{left:-8px;background:#4a8fe0}
  .port.out{right:-8px;background:#4caf72}
  .port .lbl{position:absolute;top:50%;transform:translateY(-50%);font-size:9px;white-space:nowrap;pointer-events:none}
  .port.in .lbl{left:12px;color:#7fb3ff}
  .port.out .lbl{right:12px;color:#7fd39f}
  aside.right label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
  aside.right input,aside.right select{width:100%;padding:5px 7px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .frow{display:flex;gap:6px;align-items:center}
  .frow select{flex:1;min-width:0}
  .frow .play{flex:0 0 auto;padding:5px 9px;font-size:12px}
  .diag .ok{color:var(--ok)}
  .mini svg{width:100%;height:auto;display:block;background:var(--panel2);border:1px solid var(--line);border-radius:6px}
  .ltable{font-size:11px}
  .ltable table{width:100%;border-collapse:collapse}
  .ltable th,.ltable td{border-bottom:1px solid var(--line);padding:2px 4px;text-align:left;vertical-align:top}
  .ltable th{color:var(--muted);font-weight:600}
  .hint{font-size:11px;color:var(--muted);margin:6px 0}
  footer.foot{display:flex;gap:12px;align-items:center;padding:6px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
  .diag{max-height:76px;overflow:auto;font-size:11px;width:100%}
  .diag .d{color:var(--err)}.diag .w{color:var(--warn)}
  .hidden{display:none}
  .mob{display:none}
  @media (max-width:760px){
    aside{position:fixed;top:0;bottom:0;z-index:30;width:86%;max-width:330px;box-shadow:0 0 30px #000a;transition:transform .18s}
    aside.left{left:0;border-right:1px solid var(--line);transform:translateX(-105%)}
    aside.right{right:0;transform:translateX(105%)}
    body.show-pal aside.left{transform:none}
    body.show-insp aside.right{transform:none}
    .mob{display:inline-block}
  }
</style>
</head>
<body>
<header class="top">
  <button id="b_pal" class="mob" title="Палитра">☰</button>
  <div class="brand">AURA-X <span>КОНСТРУКТОР БЛОКОВ</span></div>
  <div class="status"><i class="dot" id="on"></i><span id="on_txt">Нет связи</span></div>
  <div class="sep"></div>
  <button id="b_new">Новая</button>
  <button id="b_import">Импорт</button>
  <button id="b_export">Экспорт</button>
  <div class="sep"></div>
  <button id="b_snap" class="on">Сетка: вкл</button>
  <button id="b_align">Выровнять</button>
  <button id="b_undo" title="Отменить (Ctrl+Z)">↶</button>
  <button id="b_redo" title="Повторить (Ctrl+Y)">↷</button>
  <button id="b_dup" title="Дублировать (Ctrl+D)">Дубль</button>
  <div class="grow"></div>
  <button id="b_test">▶ Тест</button>
  <button id="b_validate">Проверить</button>
  <button class="primary" id="b_save" disabled>Сохранить</button>
  <button id="b_outputs" disabled>Выходы</button>
  <button id="b_impout" disabled title="Загрузить привязки с устройства">Импорт выходов</button>
  <button class="apply" id="b_apply" disabled>Применить</button>
  <button onclick="window.location.href='/'">Интерфейс декодера</button>
  <button id="b_theme" title="Светлая / тёмная тема">☀</button>
  <button id="b_insp" class="mob" title="Настройки">⚙</button>
  <input type="file" id="f_import" accept=".json,application/json" class="hidden" />
</header>

<main>
  <aside class="left">
    <h2>Готовые блоки</h2>
    <div class="pal" id="palette"></div>
  </aside>

  <section id="stage" class="grid-bg">
    <div id="world">
      <svg id="links" width="6000" height="4000">
        <defs>
          <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M3 2 L9 6 L3 10" fill="none" stroke="#7fa4cf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
          </marker>
          <marker id="arrowTemp" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M3 2 L9 6 L3 10" fill="none" stroke="#4a9eff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
          </marker>
        </defs>
        <g id="linkLayer"></g>
        <path id="tempLink" class="temp hidden" marker-end="url(#arrowTemp)"></path>
      </svg>
      <div id="nodes"></div>
    </div>
  </section>

  <aside class="right">
    <h2>Настройка блока</h2>
    <div id="inspector"><p class="hint">Выберите блок на холсте или добавьте новый слева.</p></div>
    <h2>Проверка</h2>
    <div id="summary" class="hint"></div>
    <h2>Схема связей</h2>
    <div id="mini" class="mini"></div>
    <button id="b_minipng" class="sm" style="width:100%;margin:6px 0">Скачать картинку</button>
    <button id="b_minitxt" class="sm" style="width:100%;margin-bottom:6px">Скачать текст</button>
    <h2>Таблица связей</h2>
    <div id="linktable" class="ltable"></div>
  </aside>
</main>

<footer class="foot">
  <span id="status_txt">Готово</span>
  <span class="grow"></span>
  <span id="counts"></span>
  <div class="diag" id="diag"></div>
</footer>

<script>
(function(){
"use strict";

const LIMITS={states:57,soundStates:31,transitions:128,effects:24,assets:31,jsonBytes:131072};
const STORE_KEY="aura_blocks_project_v1";
const GRID=20;const NODE_W=240;const NODE_H=120;const SPEED_STEP=25;const SPEED_HYST=5;

/* ---- catalogs -------------------------------------------------------- */
const AUX_NAMES=["AUX1","AUX2","AUX3","AUX4","AUX5","AUX6","AUX7"];
const LIGHT_FX=[{v:0,n:"Постоянный"},{v:1,n:"Лампа накаливания"},{v:2,n:"Марс"},{v:3,n:"Ходовые"},{v:4,n:"Маяк"},{v:5,n:"Строб"},{v:6,n:"Топка"}];
const LOGIC_OPS=[{v:1,n:"Mute стоп"},{v:2,n:"Mute ход"},{v:3,n:"Mute свет"},{v:4,n:"Удержание хода"},{v:5,n:"Выбег"},{v:6,n:"Дин. тормоз"},{v:7,n:"Набор позиции"},{v:8,n:"Сброс позиции"}];
const CATALOG=[
  {type:"engine",name:"Двигатель",group:"Основные",kind:"engine",mode:"engine"},
  {type:"horn",name:"Гудок",group:"Сигналы",kind:"sound",mode:"shortLong",roles:["start","loop","end","short"]},
  {type:"whistle",name:"Тифон",group:"Сигналы",kind:"sound",mode:"oneshot",roles:["sound"]},
  {type:"bell",name:"Звонок",group:"Сигналы",kind:"sound",mode:"latched",roles:["sound"]},
  {type:"random",name:"Случайный звук",group:"Сигналы",kind:"sound",mode:"random"},
  {type:"compressor",name:"Компрессор",group:"Механика",kind:"sound",mode:"loopHeld",roles:["sound"]},
  {type:"brake",name:"Тормоз",group:"Механика",kind:"sound",mode:"decel",roles:["sound"]},
  {type:"coupler",name:"Сцепка",group:"Механика",kind:"sound",mode:"oneshot",roles:["sound"]},
  {type:"sander",name:"Песочница",group:"Механика",kind:"sound",mode:"oneshot",roles:["sound"]},
  {type:"pantograph",name:"Токоприёмник",group:"Механика",kind:"sound",mode:"oneshot",roles:["sound"]},
  {type:"doors",name:"Двери",group:"Механика",kind:"sound",mode:"oneshot",roles:["sound"]},
  {type:"speed",name:"Скоростной звук",group:"Механика",kind:"sound",mode:"speed"},
  {type:"custom",name:"Свой сценарий",group:"Дополнительно",kind:"sound",mode:"shortLong",roles:["start","loop","end","short"]},
  {type:"headlight",name:"Фары",group:"Свет и выходы",kind:"output",mode:"headlight"},
  {type:"aux",name:"AUX-выход",group:"Свет и выходы",kind:"output",mode:"aux",fx:true},
  {type:"logic",name:"Логика",group:"Свет и выходы",kind:"logic",mode:"logic"}
];
const BY_TYPE={};CATALOG.forEach(c=>BY_TYPE[c.type]=c);
const GROUP_COLORS={"Основные":"#e0a24a","Сигналы":"#4a9eff","Механика":"#5fbf7a","Свет и выходы":"#e0d24a","Освещение (AUX)":"#e08a4a","Дополнительно":"#a06fe0"};
const LEGACY_FX={fx_incandescent:1,fx_mars:2,fx_ditch:3,fx_beacon:4,fx_strobe:5,fx_firebox:6};
function normalizeProject(p){
  if(!p||!Array.isArray(p.blocks))return p;
  for(const b of p.blocks){
    if(b.type==="signal"){b.type="whistle";b.name=b.name||"Тифон";}
    else if(b.type==="lightfx"){b.type="aux";b.name="AUX-выход";}
    else if(LEGACY_FX[b.type]!==undefined){b.effect=LEGACY_FX[b.type];b.type="aux";b.name="AUX-выход";}
    if(!BY_TYPE[b.type]){b.type="aux";b.name=b.name||"AUX-выход";}
    const cat=BY_TYPE[b.type];
    if(cat&&cat.kind==="output"){
      if(b.type!=="headlight"&&b.channel===undefined)b.channel=0;
      if(b.effect===undefined)b.effect=0;
      if(b.level===undefined)b.level=100;
    }
    if(b.trigger===undefined)b.trigger="auto";
    if(b.outEvent===undefined)b.outEvent="finish";
    if(b.outDelay===undefined)b.outDelay=0;
    if(b.type==="speed"){if(!Array.isArray(b.bands))b.bands=[0,SPEED_STEP,SPEED_STEP*2,SPEED_STEP*3].map((from,i,arr)=>({from:from,to:arr[i+1]==null?100:arr[i+1],file:""}));if(b.hyst==null)b.hyst=SPEED_HYST;}
    if(b.type==="random"&&!Array.isArray(b.files.random))b.files.random=["","","",""];
    if(b.type==="engine"){if(b.files&&Array.isArray(b.files.run)){b.run=b.files.run.map((f,i)=>({from:i*SPEED_STEP,to:(i+1)*SPEED_STEP,file:f||""}));delete b.files.run;}if(!Array.isArray(b.run))b.run=[0,25,50,75].map((f,i,a)=>({from:f,to:a[i+1]==null?100:a[i+1],file:""}));if(b.hyst==null)b.hyst=SPEED_HYST;}
  }
  if(!p.editor)p.editor={viewport:{x:40,y:40,zoom:1},snap:true,bindTuples:[]};
  return p;
}
const ROLE_NAMES={start:"Начало",loop:"Тело (цикл)",end:"Конец",short:"Короткий",sound:"Звук"};
const TRIGGER_NAMES={auto:"Авто (по связи/F)",fn:"F-клавиша",engine:"При двигателе",speed:"По скорости",dir:"По направлению"};
const MODE_NAMES={engine:"Двигатель",shortLong:"Короткий/длинный",oneshot:"Один раз",latched:"Переключатель",loopHeld:"Цикл пока активно",decel:"По замедлению",speed:"По скорости",random:"Случайный выбор",headlight:"Фары",aux:"Выход",logic:"Логика"};
const DIRS=[{v:"auto",n:"Авто (вперёд/назад)"},{v:"fwd",n:"Только вперёд"},{v:"rev",n:"Только назад"},{v:"any",n:"Без направления"}];
const TRASH='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>';

/* ---- state ----------------------------------------------------------- */
let project=null;
let selected="";
let dragging=null,panning=null,linking=null;
let online=false,busy=false,revision=0,savedId="";
let tracks=[],soundFiles=[],diagnostics=[],assets={};
let history=[],hIndex=-1,lastSig=null;
let readyIds=new Set(),selectedLink="",deviceBinds=[],deviceAux=[];

const $=id=>document.getElementById(id);
const clone=v=>JSON.parse(JSON.stringify(v));
const nid=(p,ids)=>{let i=1;while(ids.includes(p+i))i++;return p+i;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hexA=(hex,a)=>{const h=hex.replace("#","");const n=parseInt(h.length===3?h.split("").map(x=>x+x).join(""):h,16);return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";};
const pctSpeed=p=>Math.max(0,Math.min(255,Math.round((Number(p)||0)*255/100)));
const snap=v=>project.editor.snap?Math.round(v/GRID)*GRID:Math.round(v);

function newProject(){
  const p={format:"sound-blocks",schemaVersion:1,id:"blocks_graph",name:"Новая схема тепловоза",
    blocks:[],links:[],editor:{viewport:{x:40,y:40,zoom:1},snap:true,bindTuples:[]}};
  addBlockTo(p,"engine");
  return p;
}
function nextFn(p){const used=new Set(p.blocks.map(b=>b.fn));let f=0;while(used.has(f)&&f<28)f++;return f;}
function addBlockTo(p,type){
  const cat=BY_TYPE[type];if(!cat)return null;
  if(type==="engine"&&p.blocks.some(b=>b.type==="engine"))return null;
  const id=nid(type==="engine"?"engine_":"b",p.blocks.map(b=>b.id));
  const b={id,type,name:cat.name,fn:type==="engine"?8:nextFn(p),trigger:"auto",volume:80,rate:1000,level:100,files:{}};
  if(cat.kind==="output"){b.channel=0;b.effect=cat.effect||0;b.dir=type==="headlight"?"auto":"any";}
  if(cat.kind==="logic")b.logic=1;
  (cat.roles||[]).forEach(r=>b.files[r]="");
  if(type==="engine"){b.files={start:"",idle:"",stop:""};b.run=[0,25,50,75].map((f,i,a)=>({from:f,to:a[i+1]==null?100:a[i+1],file:""}));b.hyst=SPEED_HYST;}
  if(type==="speed"){b.hyst=SPEED_HYST;b.bands=[0,SPEED_STEP,SPEED_STEP*2,SPEED_STEP*3].map((from,i,arr)=>({from:from,to:arr[i+1]==null?100:arr[i+1],file:""}));}
  if(type==="random")b.files.random=["","","",""];
  const n=p.blocks.length;
  b.x=snapTo(p,40+(n%3)*260);b.y=snapTo(p,40+Math.floor(n/3)*140);
  p.blocks.push(b);return b;
}
function snapTo(p,v){return p.editor.snap?Math.round(v/GRID)*GRID:Math.round(v);}

/* ---- compile sound blocks -> device sound-graph (schema v1) ---------- */
function compile(){
  const states=[],transitions=[],effects=[];const files=new Set();const speedHysts=[];let tid=0;
  const audible={},terminal={},startCondOf={},usedPrio={};let waitN=0;
  const prioFor=src=>{usedPrio[src]=usedPrio[src]||new Set();let p=60;while(usedPrio[src].has(p))p--;usedPrio[src].add(p);return p;};
  const addState=(id,name,file,loop,volume=80,rate=1000)=>{if(states.some(s=>s.id===id))return;states.push({id,name,file:file||"",loop:!!loop,volume,rate});if(file)files.add(file);};
  const silent=(id,name)=>addState(id,name,"",false,100,1000);
  const addEdge=(source,target,condition,priority=10,timing="immediate")=>{transitions.push({id:"t"+(++tid),source,target,priority,timing,condition});};
  const engine=project.blocks.find(b=>b.type==="engine");
  const engineEntry=engine?engine.id+"_off":"engine_off";
  silent(engineEntry,"Выкл / тихий вход");
  const linkedFromEngine=id=>project.links.some(l=>l.to===id&&(project.blocks.find(b=>b.id===l.from)||{}).type==="engine");
  const triggerOf=b=>b.trigger==="auto"?(linkedFromEngine(b.id)?"engine":"fn"):b.trigger;

  for(const b of project.blocks){
    const kind=BY_TYPE[b.type].kind;
    if(kind==="output"||kind==="logic")continue;
    const fn=b.fn,vol=b.volume,rate=b.rate||1000;
    if(b.type==="engine"){
      const has=f=>!!f;
      const start=b.files.start,idle=b.files.idle,stop=b.files.stop||"";
      const runs=(Array.isArray(b.run)?b.run:[]).filter(x=>x&&x.file);
      speedHysts.push(b.hyst==null?SPEED_HYST:b.hyst);
      if(has(start))addState(b.id+"_start","Запуск двигателя",start,false,vol,rate);
      addState(b.id+"_idle","Холостой ход",idle,true,vol,rate);
      runs.forEach((x,i)=>addState(b.id+"_run"+i,"Движение "+(i+1),x.file,true,vol,rate));
      if(has(stop))addState(b.id+"_stop","Останов двигателя",stop,false,vol,rate);
      const first=has(start)?b.id+"_start":b.id+"_idle";
      addEdge(b.id+"_off",first,{type:"engine_on"},10);
      if(has(start))addEdge(b.id+"_start",b.id+"_idle",{type:"sample_done"},10);
      const stopTarget=has(stop)?b.id+"_stop":b.id+"_off";
      addEdge(b.id+"_idle",stopTarget,{type:"engine_off"},255);
      if(has(start))addEdge(b.id+"_start",stopTarget,{type:"engine_off"},255);
      if(has(stop))addEdge(b.id+"_stop",b.id+"_off",{type:"sample_done"},10);
      const band=i=>[pctSpeed(runs[i].from),pctSpeed(runs[i].to)];
      runs.forEach((x,i)=>{const [lo,hi]=band(i);
        addEdge(b.id+"_idle",b.id+"_run"+i,{type:"speed",min:lo,max:hi},i+1,"after_sample");
        addEdge(b.id+"_run"+i,b.id+"_idle",{type:"speed",min:0,max:0},0,"after_sample");
        addEdge(b.id+"_run"+i,stopTarget,{type:"engine_off"},255);
        runs.forEach((y,j)=>{if(j!==i)addEdge(b.id+"_run"+i,b.id+"_run"+j,{type:"speed",min:band(j)[0],max:band(j)[1]},j+1,"after_sample");});
      });
      audible[b.id]=has(start)?b.id+"_start":(runs.length?b.id+"_run0":b.id+"_idle");
      terminal[b.id]=has(stop)?b.id+"_stop":null;
      startCondOf[b.id]={type:"engine_on"};
      continue;
    }
    const entry=b.id+"_off";silent(entry,b.name+" / тихий вход");
    effects.push({id:b.id,entry,fn});
    const mode0=BY_TYPE[b.type].mode;
    if(mode0==="speed"){
      speedHysts.push(b.hyst==null?SPEED_HYST:b.hyst);
      const bands=(Array.isArray(b.bands)?b.bands:[]).filter(x=>x&&x.file),items=[];
      bands.forEach(x=>{const s=b.id+"_sp"+items.length;addState(s,b.name+" "+Math.round(x.from||0)+"-"+Math.round(x.to==null?100:x.to)+"%",x.file,true,vol,rate);items.push({state:s,lo:pctSpeed(x.from),hi:pctSpeed(x.to==null?100:x.to)});});
      items.forEach((it,i)=>addEdge(entry,it.state,{type:"speed",min:it.lo,max:it.hi},i+1,"after_sample"));
      items.forEach((it,i)=>items.forEach((jt,j)=>{if(i!==j)addEdge(it.state,jt.state,{type:"speed",min:jt.lo,max:jt.hi},j+1,"after_sample");}));
      items.forEach(it=>addEdge(it.state,entry,{type:"engine_off"},255));
      continue;
    }
    if(mode0==="decel"){
      if(b.files.sound){addState(b.id+"_play",b.name,b.files.sound,false,vol,rate);addEdge(entry,b.id+"_play",{type:"decel",min:1,max:255},10,"after_sample");addEdge(b.id+"_play",entry,{type:"sample_done"},10);audible[b.id]=b.id+"_play";terminal[b.id]=b.id+"_play";}
      continue;
    }
    if(mode0==="random"){
      const files=(Array.isArray(b.files.random)?b.files.random:[]).filter(Boolean);
      if(files.length){
        const ready=b.id+"_ready";addState(ready,b.name+" / выбор","",false,100,1000);
        addEdge(entry,ready,{type:"fn_press",fn},10);
        files.forEach((f,i)=>{const s=b.id+"_r"+i;addState(s,b.name+" "+(i+1),f,false,vol,rate);addEdge(ready,s,{type:"random",min:100},10);addEdge(s,entry,{type:"sample_done"},10);});
      }
      continue;
    }
    const trig=triggerOf(b);
    let startCond,stopCond=null,speedRange=null;
    if(trig==="engine"){startCond={type:"engine_on"};stopCond={type:"engine_off"};}
    else if(trig==="speed"){speedRange={min:pctSpeed(b.speedMin==null?0:b.speedMin),max:pctSpeed(b.speedMax==null?100:b.speedMax)};startCond={type:"speed",min:speedRange.min,max:speedRange.max};speedHysts.push(b.hyst==null?SPEED_HYST:b.hyst);}
    else if(trig==="dir"){const fwd=b.dirTrigger!=="rev";startCond={type:fwd?"dir_fwd":"dir_rev"};stopCond={type:fwd?"dir_rev":"dir_fwd"};}
    else{startCond={type:"fn_press",fn};stopCond={type:"fn_release",fn};}
    const mode=(trig==="speed"||trig==="dir")?"loopHeld":mode0;
    startCondOf[b.id]=startCond;
    if(mode==="oneshot"){
      if(b.files.sound){addState(b.id+"_play",b.name,b.files.sound,false,vol,rate);addEdge(entry,b.id+"_play",startCond,10);addEdge(b.id+"_play",entry,{type:"sample_done"},10);audible[b.id]=b.id+"_play";terminal[b.id]=b.id+"_play";}
    }else if(mode==="shortLong"){
      if(b.files.short){addState(b.id+"_short",b.name+" (короткий)",b.files.short,false,vol,rate);addEdge(entry,b.id+"_short",startCond,1);addEdge(b.id+"_short",entry,{type:"sample_done"},1);}
      const first=b.files.start?b.id+"_start":b.files.loop?b.id+"_loop":b.files.end?b.id+"_end":"";
      if(b.files.start)addState(b.id+"_start",b.name+" начало",b.files.start,false,vol,rate);
      if(b.files.loop)addState(b.id+"_loop",b.name+" цикл",b.files.loop,true,vol,rate);
      if(b.files.end)addState(b.id+"_end",b.name+" конец",b.files.end,false,vol,rate);
      if(first)addEdge(entry,first,startCond,10);
      if(b.files.start&&b.files.loop)addEdge(b.id+"_start",b.id+"_loop",{type:"sample_done"},10);
      if(b.files.end){addEdge(first||entry,b.id+"_end",stopCond,5);addEdge(b.id+"_end",entry,{type:"sample_done"},10);}
      else if(b.files.loop)addEdge(b.id+"_loop",entry,stopCond,5);
      else if(b.files.start)addEdge(b.id+"_start",entry,{type:"sample_done"},10);
      audible[b.id]=first;terminal[b.id]=b.files.end?b.id+"_end":((!b.files.loop&&b.files.start)?b.id+"_start":null);
    }else if(mode==="loopHeld"){
      if(b.files.sound){addState(b.id+"_loop",b.name,b.files.sound,true,vol,rate);
        addEdge(entry,b.id+"_loop",startCond,10,trig==="speed"?"after_sample":"immediate");
        if(trig==="speed"){
          if(speedRange.min>0)addEdge(b.id+"_loop",entry,{type:"speed",min:0,max:speedRange.min-1},5,"after_sample");
          if(speedRange.max<255)addEdge(b.id+"_loop",entry,{type:"speed",min:speedRange.max+1,max:255},6,"after_sample");
          addEdge(b.id+"_loop",entry,{type:"engine_off"},255);
        }else addEdge(b.id+"_loop",entry,stopCond,10);
      }
    }else if(mode==="latched"){
      if(b.files.sound){addState(b.id+"_play",b.name,b.files.sound,true,vol,rate);addEdge(entry,b.id+"_play",trig==="engine"?{type:"engine_on"}:{type:"fn_on",fn},10);addEdge(b.id+"_play",entry,trig==="engine"?{type:"engine_off"}:{type:"fn_off",fn},10);}
    }
  }
  for(const l of project.links){
    if(l.kind!=="after")continue;
    const from=project.blocks.find(x=>x.id===l.from),to=project.blocks.find(x=>x.id===l.to);
    if(!from||!to)continue;
    if(BY_TYPE[from.type].kind!=="sound"||BY_TYPE[to.type].kind!=="sound")continue;
    const a=audible[to.id];if(!a)continue;
    const ev=from.outEvent==="start"?"start":"finish";
    const delay=Math.max(0,from.outDelay|0);
    const cond=ev==="start"?startCondOf[from.id]:{type:"sample_done"};
    const srcState=ev==="start"?(to.id+"_off"):terminal[from.id];
    if(!srcState||!cond)continue;
    const prio=prioFor(srcState);
    if(delay>0){const w=from.id+"_w"+(++waitN);silent(w,from.name+" / задержка");addEdge(srcState,w,cond,prio);addEdge(w,a,{type:"timeout",min:Math.max(1,Math.min(255,Math.round(delay/50)))},prio);}
    else addEdge(srcState,a,cond,prio);
  }
  const positions={};project.blocks.forEach(b=>positions[b.id]={x:b.x,y:b.y});
  const hystUnits=speedHysts.length?Math.max.apply(null,speedHysts.map(p=>pctSpeed(p))):(engine?3:0);
  const payload={format:"sound-graph",schemaVersion:1,id:project.id,name:project.name,
    engine:{entry:engineEntry,fn:engine?engine.fn:8},hysteresis:hystUnits,
    effectTables:[],sources:[],blocks:[],sinks:[],wires:[],
    states,transitions,effects,assets:Object.keys(assets).map(f=>assets[f]),
    editor:{positions,viewport:project.editor.viewport}};
  return {payload,files:[...files]};
}

/* ---- compile outputs/logic -> func_binding_t ------------------------- */
function outputBlocks(){return project.blocks.filter(b=>BY_TYPE[b.type].kind==="output"||BY_TYPE[b.type].kind==="logic");}
function sourceFnOf(id){for(const l of project.links){if(l.to===id){const s=project.blocks.find(b=>b.id===l.from);if(s)return s.fn;}}return null;}
function desiredBindings(){
  const out=[];const mk=(fn,type,id,dir,state)=>({fn,type,id,dir:dir|0,state:state|0});
  for(const b of outputBlocks()){
    const kind=BY_TYPE[b.type].kind,fn=sourceFnOf(b.id)!=null?sourceFnOf(b.id):b.fn;
    if(kind==="logic"){out.push(mk(fn,4,b.logic,0,0));continue;}
    if(b.type==="headlight"){
      if(b.dir==="auto"){out.push(mk(fn,1,0,1,0));out.push(mk(fn,1,1,2,0));}
      else if(b.dir==="rev")out.push(mk(fn,1,1,2,0));
      else if(b.dir==="fwd")out.push(mk(fn,1,0,1,0));
      else out.push(mk(fn,1,0,0,0));
    }else out.push(mk(fn,1,2+(b.channel|0),b.dir==="rev"?2:0,0));
  }
  return out;
}
function auxConfigs(){return outputBlocks().filter(b=>BY_TYPE[b.type].kind==="output"&&b.type!=="headlight").map(b=>({ch:b.channel|0,level:b.level|0,effect:b.effect|0}));}
const bindKey=b=>b.fn+":"+b.type+":"+b.id+":"+(b.dir|0)+":"+(b.state|0);

/* ---- client validation ---------------------------------------------- */
function validate(){
  const {payload,files}=compile();const out=[];
  const err=(id,message)=>out.push({id,message,severity:"error"});
  const warn=(id,message)=>out.push({id,message,severity:"warning"});
  if(payload.states.length>LIMITS.states)err("","Состояний "+payload.states.length+" > "+LIMITS.states+". Упростите схему.");
  if(payload.states.filter(s=>s.file).length>LIMITS.soundStates)err("","Звуковых состояний > "+LIMITS.soundStates+".");
  if(payload.transitions.length>LIMITS.transitions)err("","Переходов "+payload.transitions.length+" > "+LIMITS.transitions+".");
  if(payload.effects.length>LIMITS.effects)err("","Эффектов > "+LIMITS.effects+".");
  const silent=new Set(payload.states.filter(s=>!s.file).map(s=>s.id));
  if(!silent.has(payload.engine.entry))err("","Вход двигателя должен быть тихим.");
  payload.effects.forEach(e=>{if(!silent.has(e.entry))err(e.id,"Вход эффекта должен быть тихим.");});
  const used={};payload.transitions.forEach(e=>{const k=e.source+":"+e.priority;
    if(used[k]){if(!(e.condition&&e.condition.type==="random"&&used[k].condition&&used[k].condition.type==="random"))err(e.id,"Дублирующийся приоритет у источника "+e.source+".");}
    else used[k]=e;});
  const ids=new Set(payload.states.map(s=>s.id));
  payload.transitions.forEach(e=>{if(!ids.has(e.source))err(e.id,"Нет состояния "+e.source);if(!ids.has(e.target))err(e.id,"Нет состояния "+e.target);});
  files.forEach(f=>{if(!assets[f])warn("","Нет WAV на устройстве: "+f+" (проверьте перед применением).");});
  for(const b of outputBlocks()){
    if(BY_TYPE[b.type].kind==="output"&&b.type!=="headlight"&&(b.channel|0)>6)err(b.id,"Недопустимый AUX-канал.");
    if(sourceFnOf(b.id)==null&&!(b.fn>=0&&b.fn<=28))err(b.id,"Задайте F-клавишу или связь с блоком.");
  }
  const fnUse={};const addUse=(f,who)=>{if(f==null||f<0||f>28)return;(fnUse[f]=fnUse[f]||[]).push(who);};
  const linkedFromEngine=id=>project.links.some(l=>l.to===id&&(project.blocks.find(x=>x.id===l.from)||{}).type==="engine");
  const trigOf=b=>b.trigger==="auto"?(linkedFromEngine(b.id)?"engine":"fn"):b.trigger;
  project.blocks.forEach(b=>{const c=BY_TYPE[b.type];
    if(c.kind==="engine"){addUse(b.fn,"Двигатель");return;}
    if(c.kind==="sound"){if(c.mode==="speed"||c.mode==="decel")return;if(trigOf(b)==="fn")addUse(b.fn,"«"+b.name+"»");return;}
    const src=sourceFnOf(b.id);addUse(src!=null?src:b.fn,"«"+b.name+"»");});
  Object.keys(fnUse).forEach(f=>{if(fnUse[f].length>1)warn("","F"+f+" используется несколькими блоками: "+fnUse[f].join(", ")+".");});
  return {payload,files,diagnostics:out};
}

/* ---- API ------------------------------------------------------------- */
async function req(path,init){
  const r=await fetch(path,Object.assign({cache:"no-store"},init||{}));
  let data;try{data=JSON.parse(await r.text());}catch(e){throw new Error("Устройство вернуло не-JSON ("+r.status+")");}
  if(!r.ok||data.ok!==true)throw new Error(data.error||("Ошибка "+r.status));
  return data;
}
const qs=o=>Object.keys(o).map(k=>encodeURIComponent(k)+"="+encodeURIComponent(o[k])).join("&");
async function refreshStatus(){
  try{const s=await req("/api/sound/graph/state");online=true;revision=Number(s.revision)||0;}catch(e){online=false;}
  $("on").classList.toggle("on",online);$("on_txt").textContent=online?"Подключено":"Нет связи";
  try{const t=await req("/api/audio/tracks");tracks=(t.tracks||[]).map(x=>String(x.file||"").replace(/^audio\//,"")).filter(f=>/^[A-Za-z0-9_-]+\.wav$/.test(f));}catch(e){tracks=[];}
  try{const sf=await req("/api/sound-files");soundFiles=(sf.files||[]).filter(f=>/\.wav$/i.test(f));}catch(e){soundFiles=[];}
  try{const rb=await req("/api/func-map?view=bind");deviceBinds=rb.binds||[];}catch(e){deviceBinds=[];}
  try{const ax=await req("/api/aux/cfg");deviceAux=ax.aux||[];}catch(e){deviceAux=[];}
  refreshButtons();
}
async function fetchAssets(files){for(const f of files){if(assets[f])continue;try{const a=await req("/api/sound/graph/asset?file="+encodeURIComponent(f));assets[f]=a.asset;}catch(e){}}}
async function doValidate(){
  if(busy)return;busy=true;refreshButtons();setStatus("Проверка...");
  try{const v=validate();await fetchAssets(v.files);const v2=validate();diagnostics=v2.diagnostics;
    if(online){try{const r=await req("/api/sound/graph/validate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v.payload)});if(r.diagnostics)r.diagnostics.forEach(d=>diagnostics.push(d));}catch(e){diagnostics.push({id:"",message:e.message,severity:"error"});}}
    renderSummary();renderDiag();setStatus(diagnostics.some(d=>d.severity!=="warning")?"Есть ошибки":"Проверка пройдена");
  }catch(e){setStatus("Ошибка: "+e.message);}finally{busy=false;refreshButtons();}
}
async function doSave(){
  if(busy)return;busy=true;refreshButtons();setStatus("Сохранение...");
  try{const v=validate();if(v.diagnostics.some(d=>d.severity!=="warning")){diagnostics=v.diagnostics;renderDiag();throw new Error("Исправьте ошибки перед сохранением");}
    await fetchAssets(v.files);v.payload.assets=Object.keys(assets).map(f=>assets[f]);
    const r=await req("/api/sound/graph/save?"+qs({id:project.id,expectedRevision:project.id===savedId?revision:0}),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v.payload)});
    revision=Number(r.revision)||revision;savedId=project.id;setStatus("Сохранена версия "+revision);await refreshStatus();
  }catch(e){setStatus("Не сохранено: "+e.message);}finally{busy=false;refreshButtons();}
}
async function doApply(){
  if(busy||!revision)return;busy=true;refreshButtons();setStatus("Применение...");
  try{await req("/api/sound/graph/apply?"+qs({id:project.id,revision}),{method:"POST"});
    await applyOutputs();setStatus("Применена версия "+revision+", выходы записаны");
  }catch(e){setStatus("Не применено: "+e.message);}finally{busy=false;refreshButtons();}
}
async function applyOutputs(){
  const desired=desiredBindings();
  const list=async()=>(await req("/api/func-map?view=bind")).binds||[];
  const existing=await list();
  const have=new Set(existing.map(x=>bindKey({fn:x.fn,type:x.type,id:x.id,dir:x.dir||0,state:x.state||0})));
  const desiredKeys=new Set(desired.map(bindKey));
  for(const b of desired){if(!have.has(bindKey(b)))await req("/api/func-map?bind=1&"+qs(b),{method:"POST"});}
  const tracked=project.editor.bindTuples||[];
  for(const k of tracked){
    if(desiredKeys.has(k))continue;
    const now=await list();
    const idx=now.findIndex(x=>bindKey({fn:x.fn,type:x.type,id:x.id,dir:x.dir||0,state:x.state||0})===k);
    if(idx>=0)await req("/api/func-map?bind=1&remove=1&idx="+idx,{method:"POST"});
  }
  for(const c of auxConfigs()){try{await req("/api/aux/cfg?"+qs({ch:c.ch,level:c.level,effect:c.effect}),{method:"POST"});}catch(e){}}
  project.editor.bindTuples=desired.map(bindKey);saveDraft();
}

/* ---- persistence ----------------------------------------------------- */
function saveDraft(){try{localStorage.setItem(STORE_KEY,JSON.stringify({project,revision,savedId}));}catch(e){}historyPush();}
const projectSig=()=>JSON.stringify({b:project.blocks,l:project.links,id:project.id,name:project.name});
function historyReset(){history=[];hIndex=-1;lastSig=null;historyPush();}
function historyPush(){const sig=projectSig();if(sig===lastSig)return;history=history.slice(0,hIndex+1);history.push(JSON.stringify(project));hIndex=history.length-1;lastSig=sig;if(history.length>100){history.shift();hIndex--;}}
function undo(){if(hIndex<=0)return;const v=JSON.parse(JSON.stringify(project.editor.viewport));hIndex--;project=JSON.parse(history[hIndex]);project.editor.viewport=v;lastSig=projectSig();selected="";render();setStatus("Отменено");}
function redo(){if(hIndex>=history.length-1)return;const v=JSON.parse(JSON.stringify(project.editor.viewport));hIndex++;project=JSON.parse(history[hIndex]);project.editor.viewport=v;lastSig=projectSig();selected="";render();setStatus("Повторено");}
function loadDraft(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return;const d=JSON.parse(raw);if(d&&d.project&&d.project.format==="sound-blocks"){project=normalizeProject(d.project);revision=d.revision||0;savedId=d.savedId||"";if(project.editor.snap===undefined)project.editor.snap=true;}}catch(e){}}
const THEME_KEY="aura_theme";
function applyTheme(t){if(t!=="light")t="dark";document.documentElement.setAttribute("data-theme",t);const b=$("b_theme");if(b)b.textContent=t==="light"?"☾":"☀";try{localStorage.setItem(THEME_KEY,t);}catch(e){}}
function toggleTheme(){applyTheme(document.documentElement.getAttribute("data-theme")==="light"?"dark":"light");}

/* ---- rendering ------------------------------------------------------- */
function renderPalette(){
  const groups={};CATALOG.forEach(c=>{(groups[c.group]=groups[c.group]||[]).push(c);});
  const hasEngine=project.blocks.some(b=>b.type==="engine");let html="";
  for(const g in groups){html+='<div class="pal-group"><header>'+esc(g)+"</header>";groups[g].forEach(c=>{
    const dis=c.type==="engine"&&hasEngine,col=GROUP_COLORS[c.group]||"#2b3547";
    html+='<button data-add="'+c.type+'" style="border-left:3px solid '+col+'"'+(dis?" disabled":"")+'><b>'+esc(c.name)+"</b><small>"+esc(MODE_NAMES[c.mode]||"")+(c.fx?" · выбор эффекта":"")+"</small></button>";
  });html+="</div>";}
  $("palette").innerHTML=html;
  $("palette").querySelectorAll("[data-add]").forEach(btn=>btn.onclick=()=>{const b=addBlockTo(project,btn.getAttribute("data-add"));if(b){selected=b.id;render();}});
}
function nodeSummary(b){
  const kind=BY_TYPE[b.type].kind;
  if(b.type==="engine")return "Ступени: <span class='k'>"+((b.run||[]).filter(x=>x.file).length)+"</span> · защита "+(b.hyst==null?SPEED_HYST:b.hyst)+"% · F"+b.fn;
  if(kind==="output"){
    const src=sourceFnOf(b.id);
    if(b.type==="headlight")return "F"+(src!=null?src:b.fn)+" · "+(DIRS.find(d=>d.v===b.dir)||{}).n+" · "+b.level+"%";
    return "F"+(src!=null?src:b.fn)+" · "+(AUX_NAMES[b.channel|0]||"AUX?")+" · "+((LIGHT_FX.find(f=>f.v===b.effect)||{}).n||"")+" · "+b.level+"%";
  }
  if(kind==="logic"){const src=sourceFnOf(b.id);return "F"+(src!=null?src:b.fn)+" · "+((LOGIC_OPS.find(o=>o.v===b.logic)||{}).n||"");}
  const cat=BY_TYPE[b.type],parts=[];
  if(cat.mode==="speed")return "Скорость % · диапазонов "+((b.bands||[]).filter(x=>x.file).length)+" · защита "+(b.hyst==null?SPEED_HYST:b.hyst)+"%";
  if(cat.mode==="decel")return "F"+b.fn+" · по замедлению"+(b.files.sound?" · "+esc(b.files.sound):" · файл не задан");
  if(cat.mode==="random")return "F"+b.fn+" · случайно из "+((b.files.random||[]).filter(Boolean).length)+" звуков";
  (cat.roles||[]).forEach(r=>{if(b.files[r])parts.push(ROLE_NAMES[r]+": "+esc(b.files[r]));});
  return "F"+b.fn+" · "+(parts.length?parts.join("<br>"):"файлы не заданы");
}
function renderNodes(){
  const box=$("nodes");box.innerHTML="";
  for(const b of project.blocks){
    const cat=BY_TYPE[b.type],kind=cat.kind;
    const hasIn=b.type!=="engine",hasOut=kind!=="output";
    const el=document.createElement("div");

function portPos(id,which){
  const el=$("nodes").querySelector('[data-id="'+id+'"]');
  const p=el&&el.querySelector(which==="out"?".port.out":".port.in");
  if(p){const r=p.getBoundingClientRect(),s=$("stage").getBoundingClientRect(),v=project.editor.viewport;
    return {x:(r.left+r.width/2-s.left-v.x)/v.zoom,y:(r.top+r.height/2-s.top-v.y)/v.zoom};}
  const b=project.blocks.find(x=>x.id===id)||{x:0,y:0};
  return which==="out"?{x:b.x+NODE_W,y:b.y+40}:{x:b.x,y:b.y+40};
}
function curve(x1,y1,x2,y2){const dx=Math.max(40,Math.abs(x2-x1)/2);return "M"+x1+" "+y1+" C"+(x1+dx)+" "+y1+" "+(x2-dx)+" "+y2+" "+x2+" "+y2;}
function renderLinks(){

async function playFile(name){
  if(!name){setStatus("Звук не выбран");return;}
  const m=/^slot0*(\d+)\.wav$/i.exec(name);
  if(m){try{await req("/api/audio/play?slot="+Number(m[1]),{method:"POST"});setStatus("Играю "+name+" (устройство)");}catch(e){setStatus("Не играет: "+e.message);}return;}
  try{const a=new Audio("/sound-files/"+encodeURIComponent(name));a.volume=0.8;await a.play();setStatus("Играю "+name+" (тест)");}catch(e){setStatus("Прослушивание доступно в превью (SOUND)");}
}
function blockFiles(b){const roles=BY_TYPE[b.type].roles||[];return roles.map(r=>b.files[r]).filter(Boolean);}
async function testBlock(b){
  if(!b)return;const out=[];const kind=BY_TYPE[b.type].kind;
  if(kind==="sound"){
    if(BY_TYPE[b.type].mode==="speed"){
      const set=(b.bands||[]).filter(x=>x.file);
      if(!set.length)out.push({id:b.id,message:"Не задан ни один диапазон скорости",severity:"error"});
      else out.push({id:b.id,message:"Диапазонов: "+set.length+", защита "+(b.hyst==null?SPEED_HYST:b.hyst)+" %",severity:"ok"});
    }else if(BY_TYPE[b.type].mode==="random"){
      const set=(b.files.random||[]).filter(Boolean);
      if(!set.length)out.push({id:b.id,message:"Не задан ни один звук",severity:"error"});
      else out.push({id:b.id,message:"Случайно из "+set.length+" звуков",severity:"ok"});
    }else{
      const roles=BY_TYPE[b.type].roles||[],set=roles.filter(r=>b.files[r]);
      if(!set.length)out.push({id:b.id,message:"Не задан ни один WAV-файл",severity:"error"});
      else out.push({id:b.id,message:"Файлы: "+set.map(r=>ROLE_NAMES[r]).join(", "),severity:"ok"});
    }
  }else if(b.type==="engine"){
    if(!b.files.idle)out.push({id:b.id,message:"Нет файла холостого хода",severity:"warning"});else out.push({id:b.id,message:"Холостой ход: "+b.files.idle,severity:"ok"});
  }else{
    const fn=sourceFnOf(b.id);if(fn==null&&!(b.fn>=0&&b.fn<=28))out.push({id:b.id,message:"Не задан источник (F-клавиша или связь)",severity:"error"});else out.push({id:b.id,message:"F-клавиша: F"+(fn!=null?fn:b.fn),severity:"ok"});
  }
  validate().diagnostics.filter(d=>d.id===b.id).forEach(d=>out.push(d));
  diagnostics=out;renderDiag();
  const playable=blockFiles(b)[0]||b.files.idle||(b.files.random||[]).filter(Boolean)[0]||((b.bands||[]).find(x=>x.file)||{}).file;if(playable)await playFile(playable);
  const bad=out.filter(x=>x.severity==="error").length;
  setStatus("Тест блока «"+b.name+"»: "+(bad?bad+" ошибок":"в порядке"));
}
async function testScheme(){
  if(busy)return;busy=true;refreshButtons();setStatus("Тест схемы...");
  try{
    const v=validate();await fetchAssets(v.files);const v2=validate();diagnostics=[...v2.diagnostics];
    const lines=[];let ok=0,err=0;
    for(const b of project.blocks){
      const kind=BY_TYPE[b.type].kind;let bad=false;
      if(kind==="sound"){bad=(BY_TYPE[b.type].mode==="speed")?!(b.bands||[]).some(x=>x.file):(BY_TYPE[b.type].mode==="random")?!(b.files.random||[]).some(Boolean):!((BY_TYPE[b.type].roles||[]).some(r=>b.files[r]));}
      else if(b.type==="engine")bad=!b.files.idle;
      else{const fn=sourceFnOf(b.id);bad=(fn==null&&!(b.fn>=0&&b.fn<=28));}
      if(bad){err++;lines.push({id:b.id,message:"Блок «"+b.name+"» не готов",severity:"error"});}else ok++;
    }
    if(online){try{const r=await req("/api/sound/graph/validate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v.payload)});(r.diagnostics||[]).forEach(d=>diagnostics.push(d));}catch(e){diagnostics.push({id:"",message:e.message,severity:"error"});}}
    diagnostics=[...lines,...diagnostics];renderDiag();
    const anyErr=diagnostics.some(d=>d.severity!=="warning");
    setStatus("Тест схемы: "+ok+" блоков готово, "+err+" с ошибками"+(anyErr?", проверьте список":" — можно сохранять"));
  }catch(e){setStatus("Ошибка теста: "+e.message);}finally{busy=false;refreshButtons();}
}

function graphLayers(){
  const nodes=project.blocks,adj={},pred={},indeg={};
  const kindOf=id=>{const b=nodes.find(n=>n.id===id);return b?BY_TYPE[b.type].kind:"";};
  nodes.forEach(n=>{adj[n.id]=[];pred[n.id]=[];indeg[n.id]=0;});
  project.links.forEach(l=>{if(l.from===l.to)return;if(adj[l.from]===undefined||indeg[l.to]===undefined)return;if(kindOf(l.from)==="output")return;adj[l.from].push(l.to);pred[l.to].push(l.from);indeg[l.to]++;});
  const layer={},q=[];
  nodes.forEach(n=>{if(indeg[n.id]===0){layer[n.id]=0;q.push(n.id);}});
  if(!q.length)nodes.forEach((n,i)=>layer[n.id]=i);
  while(q.length){const u=q.shift();adj[u].forEach(v=>{layer[v]=Math.max(layer[v]==null?0:layer[v],layer[u]+1);if(--indeg[v]===0)q.push(v);});}
  nodes.forEach(n=>{if(layer[n.id]==null)layer[n.id]=0;});
  const cols={};nodes.forEach(n=>{(cols[layer[n.id]]=cols[layer[n.id]]||[]).push(n);});
  const order={};Object.keys(cols).forEach(L=>cols[L].forEach((n,i)=>order[n.id]=i));
  for(let pass=0;pass<3;pass++){
    Object.keys(cols).map(Number).sort((a,b)=>a-b).forEach(L=>{
      cols[L].forEach(n=>{const ps=pred[n.id].filter(p=>order[p]!=null);n._b=ps.length?ps.reduce((s,p)=>s+order[p],0)/ps.length:(order[n.id]||0);});
      cols[L].sort((a,b)=>a._b-b._b);cols[L].forEach((n,i)=>order[n.id]=i);
    });
  }
  return {cols,layer};
}
function autoLayout(){
  const {cols}=graphLayers();const COL_W=300,ROW_H=140;
  Object.keys(cols).map(Number).sort((a,b)=>a-b).forEach(L=>{cols[L].forEach((n,i)=>{n.x=snapTo(project,40+L*COL_W);n.y=snapTo(project,40+i*ROW_H);});});

}

}

function blockDetailLines(b){
  const cat=BY_TYPE[b.type],L=[];if(!cat)return L;
  if(cat.kind==="engine"){
    L.push("F"+b.fn+" · запуск: "+(b.files.start||"—")+" · холостой: "+(b.files.idle||"—")+" · стоп: "+(b.files.stop||"—"));
    (b.run||[]).forEach((x,i)=>L.push("ступень "+(i+1)+" "+Math.round(x.from)+"–"+Math.round(x.to)+"%: "+(x.file||"—")));
    L.push("защита "+(b.hyst==null?SPEED_HYST:b.hyst)+"% · выход: "+(b.outEvent==="start"?"напрямую":"после события")+(b.outDelay?", задержка "+b.outDelay+" мс":""));
    return L;
  }
  if(cat.kind==="output"){
    if(b.type==="headlight")L.push("F"+b.fn+" · "+((DIRS.find(d=>d.v===b.dir)||{}).n||"")+" · "+(b.level|0)+"%");
    else L.push("F"+b.fn+" · "+(AUX_NAMES[b.channel|0]||"AUX?")+" · "+((LIGHT_FX.find(f=>f.v===(b.effect|0))||{}).n||"")+" · "+(b.level|0)+"%");
    return L;
  }
  if(cat.kind==="logic"){L.push("F"+b.fn+" · "+((LOGIC_OPS.find(o=>o.v===(b.logic|0))||{}).n||""));return L;}
  if(cat.mode==="speed"){L.push("защита "+(b.hyst==null?SPEED_HYST:b.hyst)+"%");(b.bands||[]).forEach(x=>{if(x.file)L.push(Math.round(x.from)+"–"+Math.round(x.to)+"%: "+x.file);});return L;}
  if(cat.mode==="random"){L.push("F"+b.fn+" · случайно из:");(b.files.random||[]).forEach(f=>{if(f)L.push(f);});return L;}
  (cat.roles||[]).forEach(r=>{if(b.files[r])L.push(ROLE_NAMES[r]+": "+b.files[r]);});
  L.push("запуск: "+((TRIGGER_NAMES[b.trigger]||"авто")));
  if(b.trigger==="speed")L.push("скорость "+(b.speedMin==null?0:b.speedMin)+"–"+(b.speedMax==null?100:b.speedMax)+"% · защита "+(b.hyst==null?SPEED_HYST:b.hyst)+"%");

  return L;
}
function buildSchemeSvg(){
  const {cols}=graphLayers();const layers=Object.keys(cols).map(Number).sort((a,b)=>a-b);
  const CARD_W=340,LH=15,info={};
  layers.forEach(L=>cols[L].forEach(n=>{info[n.id]=blockDetailLines(n);}));
  const cardH=id=>26+(info[id]?info[id].length:0)*LH+8;
  const colX={};let x=20;layers.forEach(L=>{colX[L]=x;x+=CARD_W+90;});
  const totalW=Math.max(x,200);const pos={};
  layers.forEach(L=>{let y=20;const rh=Math.max.apply(null,cols[L].map(n=>cardH(n.id)));cols[L].forEach(n=>{pos[n.id]={x:colX[L],y:y,h:cardH(n.id)};y+=rh+24;});});
  const totalH=Math.max.apply(null,Object.keys(pos).map(id=>pos[id].y+pos[id].h).concat([120]))+20;
  let svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+totalW+'" height="'+totalH+'" viewBox="0 0 '+totalW+' '+totalH+'" font-family="system-ui,Segoe UI,Roboto,sans-serif">';
  svg+='<rect x="0" y="0" width="'+totalW+'" height="'+totalH+'" fill="#0f1420"/>';
  svg+='<defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M3 2 L9 6 L3 10" fill="none" stroke="#7fa4cf" stroke-width="1.7" stroke-linecap="round"/></marker></defs>';
  project.links.forEach(l=>{const a=pos[l.from],b=pos[l.to];if(!a||!b)return;
    const x1=a.x+CARD_W,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,dx=Math.max(40,Math.abs(x2-x1)/2);
    svg+='<path d="M'+x1+' '+y1+' C'+(x1+dx)+' '+y1+' '+(x2-dx)+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="#7fa4cf" stroke-width="1.6" marker-end="url(#arr)"/>';
    svg+='<text x="'+((x1+x2)/2)+'" y="'+((y1+y2)/2-4)+'" fill="#9fb0c8" font-size="10" text-anchor="middle">'+esc(linkCondText(l))+'</text>';});
  layers.forEach(L=>cols[L].forEach(n=>{const p=pos[n.id];const c=GROUP_COLORS[(BY_TYPE[n.type]||{}).group]||"#888";
    svg+='<rect x="'+p.x+'" y="'+p.y+'" width="'+CARD_W+'" height="'+p.h+'" rx="8" fill="#1b2230" stroke="'+c+'"/>';
    svg+='<text x="'+(p.x+10)+'" y="'+(p.y+18)+'" fill="#e7ecf5" font-size="13" font-weight="600">'+esc(n.name)+'</text>';
    (info[n.id]||[]).forEach((line,i)=>{svg+='<text x="'+(p.x+10)+'" y="'+(p.y+35+i*LH)+'" fill="#93a0b5" font-size="11">'+esc(line)+'</text>';});}));
  svg+='</svg>';return svg;
}

  for(const bd of deviceBinds){
    const fn=bd.fn|0,type=bd.type|0,id=bd.id|0;
    if(type===1){
      if(id<2){const dir=id===0?"fwd":"rev";if(project.blocks.some(x=>x.type==="headlight"&&x.fn===fn&&x.dir===dir))continue;const nb=addBlockTo(project,"headlight");if(nb){nb.fn=fn;nb.dir=dir;added++;}}
      else{const ch=id-2;if(project.blocks.some(x=>x.type==="aux"&&x.fn===fn&&(x.channel|0)===ch))continue;const nb=addBlockTo(project,"aux");if(nb){nb.fn=fn;nb.channel=ch;nb.level=(deviceAux[ch]&&deviceAux[ch].level!=null)?deviceAux[ch].level:100;nb.effect=(deviceAux[ch]&&deviceAux[ch].effect!=null)?deviceAux[ch].effect:0;added++;}}
    }else if(type===4){if(project.blocks.some(x=>x.type==="logic"&&x.fn===fn&&(x.logic|0)===id))continue;const nb=addBlockTo(project,"logic");if(nb){nb.fn=fn;nb.logic=id;added++;}}
  }
  render();setStatus(added?("Импортировано выходов: "+added):"Новых выходов нет");
};
$("b_apply").onclick=doApply;

/* ---- boot ------------------------------------------------------------ */
loadDraft();if(!project)project=newProject();(()=>{let t="dark";try{const s=localStorage.getItem(THEME_KEY);if(s==="light"||s==="dark")t=s;}catch(e){}applyTheme(t);})();applyViewport();renderSnapBtn();historyReset();render();refreshStatus();setInterval(refreshStatus,3000);
window.__blocks={buildText:buildText,buildSchemeSvg:buildSchemeSvg,blockDetailLines:blockDetailLines,project:()=>project};
})();
</script>
