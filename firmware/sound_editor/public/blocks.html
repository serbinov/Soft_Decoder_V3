<title>Конструктор звуков</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161b26; --panel2:#1e2533; --line:#2b3547;
    --text:#e7ecf5; --muted:#e7ecf5; --accent:#4a9eff; --ok:#4caf72; --on-accent:#04101f; --ok-ink:#6fe0a0;
    --warn:#e0a24a; --err:#ff8f8f; --node:#1b2230; --nodehd:#242f42;
    --stage:#0c1119; --grid:#1a2230; --link:#6f8bb0;
  }
  html[data-theme=light]{
    --bg:#eef1f7; --panel:#ffffff; --panel2:#f4f6fb; --line:#d3dae8;
    --text:#0b0f16; --muted:#0b0f16; --accent:#2f6fd0; --ok:#1f9d63; --on-accent:#ffffff; --ok-ink:#127a45;
    --warn:#8a5a00; --err:#b3261e; --node:#ffffff; --nodehd:#eef2f9;
    --stage:#f7f9fd; --grid:#dde3ee; --link:#8a99b5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  body{display:flex;flex-direction:column;overflow:hidden}
  header.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  .hd-left{display:flex;align-items:center;gap:8px;justify-self:start;min-width:0}
  .hd-mid{display:flex;align-items:center;gap:8px;justify-self:center;flex-wrap:wrap}
  .hd-right{display:flex;align-items:center;gap:8px;justify-self:end}
  .brand{font-weight:600}
  .brand span{color:var(--accent);font-weight:400}
  .grow{flex:1}
  .status{font-size:12px;color:var(--muted)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--err);margin-right:5px;vertical-align:middle}
  .dot.on{background:var(--ok)}
  button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  button.apply{background:var(--ok);border-color:var(--ok);color:#04170c;font-weight:600}
  button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.sm{padding:3px 7px;font-size:12px}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
  .tm{position:relative}
  .tm>.tm-btn::after{content:"▾";margin-left:6px;font-size:10px;opacity:.7}
  .tm-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:208px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;z-index:60;box-shadow:0 12px 32px rgba(0,0,0,.4)}
  .tm.open>.tm-panel{display:block}
  .tm-panel button{display:block;width:100%;text-align:left;margin:3px 0;background:transparent;border-color:transparent}
  .tm-panel button:hover{background:var(--panel2);border-color:var(--line)}
  .tm-panel button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  main{flex:1;display:flex;min-height:0}
  aside{background:var(--panel);border-right:1px solid var(--line);width:230px;overflow:auto;padding:10px}
  aside.right{border-right:none;border-left:1px solid var(--line);width:290px}
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 6px}
  aside h2:first-child{margin-top:0}
  .pal-group{margin-bottom:10px}
  .pal-group>header{font-size:11px;color:var(--muted);margin-bottom:4px}
  .pal button{display:block;width:100%;text-align:left;margin-bottom:5px}
  .pal button b{display:block;font-weight:600}
  .pal button small{color:var(--muted)}
  #stage{position:relative;flex:1;overflow:hidden;background:var(--stage);--gstep:20px;--gx:0px;--gy:0px}
  #stage.grid-bg{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:var(--gstep) var(--gstep);background-position:var(--gx) var(--gy)}
  #marquee{position:absolute;border:1px solid var(--accent);background:rgba(74,158,255,.15);pointer-events:none;z-index:6;display:none}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;width:6000px;height:4000px}
  #texts{pointer-events:none}
  .textnode{pointer-events:auto;position:absolute;min-width:24px;min-height:1.3em;max-width:640px;padding:3px 7px;border:1px dashed transparent;border-radius:6px;color:var(--text);font:16px/1.3 system-ui,Segoe UI,Roboto,sans-serif;white-space:pre-wrap;word-break:break-word;cursor:move;user-select:none}
  .textnode:hover{border-color:var(--line)}
  .textnode.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(74,158,255,.35);background:rgba(74,158,255,.06)}
  .textnode.editing{cursor:text;user-select:text;border-color:var(--accent);background:var(--panel2);outline:none}
  button.tbtn{font-weight:700;font-family:Georgia,'Times New Roman',serif;min-width:34px;line-height:1}
  #links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  #links path.link{stroke:var(--link);stroke-width:2;fill:none;pointer-events:none}
  #links path.link.sel{stroke:var(--accent);stroke-width:2.6}
  /* Invisible fat stroke on top of each link gives it a comfortable click area;
     vector-effect keeps that area the same on screen at any zoom. */
  #links path.link-hit{stroke:transparent;stroke-width:16;fill:none;pointer-events:stroke;cursor:pointer;vector-effect:non-scaling-stroke}
  #links path.link-hit:hover+path.link{stroke:var(--err)}
  #links path.temp{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-dasharray:6 5;pointer-events:none}
  #arrow path{stroke:var(--link)}
  #arrowTemp path{stroke:var(--accent)}
  .node{position:absolute;width:240px;height:80px;background:var(--node);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35);user-select:none}
  .node.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(74,158,255,.35)}
  .node.engine{border-color:#f97316}
  .node.output{border-color:#22c55e}
  .node.logic{border-color:#a855f7}
  .node .hd{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:9px 9px 0 0;background:var(--nodehd);cursor:grab}
  .node .hd b{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .hd .x{background:none;border:none;color:var(--muted);padding:0 3px;cursor:pointer;display:flex;align-items:center}
  .node .hd .x:hover{color:var(--err)}
  .node .hd .okbadge{color:var(--ok-ink);font-weight:700;font-size:13px;flex:0 0 auto}
  .node .hd .chain{background:none;border:none;color:var(--muted);padding:0 3px;cursor:pointer;display:flex;align-items:center;font-size:11px}
  .node .hd .chain:hover{color:var(--ok-ink)}
  .node .bd{padding:4px 44px;font-size:11px;line-height:1.35;color:var(--muted);min-height:30px;max-height:46px;overflow:hidden}
  .node .bd .k{color:var(--text)}
  .port{position:absolute;top:32px;width:14px;height:14px;border-radius:50%;border:2px solid var(--node);cursor:crosshair}
  .port.in{left:-8px;background:var(--accent)}
  .port.out{right:-8px;background:var(--ok)}
  .port .lbl{position:absolute;top:50%;transform:translateY(-50%);font-size:9px;white-space:nowrap;pointer-events:none;color:var(--text)}
  aside.right label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
  aside.right input,aside.right select{width:100%;padding:5px 7px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .frow{display:flex;gap:6px;align-items:center}
  .frow select{flex:1;min-width:0}
  .frow .play{flex:0 0 auto;padding:5px 9px;font-size:12px}
  .diag .ok{color:var(--ok-ink)}
  .hint{font-size:11px;color:var(--muted);margin:6px 0}
  footer.foot{display:flex;gap:12px;align-items:center;padding:6px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
  .diag{max-height:76px;overflow:auto;font-size:11px;width:100%}
  .diag .d{color:var(--err)}.diag .w{color:var(--warn)}
  .hidden{display:none}
  .mob{display:none}
  @media (max-width:760px){
    aside{position:fixed;top:0;bottom:0;z-index:30;width:86%;max-width:330px;box-shadow:0 0 30px #000a;transition:transform .18s}
    aside.left{left:0;border-right:1px solid var(--line);transform:translateX(-105%)}
    aside.right{right:0;transform:translateX(105%)}
    body.show-pal aside.left{transform:none}
    body.show-insp aside.right{transform:none}
    .mob{display:inline-block}
    .brand span{display:none}
    header.top{display:flex;flex-wrap:wrap}
    .hd-left{flex:1 1 auto}
    .hd-right{order:1}
    .hd-mid{order:2;flex:1 1 100%;justify-content:flex-start}
  }
</style>
</head>
<body>
<header class="top">
  <div class="hd-left">
    <button id="b_pal" class="mob" title="Палитра" data-i18n-title="palette">☰</button>
    <div class="brand">AURA-X <span data-i18n="brand_sub">КОНСТРУКТОР ЗВУКОВ</span></div>
    <div class="status"><i class="dot" id="on"></i><span id="on_txt" data-i18n="offline">Нет связи</span></div>
  </div>
  <div class="hd-mid">
  <div class="tm" data-menu>
    <button type="button" class="tm-btn" data-i18n="m_file">Файл</button>
    <div class="tm-panel">
      <button id="b_new" data-i18n="new">Новый</button>
      <button id="b_import" data-i18n="import">Импорт</button>
      <button id="b_export" data-i18n="export">Экспорт</button>
      <button id="b_file_png" data-i18n="download_png">Скачать картинку</button>
      <button id="b_file_txt" data-i18n="download_txt">Скачать текст</button>
    </div>
  </div>
  <button id="b_text" class="tbtn" title="Добавить текст" data-i18n-title="text_tip" aria-label="Добавить текст" data-i18n-aria="text_tip">T</button>
  <button id="b_undo" class="tbtn" title="Отменить (Ctrl+Z)" data-i18n-title="undo_tip" aria-label="Отменить" data-i18n-aria="undo_tip">↶</button>
  <button id="b_redo" class="tbtn" title="Повторить (Ctrl+Y)" data-i18n-title="redo_tip" aria-label="Повторить" data-i18n-aria="redo_tip">↷</button>
  <div class="tm" data-menu>
    <button type="button" class="tm-btn" data-i18n="m_settings">Настройки</button>
    <div class="tm-panel">
      <button id="b_snap" class="on">Сетка: вкл</button>
      <button id="b_theme" title="Светлая / тёмная тема" data-i18n-title="theme_tip">☀ Тема: тёмная</button>
      <button id="b_lang" title="Switch to English" data-i18n-title="lang_tip">Язык: RU</button>
    </div>
  </div>
  <button class="primary" id="b_save" disabled data-i18n="save">Сохранить</button>
  <button onclick="window.location.href='/#settings'"><span data-i18n="to_decoder">Выйти</span></button>
  <input type="file" id="f_import" accept=".json,application/json" class="hidden" />
  </div>
  <div class="hd-right">
    <button id="b_insp" class="mob" title="Настройки" data-i18n-title="insp_tip">⚙</button>
  </div>
</header>

<main>
  <aside class="left">
    <h2 data-i18n="ready_blocks">Готовые блоки</h2>
    <div class="pal" id="palette"></div>
  </aside>

  <section id="stage" class="grid-bg">
    <div id="world">
      <svg id="links" width="6000" height="4000">
        <defs>
          <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M3 2 L9 6 L3 10" fill="none" stroke="#7fa4cf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
          </marker>
          <marker id="arrowTemp" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M3 2 L9 6 L3 10" fill="none" stroke="#4a9eff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
          </marker>
        </defs>
        <g id="linkLayer"></g>
        <path id="tempLink" class="temp hidden" marker-end="url(#arrowTemp)"></path>
      </svg>
      <div id="nodes"></div>
      <div id="texts"></div>
    </div>
    <div id="marquee"></div>
  </section>

  <aside class="right">
    <h2 data-i18n="block_setup">Настройка блока</h2>
    <div id="inspector"><p class="hint" data-i18n="select_hint">Выберите блок на холсте или добавьте новый слева.</p></div>
  </aside>
</main>

<footer class="foot">
  <span id="status_txt" data-i18n="ready">Готово</span>
  <span class="grow"></span>
  <span id="counts"></span>
  <div class="diag" id="diag"></div>
</footer>

function normalizeProject(p){
  if(!p||!Array.isArray(p.blocks))return p;
  for(const b of p.blocks){
    if(!b||typeof b!=="object")continue;
    if(!b.files||typeof b.files!=="object")b.files={};
    if(b.type==="signal"){b.type="whistle";b.name=b.name||tr(BY_TYPE.whistle.name);}
    else if(b.type==="lightfx"||LEGACY_FX[b.type]!==undefined){b.effect=LEGACY_FX[b.type]!==undefined?LEGACY_FX[b.type]:(b.effect||0);b.type="output";b.channel=1;b.name=tr(BY_TYPE.output.name);}

    else if(b.type==="headlight"){b.type="output";b.channel=0;b.name=tr(BY_TYPE.output.name);}
    if(!BY_TYPE[b.type]){b.type="output";b.channel=0;b.name=b.name||tr(BY_TYPE.output.name);}
    const cat=BY_TYPE[b.type];
    if(cat&&cat.kind==="output"){
      if(b.channel===undefined||(b.channel|0)<0||(b.channel|0)>7)b.channel=0;
      if(b.effect===undefined)b.effect=0;

    }
    if(cat&&cat.kind==="logicv"){if(!Array.isArray(b.conds))b.conds=[];if(b.join!=="or")b.join="and";}
    if(cat&&cat.kind==="var"){if(typeof b.varName!=="string")b.varName="";if(b.value===undefined||b.value===null)b.value=1;else b.value=Math.max(-32768,Math.min(32767,b.value|0));}
    if(cat&&cat.kind==="delay"){if(!(b.delayMs>0))b.delayMs=500;else b.delayMs=Math.max(50,Math.min(10000,b.delayMs));}
    if(cat&&cat.kind==="input"){if(!(b.fn>=0&&b.fn<=28))b.fn=0;if(["toggle","hold","strobe"].indexOf(b.fxMode)<0)b.fxMode="toggle";}
    if(cat&&cat.mode==="mute"){if(typeof b.stopNow!=="boolean")b.stopNow=false;}
    if(b.trigger===undefined)b.trigger="auto";
    if(b.outEvent===undefined)b.outEvent="finish";
    if(b.outDelay===undefined)b.outDelay=0;
    if(b.shortMs===undefined)b.shortMs=400;
    if(b.type==="speed"){if(!Array.isArray(b.bands))b.bands=[0,SPEED_STEP,SPEED_STEP*2,SPEED_STEP*3].map((from,i,arr)=>({from:from,to:arr[i+1]==null?100:arr[i+1],file:""}));if(b.hyst==null)b.hyst=SPEED_HYST;}
    if(b.type==="random"&&!Array.isArray(b.files.random))b.files.random=["","","",""];
    if(b.type==="engine"){if(b.files&&Array.isArray(b.files.run)){b.run=b.files.run.map((f,i)=>({from:i*SPEED_STEP,to:(i+1)*SPEED_STEP,file:f||""}));delete b.files.run;}if(!Array.isArray(b.run))b.run=[0,25,50,75].map((f,i,a)=>({from:f,to:a[i+1]==null?100:a[i+1],file:""}));if(b.hyst==null)b.hyst=SPEED_HYST;}
    if(b.type==="volume"){if(b.master===undefined)b.master=20;if(b.engine===undefined)b.engine=20;if(b.effects===undefined)b.effects=20;}
  }
  if(!Array.isArray(p.vars))p.vars=[];
  if(!Array.isArray(p.texts))p.texts=[];
  p.texts.forEach(tx=>{if(!tx||typeof tx!=="object")return;if(typeof tx.text!=="string")tx.text="";if(typeof tx.x!=="number"||!isFinite(tx.x))tx.x=0;if(typeof tx.y!=="number"||!isFinite(tx.y))tx.y=0;if(!(tx.size>0))tx.size=16;});
  VAR_BUILTINS.forEach(bi=>{if(!p.vars.some(v=>v&&v.kind===bi.kind))p.vars.push({name:bi.name,kind:bi.kind,init:0});});
  p.vars.forEach(v=>{if(!v||typeof v!=="object")return;if(!v.kind)v.kind="user";if(!v.name)v.name=v.kind==="user"?"var":v.kind;if(v.kind!=="user"||v.init==null)v.init=0;});
  if(!p.editor)p.editor={viewport:{x:40,y:40,zoom:1},snap:true,bindTuples:[]};
  /* Engine and Volume are always present, like fixed device settings. */
  if(!p.blocks.some(b=>b.type==="engine"))addBlockTo(p,"engine");
  if(!p.blocks.some(b=>b.type==="volume"))addBlockTo(p,"volume");
  return p;
}

function snapTo(p,v){return p.editor.snap?Math.round(v/GRID)*GRID:Math.round(v);}
/* Place a new block at the top-left of the visible viewport; if that spot is

function nextBlockPosition(p){
  const v=(p.editor&&p.editor.viewport)||{x:0,y:0,zoom:1},z=v.zoom||1,pad=GRID*2;
  const ax=snapTo(p,(-v.x+pad)/z),ay=snapTo(p,(-v.y+pad)/z);

  const free=(x,y)=>!p.blocks.some(b=>Math.abs(b.x-x)<NODE_W+GRID&&Math.abs(b.y-y)<NODE_H+GRID);

    const x=ax+(i%cols)*stepX,y=ay+Math.floor(i/cols)*stepY;
    if(free(x,y))return {x,y};
  }

}

/* ---- compile sound blocks -> device sound-graph (schema v1) ---------- */
function compile(){
  const states=[],transitions=[],effects=[];const files=new Set();const speedHysts=[];const dropped=[];let tid=0;
  const audible={},terminal={},startCondOf={},stopCondOf={},usedPrio={};let waitN=0;
  const ctlEntry={},ctlOut={};
  /* Links from an Input (Fx) block are trigger assignments, not graph edges:
     every target becomes its own effect channel, so one Fx event can drive
     several blocks at once (parallel fan-out). */
  /* Input (Fx) has a single output. Its mode selects the trigger condition:
     Вкл/выкл = press event, Удержание = held level, Строб = held level (the
     target produces the flashing). */
  const fxCondOf=mode=>({toggle:{type:"fn_press"},hold:{type:"fn_on"},strobe:{type:"fn_on"}}[mode]||{type:"fn_press"});
  const inputTrigs=id=>{const out=[];for(const l of project.links){if(l.to!==id)continue;const f=project.blocks.find(x=>x.id===l.from);if(!f||BY_TYPE[f.type].kind!=="input")continue;out.push(Object.assign(fxCondOf(f.fxMode),{fn:f.fn}));}return out;};
  const graphHasIn=id=>project.links.some(l=>{if(l.to!==id)return false;const f=project.blocks.find(x=>x.id===l.from);return !!f&&BY_TYPE[f.type].kind!=="input";});
  const isLeaf=id=>!project.links.some(l=>l.from===id&&l.kind==="after"&&BY_TYPE[l.to]&&BY_TYPE[l.to].kind!=="output");
  const prioFor=src=>{usedPrio[src]=usedPrio[src]||new Set();let p=60;while(usedPrio[src].has(p))p--;usedPrio[src].add(p);return p;};
  const addState=(id,name,file,loop,volume=80,rate=1000,loops=0)=>{if(states.some(s=>s.id===id))return null;const st={id,name,file:file||"",loop:!!loop,volume,rate};if(loops)st.loops=loops;states.push(st);if(file)files.add(file);return st;};
  const silent=(id,name)=>addState(id,name,"",false,100,1000);
  const addEdge=(source,target,condition,priority=10,timing="immediate")=>{transitions.push({id:"t"+(++tid),source,target,priority,timing,condition});};
  const engine=project.blocks.find(b=>b.type==="engine");
  const engineEntry=engine?engine.id+"_off":"engine_off";
  silent(engineEntry,t("s_engine_off"));
  const linkedFromEngine=id=>project.links.some(l=>l.to===id&&(project.blocks.find(b=>b.id===l.from)||{}).type==="engine");
  const triggerOf=b=>b.trigger==="auto"?(linkedFromEngine(b.id)?"engine":"fn"):b.trigger;

     the scheme was launched (its condition and F-key), so a linked Loop can end
     on the same event that started the scheme. */
  const chainStartCond=id=>{let cur=id,seen=0;while(cur&&seen++<40){const c=project.blocks.find(x=>x.id===cur);if(!c)break;if(BY_TYPE[c.type].mode==="start"){const st=triggerOf(c);return st==="engine"?{type:"engine_on"}:st==="speed"?{type:"speed",min:pctSpeed(c.speedMin==null?0:c.speedMin),max:pctSpeed(c.speedMax==null?100:c.speedMax)}:st==="dir"?{type:c.dirTrigger!=="rev"?"dir_fwd":"dir_rev"}:{type:"fn_press",fn:c.fn};}const inL=project.links.find(l=>l.to===cur&&l.kind==="after");if(!inL)break;cur=inL.from;}return null;};
  const chainStartFn=id=>{const c=chainStartCond(id);return c&&c.type==="fn_press"?c.fn:null;};
  const reverseCond=c=>{if(!c)return null;if(c.type==="engine_on")return{type:"engine_off"};if(c.type==="fn_press")return{type:"fn_release",fn:c.fn};if(c.type==="dir_fwd")return{type:"dir_rev"};if(c.type==="dir_rev")return{type:"dir_fwd"};if(c.type==="speed")return{type:"engine_off"};return null;};

  for(const b of project.blocks){

    /* Aura X control blocks (Mixes): silent FSM states that wait for Fx,

      const vi=varIndexByName(b.varName);

      if(trigs.length){st=silent(b.id+"_gate",blockName(b));trigs.forEach((c,i)=>addEdge(e,b.id+"_gate",c,20+i));}
      ctlEntry[b.id]=st.id;

        const rv=varIndexByName(c.rhsVar);if(c.rhsVar&&rv>=0)cond.var2=rv;else cond.value=Math.max(-32768,Math.min(32767,c.value|0));return cond;};

        if(b.join==="or"){

        }else{
          let cur=start;conds.forEach((c,i)=>{const nxt=i<conds.length-1?(b.id+"_e"+(i+1)):T;if(i<conds.length-1)silent(nxt,blockName(b)+" AND"+(i+1));

    }
    if(kind==="cue"){
      const e=b.id+"_off";silent(e,blockName(b));ctlEntry[b.id]=e;
      if(b.files.sound){const ph=b.id+"_play";addState(ph,blockName(b),b.files.sound,false,vol,rate);
        const trigs=inputTrigs(b.id),starts=trigs.length?trigs:[{type:"sample_done"}];
        starts.forEach((c,i)=>addEdge(e,ph,c,10+i));
        const leaf=!project.links.some(l=>l.from===b.id&&l.kind==="after"&&BY_TYPE[l.to]&&BY_TYPE[l.to].kind!=="output");
        if(leaf)addEdge(ph,e,{type:"sample_done"},10);

      if(has(start))addState(b.id+"_start",t("s_engine_start"),start,false,vol,rate);
      addState(b.id+"_idle",t("s_engine_idle"),idle,true,vol,rate);
      runs.forEach((x,i)=>addState(b.id+"_run"+i,t("s_engine_run")+(i+1),x.file,true,vol,rate));
      if(has(stop))addState(b.id+"_stop",t("s_engine_stop"),stop,false,vol,rate);
      const first=has(start)?b.id+"_start":b.id+"_idle";
      addEdge(b.id+"_off",first,{type:"engine_on"},10);
      if(has(start))addEdge(b.id+"_start",b.id+"_idle",{type:"sample_done"},10);
      const stopTarget=has(stop)?b.id+"_stop":b.id+"_off";
      addEdge(b.id+"_idle",stopTarget,{type:"engine_off"},255);
      if(has(start))addEdge(b.id+"_start",stopTarget,{type:"engine_off"},255);
      if(has(stop))addEdge(b.id+"_stop",b.id+"_off",{type:"sample_done"},10);
      const band=i=>[pctSpeed(runs[i].from),pctSpeed(runs[i].to)];
      runs.forEach((x,i)=>{const [lo,hi]=band(i);
        addEdge(b.id+"_idle",b.id+"_run"+i,{type:"speed",min:lo,max:hi},i+1,"after_sample");
        addEdge(b.id+"_run"+i,b.id+"_idle",{type:"speed",min:0,max:0},0,"after_sample");
        addEdge(b.id+"_run"+i,stopTarget,{type:"engine_off"},255);
        runs.forEach((y,j)=>{if(j!==i)addEdge(b.id+"_run"+i,b.id+"_run"+j,{type:"speed",min:band(j)[0],max:band(j)[1]},j+1,"after_sample");});
      });
      audible[b.id]=has(start)?b.id+"_start":(runs.length?b.id+"_run0":b.id+"_idle");
      terminal[b.id]=has(stop)?b.id+"_stop":null;
      startCondOf[b.id]={type:"engine_on"};
      continue;
    }
    const entry=b.id+"_off";silent(entry,blockName(b)+t("s_silent_in"));
    effects.push({id:b.id,entry,fn});
    const mode0=BY_TYPE[b.type].mode;
    if(mode0==="speed"){
      speedHysts.push(b.hyst==null?SPEED_HYST:b.hyst);
      const bands=(Array.isArray(b.bands)?b.bands:[]).filter(x=>x&&x.file),items=[];
      bands.forEach(x=>{const s=b.id+"_sp"+items.length;addState(s,blockName(b)+" "+Math.round(x.from||0)+"-"+Math.round(x.to==null?100:x.to)+"%",x.file,true,vol,rate);items.push({state:s,lo:pctSpeed(x.from),hi:pctSpeed(x.to==null?100:x.to)});});
      items.forEach((it,i)=>addEdge(entry,it.state,{type:"speed",min:it.lo,max:it.hi},i+1,"after_sample"));
      items.forEach((it,i)=>items.forEach((jt,j)=>{if(i!==j)addEdge(it.state,jt.state,{type:"speed",min:jt.lo,max:jt.hi},j+1,"after_sample");}));
      items.forEach(it=>addEdge(it.state,entry,{type:"engine_off"},255));
      continue;
    }
    if(mode0==="decel"){
      if(b.files.sound){addState(b.id+"_play",blockName(b),b.files.sound,false,vol,rate);addEdge(entry,b.id+"_play",{type:"decel",min:1,max:255},10,"after_sample");addEdge(b.id+"_play",entry,{type:"sample_done"},10);audible[b.id]=b.id+"_play";terminal[b.id]=b.id+"_play";}
      continue;
    }
    if(mode0==="random"){
      const files=(Array.isArray(b.files.random)?b.files.random:[]).filter(Boolean);
      if(files.length){
        const ready=b.id+"_ready";addState(ready,blockName(b)+t("s_choose"),"",false,100,1000);
        addEdge(entry,ready,{type:"fn_press",fn},10);
        files.forEach((f,i)=>{const s=b.id+"_r"+i;addState(s,blockName(b)+" "+(i+1),f,false,vol,rate);addEdge(ready,s,{type:"random",min:100},10);addEdge(s,entry,{type:"sample_done"},10);});
        audible[b.id]=ready;
      }
      continue;
    }
    /* scheme primitives: Start / Simple / Loop / Mute / End.
       Start is the scheme entry (owns the launch condition, no sound); the
       other blocks are reached by "after" links from Start/previous blocks and
       hand over with sample_done (Simple/Mute), the exit condition (Loop) or
       terminate the branch (End). */
    if(mode0==="start"){
      const sTrig=triggerOf(b);
      const sStart= sTrig==="engine"?{type:"engine_on"}
        : sTrig==="speed"?{type:"speed",min:pctSpeed(b.speedMin==null?0:b.speedMin),max:pctSpeed(b.speedMax==null?100:b.speedMax)}
        : sTrig==="dir"?{type:(b.dirTrigger!=="rev")?"dir_fwd":"dir_rev"}
        : {type:"fn_press",fn};
      startCondOf[b.id]=sStart;
      if(sTrig==="speed")speedHysts.push(b.hyst==null?SPEED_HYST:b.hyst);
      if(b.files.sound){
        const ph=b.id+"_play";addState(ph,blockName(b),b.files.sound,false,vol,rate);
        const trigs=inputTrigs(b.id),starts=trigs.length?trigs:[sStart];
        starts.forEach((c,i)=>addEdge(entry,ph,c,10+i,sTrig==="speed"?"after_sample":"immediate"));
        addEdge(ph,entry,{type:"sample_done"},10);
        audible[b.id]=ph;terminal[b.id]=ph;
      }
      continue;
    }
    if(mode0==="simple"){
      if(b.files.sound){const ph=b.id+"_play";addState(ph,blockName(b),b.files.sound,false,vol,rate);inputTrigs(b.id).forEach((c,i)=>addEdge(entry,ph,c,10+i));addEdge(ph,entry,{type:"sample_done"},10);audible[b.id]=ph;terminal[b.id]=ph;}
      continue;
    }
    if(mode0==="loop"){
      const lm=b.loopMode||"hold";let sStop=null;
      if(lm==="time"){const units=Math.max(1,Math.min(255,Math.round((b.loopMs||1000)/50)));sStop={type:"timeout",min:units};}
      else if(lm==="count"){sStop={type:"sample_done"};}
      else if(lm==="event"){
        const et=(b.trigger==="engine"||b.trigger==="dir")?b.trigger:"fn";
        if(et==="engine")sStop={type:"engine_off"};
        else if(et==="dir"){const fwd=b.dirTrigger!=="rev";sStop={type:fwd?"dir_rev":"dir_fwd"};}
        else{const sf=chainStartFn(b.id);sStop={type:"fn_release",fn:sf==null?fn:sf};}
      }else{sStop=reverseCond(chainStartCond(b.id))||{type:"engine_off"};}
      if(b.files.sound){
        const loops=(lm==="count")?Math.max(1,Math.min(255,b.loopCount||2)):0;
        const ph=b.id+"_play";addState(ph,blockName(b),b.files.sound,true,vol,rate,loops);
        inputTrigs(b.id).forEach((c,i)=>addEdge(entry,ph,c,10+i));
        addEdge(ph,entry,sStop,10);
        stopCondOf[b.id]=sStop;audible[b.id]=ph;terminal[b.id]=ph;
      }
      continue;
    }
    if(mode0==="mute"){
      const ph=b.id+"_mute";silent(ph,blockName(b));inputTrigs(b.id).forEach((c,i)=>addEdge(entry,ph,c,10+i));addEdge(ph,entry,{type:"sample_done"},10);audible[b.id]=ph;terminal[b.id]=ph;
      continue;
    }
    if(mode0==="end"){
      const ph=b.id+"_end";
      if(b.files.sound)addState(ph,blockName(b),b.files.sound,false,vol,rate);else silent(ph,blockName(b));
      inputTrigs(b.id).forEach((c,i)=>addEdge(entry,ph,c,10+i));
      audible[b.id]=ph;terminal[b.id]=null;
      continue;
    }
    const trig=triggerOf(b);
    let startCond,stopCond=null,speedRange=null;
    if(trig==="engine"){startCond={type:"engine_on"};stopCond={type:"engine_off"};}
    else if(trig==="speed"){speedRange={min:pctSpeed(b.speedMin==null?0:b.speedMin),max:pctSpeed(b.speedMax==null?100:b.speedMax)};startCond={type:"speed",min:speedRange.min,max:speedRange.max};speedHysts.push(b.hyst==null?SPEED_HYST:b.hyst);}
    else if(trig==="dir"){const fwd=b.dirTrigger!=="rev";startCond={type:fwd?"dir_fwd":"dir_rev"};stopCond={type:fwd?"dir_rev":"dir_fwd"};}
    else{startCond={type:"fn_press",fn};stopCond={type:"fn_release",fn};}
    const mode=(trig==="speed"||trig==="dir")?"loopHeld":mode0;
    startCondOf[b.id]=startCond;
    if(mode==="oneshot"){
      if(b.files.sound){addState(b.id+"_play",blockName(b),b.files.sound,false,vol,rate);addEdge(entry,b.id+"_play",startCond,10);addEdge(b.id+"_play",entry,{type:"sample_done"},10);audible[b.id]=b.id+"_play";terminal[b.id]=b.id+"_play";}
    }else if(mode==="shortLong"){
      /* Short tap plays the short part; holding past the threshold continues
         into the long chain (start/loop/end). The decision is made in a silent
         "hold" state: release before the timeout -> short, timeout -> long. */
      const hasShort=!!b.files.short;
      if(hasShort)addState(b.id+"_short",blockName(b)+t("s_short"),b.files.short,false,vol,rate);
      const first=b.files.start?b.id+"_start":b.files.loop?b.id+"_loop":b.files.end?b.id+"_end":"";
      if(b.files.start)addState(b.id+"_start",blockName(b)+t("s_begin"),b.files.start,false,vol,rate);
      if(b.files.loop)addState(b.id+"_loop",blockName(b)+t("s_cycle"),b.files.loop,true,vol,rate);
      if(b.files.end)addState(b.id+"_end",blockName(b)+t("s_finish"),b.files.end,false,vol,rate);
      if(hasShort&&first){
        const hold=b.id+"_hold";silent(hold,blockName(b));
        const holdUnits=Math.max(1,Math.min(255,Math.round((b.shortMs||400)/50)));
        addEdge(entry,hold,startCond,10);
        addEdge(hold,b.id+"_short",stopCond,10);
        addEdge(hold,first,{type:"timeout",min:holdUnits},5);
        addEdge(b.id+"_short",entry,{type:"sample_done"},1);
      }else if(hasShort){
        addEdge(entry,b.id+"_short",startCond,10);
        addEdge(b.id+"_short",entry,{type:"sample_done"},1);
      }else if(first){
        addEdge(entry,first,startCond,10);
      }
      if(b.files.start&&b.files.loop)addEdge(b.id+"_start",b.id+"_loop",{type:"sample_done"},10);
      if(b.files.end){addEdge(first||entry,b.id+"_end",stopCond,5);if(b.files.loop&&first!==b.id+"_loop")addEdge(b.id+"_loop",b.id+"_end",stopCond,5);addEdge(b.id+"_end",entry,{type:"sample_done"},10);}
      else if(b.files.loop)addEdge(b.id+"_loop",entry,stopCond,5);
      else if(b.files.start)addEdge(b.id+"_start",entry,{type:"sample_done"},10);
      audible[b.id]=first||(hasShort?b.id+"_short":"");
      terminal[b.id]=b.files.end?b.id+"_end":((!b.files.loop&&b.files.start)?b.id+"_start":null);
    }else if(mode==="loopHeld"){
      if(b.files.sound){addState(b.id+"_loop",blockName(b),b.files.sound,true,vol,rate);
        addEdge(entry,b.id+"_loop",startCond,10,trig==="speed"?"after_sample":"immediate");
        if(trig==="speed"){
          if(speedRange.min>0)addEdge(b.id+"_loop",entry,{type:"speed",min:0,max:speedRange.min-1},5,"after_sample");
          if(speedRange.max<255)addEdge(b.id+"_loop",entry,{type:"speed",min:speedRange.max+1,max:255},6,"after_sample");
          addEdge(b.id+"_loop",entry,{type:"engine_off"},255);
        }else addEdge(b.id+"_loop",entry,stopCond,10);
        audible[b.id]=b.id+"_loop";
      }
    }else if(mode==="latched"){
      if(b.files.sound){addState(b.id+"_play",blockName(b),b.files.sound,true,vol,rate);addEdge(entry,b.id+"_play",trig==="engine"?{type:"engine_on"}:{type:"fn_on",fn},10);addEdge(b.id+"_play",entry,trig==="engine"?{type:"engine_off"}:{type:"fn_off",fn},10);audible[b.id]=b.id+"_play";}
    }
  }
  const entryOf=id=>ctlEntry[id]||(id+"_off");
  const controlPort=(b,l)=>{
    const cat=BY_TYPE[b.type];
    if(cat.kind==="logicv"){const port=l.cond==="false"?"false":"true";return {state:b.id+(port==="false"?"_false":"_true"),cond:{type:"sample_done"},port:port};}
    if(cat.kind==="var")return {state:ctlEntry[b.id],cond:{type:"sample_done"},port:"out"};
    return {state:ctlEntry[b.id],cond:{type:"timeout",min:Math.max(1,Math.min(255,Math.round((b.delayMs||500)/50)))},port:"out"};
  };
  for(const l of project.links){
    if(l.kind!=="after")continue;
    const from=project.blocks.find(x=>x.id===l.from),to=project.blocks.find(x=>x.id===l.to);
    if(!from||!to)continue;
    const fk=BY_TYPE[from.type].kind,tk=BY_TYPE[to.type].kind;
    if(fk==="output"||fk==="input")continue;   /* input links are triggers, output links are binds */
    if(fk==="logicv"||fk==="var"||fk==="delay"){
      const src=controlPort(from,l);
      const dst=tk==="output"?null:(tk==="sound"?audible[to.id]:entryOf(to.id));
      if(!src.state||!src.cond){dropped.push({id:from.id,reason:"src"});continue;}
      if(!dst){dropped.push({id:to.id,reason:"dst"});continue;}
      addEdge(src.state,dst,src.cond,prioFor(src.state));
      continue;
    }
    const delay=Math.max(0,from.outDelay|0);
    const waitUnits=Math.max(1,Math.min(255,Math.round(delay/50)));
    if(tk==="sound"||tk==="cue"){
      const a=audible[to.id];if(!a){dropped.push({id:to.id,reason:"dst"});continue;}
      const ev=from.outEvent==="start"?"start":"finish";
      const cond=ev==="start"?startCondOf[from.id]:(stopCondOf[from.id]||{type:"sample_done"});
      const srcState=ev==="start"?(to.id+"_off"):terminal[from.id];
      if(!srcState||!cond){dropped.push({id:from.id,reason:"src"});continue;}
      const prio=prioFor(srcState);
      if(delay>0){const w=from.id+"_w"+(++waitN);silent(w,blockName(from)+t("s_delay"));addEdge(srcState,w,cond,prio);addEdge(w,a,{type:"timeout",min:waitUnits},prio);}
      else addEdge(srcState,a,cond,prio);
    }else{
      const dst=tk==="output"?null:entryOf(to.id),srcState=terminal[from.id]||audible[from.id];
      if(!srcState||!dst){dropped.push({id:from.id,reason:"src"});continue;}
      const cond=stopCondOf[from.id]||{type:"sample_done"};
      const prio=prioFor(srcState);
      if(delay>0){const w=from.id+"_w"+(++waitN);silent(w,blockName(from)+t("s_delay"));addEdge(srcState,w,cond,prio);addEdge(w,dst,{type:"timeout",min:waitUnits},prio);}
      else addEdge(srcState,dst,cond,prio);
    }
  }
  const positions={};project.blocks.forEach(b=>positions[b.id]={x:b.x,y:b.y});
  const vars=(project.vars||[]).map(v=>v.kind==="user"?{name:v.name,kind:"user",init:(v.init|0)}:{name:v.name,kind:v.kind});
  const hystUnits=speedHysts.length?Math.max.apply(null,speedHysts.map(p=>Math.max(0,Math.min(32,pctSpeed(p))))):(engine?3:0);
  const payload={format:"sound-graph",schemaVersion:1,id:project.id,name:project.name,
    engine:{entry:engineEntry,fn:engine?engine.fn:8},hysteresis:hystUnits,
    variables:vars,states,transitions,effects,assets:Object.keys(assets).map(f=>assets[f]),
    editor:{positions,viewport:project.editor.viewport}};
  return {payload,files:[...files],dropped};
}

/* ---- compile outputs -> func_binding_t ------------------------------- */
function outputBlocks(){return project.blocks.filter(b=>BY_TYPE[b.type].kind==="output");}
function sourceFnOf(id){for(const l of project.links){if(l.to===id){const s=project.blocks.find(b=>b.id===l.from);if(s)return s.fn;}}return null;}
/* F-key of the Start part upstream of a scheme block (walking "after" links
   backwards); used to show which key ends a linked Loop. */
function upstreamStartFn(id){let cur=id,seen=0;while(cur&&seen++<40){const c=project.blocks.find(x=>x.id===cur);if(!c)return null;if(BY_TYPE[c.type].mode==="start")return c.fn;const l=project.links.find(x=>x.to===cur&&x.kind==="after");if(!l)return null;cur=l.from;}return null;}
function desiredBindings(){
  const out=[];const mk=(fn,type,id,dir,state)=>({fn,type,id,dir:dir|0,state:state|0});
  for(const b of outputBlocks()){
    const fn=sourceFnOf(b.id)!=null?sourceFnOf(b.id):b.fn;
    const ch=b.channel|0;
    if(ch===0)out.push(mk(fn,1,0,0,0));
    else out.push(mk(fn,1,2+(ch-1),0,0));
  }
  return out;
}
function auxConfigs(){return outputBlocks().filter(b=>(b.channel|0)>=1).map(b=>({ch:(b.channel|0)-1,level:b.level|0,effect:b.effect|0}));}
const bindKey=b=>b.fn+":"+b.type+":"+b.id+":"+(b.dir|0)+":"+(b.state|0);

/* ---- client validation ---------------------------------------------- */
function validate(){
  const {payload,files,dropped}=compile();const out=[];
  const err=(id,message)=>out.push({id,message,severity:"error"});
  const warn=(id,message)=>out.push({id,message,severity:"warning"});
  if(payload.states.length>LIMITS.states)err("",t("v_states_a")+payload.states.length+t("v_states_b")+LIMITS.states+t("v_states_c"));
  if(payload.states.filter(s=>s.file).length>LIMITS.soundStates)err("",t("v_sound_states_a")+LIMITS.soundStates+".");
  if(payload.states.filter(s=>!s.file).length>26)err("",t("v_silent_a")+26+".");
  if(payload.transitions.length>LIMITS.transitions)err("",t("v_transitions_a")+payload.transitions.length+t("v_transitions_b")+LIMITS.transitions+".");
  if(payload.effects.length>LIMITS.effects)err("",t("v_effects_a")+LIMITS.effects+".");
  if(files.length>LIMITS.assets)err("",t("v_assets_a")+LIMITS.assets+".");
  const silent=new Set(payload.states.filter(s=>!s.file).map(s=>s.id));
  if(!silent.has(payload.engine.entry))err("",t("v_engine_entry"));
  payload.effects.forEach(e=>{if(!silent.has(e.entry))err(e.id,t("v_effect_entry"));});
  const used={};payload.transitions.forEach(e=>{const k=e.source+":"+e.priority;
    if(used[k]){if(!(e.condition&&e.condition.type==="random"&&used[k].condition&&used[k].condition.type==="random"))err(e.id,t("v_dup_prio_a")+e.source+".");}
    else used[k]=e;});
  const ids=new Set(payload.states.map(s=>s.id));
  payload.transitions.forEach(e=>{if(!ids.has(e.source))err(e.id,t("v_no_state_a")+e.source);if(!ids.has(e.target))err(e.id,t("v_no_state_a")+e.target);});
  files.forEach(f=>{if(!assets[f])warn("",t("v_no_wav_a")+f+t("v_no_wav_b"));});
  for(const b of outputBlocks()){
    if((b.channel|0)>7||(b.channel|0)<0)err(b.id,t("v_bad_aux"));
    if(sourceFnOf(b.id)==null&&!(b.fn>=0&&b.fn<=28))err(b.id,t("v_need_fn"));
  }
  const fnUse={};const addUse=(f,who)=>{if(f==null||f<0||f>28)return;(fnUse[f]=fnUse[f]||[]).push(who);};
  const linkedFromEngine=id=>project.links.some(l=>l.to===id&&(project.blocks.find(x=>x.id===l.from)||{}).type==="engine");
  const trigOf=b=>b.trigger==="auto"?(linkedFromEngine(b.id)?"engine":"fn"):b.trigger;
  project.blocks.forEach(b=>{const c=BY_TYPE[b.type];
    if(c.kind==="setting")return;
    if(c.kind==="engine"){addUse(b.fn,t("v_engine_word"));return;}
    if(c.kind==="sound"){if(c.mode==="speed"||c.mode==="decel"||c.mode==="simple"||c.mode==="loop"||c.mode==="mute"||c.mode==="end")return;if(trigOf(b)==="fn")addUse(b.fn,t("v_name_l")+blockName(b)+t("v_name_r"));return;}
    const src=sourceFnOf(b.id);addUse(src!=null?src:b.fn,t("v_name_l")+blockName(b)+t("v_name_r"));});
  Object.keys(fnUse).forEach(f=>{if(fnUse[f].length>1)warn("","F"+f+t("v_multiple_a")+fnUse[f].join(", ")+".");});
  (dropped||[]).forEach(d=>warn(d.id,d.reason==="src"?t("v_link_dropped_src"):t("v_link_dropped_dst")));
  for(const b of project.blocks){
    const m=BY_TYPE[b.type]&&BY_TYPE[b.type].mode;
    if(m==="simple"||m==="loop"||m==="mute"||m==="end"){
      if(!project.links.some(l=>l.to===b.id&&l.kind==="after"))warn(b.id,t("v_no_link_in"));
    }
  }
  const fxSeen={},chSeen={};
  project.blocks.forEach(b=>{const c=BY_TYPE[b.type];if(!c)return;
    if(c.kind==="input"){const k=b.fn;if(fxSeen[k]!==undefined)warn(b.id,t("v_dup_fx"));else fxSeen[k]=b.id;}
    if(c.kind==="output"){const k=b.channel|0;if(chSeen[k]!==undefined)warn(b.id,t("v_dup_ch"));else chSeen[k]=b.id;}});
  /* Parallel fan-out is supported only for Input (Fx): its links assign triggers
     and every target becomes its own channel. Other blocks keep a single branch. */
  project.blocks.forEach(b=>{const c=BY_TYPE[b.type];if(!c||c.kind==="input"||c.kind==="output"||c.kind==="setting"||c.kind==="engine")return;
    const n=project.links.filter(l=>l.from===b.id&&l.kind==="after"&&BY_TYPE[l.to]&&BY_TYPE[l.to].kind!=="output").length;
    if(n>1)warn(b.id,t("v_multi_branch"));});
  return {payload,files,diagnostics:out};
}

/* ---- API ------------------------------------------------------------- */
async function req(path,init){
  const r=await fetch(path,Object.assign({cache:"no-store"},init||{}));
  let data;try{data=JSON.parse(await r.text());}catch(e){throw new Error(t("err_not_json")+r.status+")");}
  if(!r.ok||data.ok!==true)throw new Error(data.error||(t("err_http")+r.status));
  return data;
}
const qs=o=>Object.keys(o).map(k=>encodeURIComponent(k)+"="+encodeURIComponent(o[k])).join("&");
async function refreshStatus(){
  try{const s=await req("/api/sound/graph/state");online=true;revision=Number(s.revision)||0;}catch(e){online=false;}
  $("on").classList.toggle("on",online);$("on_txt").textContent=online?t("connected"):t("offline");

function playPc(name){

      const a=new Audio("/sound-files/"+encodeURIComponent(name));a.volume=0.8;
      let done=false;const fin=()=>{if(!done){done=true;resolve();}};

/* Blocks connected by "after" links form a sound chain: play them in order. */
function chainFrom(start){
  const seq=[];const seen=new Set();let cur=start;
  while(cur&&!seen.has(cur.id)){
    seen.add(cur.id);seq.push(cur);
    const link=project.links.find(l=>l.from===cur.id&&l.kind==="after");
    cur=link?project.blocks.find(x=>x.id===link.to):null;
  }
  return seq;
}
async function playChain(b){
  if(!b)return;
  const seq=chainFrom(b).map(bl=>({bl,file:primaryFile(bl)})).filter(x=>x.file);
  if(!seq.length){setStatus(t("chain_none"));return;}
  setStatus(t("chain_playing_a")+seq.map(x=>blockName(x.bl)).join(" "+t("chain_arrow")+" ")+t("chain_playing_b"));
  if(soundPlayTarget()==="decoder"){
    await fetchAssets(seq.map(x=>x.file));
    for(const x of seq){
      try{await req("/api/audio/play?name="+encodeURIComponent(String(x.file).replace(/\.wav$/i,"")),{method:"POST"});}catch(e){}
      const a=assets[x.file]||{};const ms=Number(a.durationMs)>0?a.durationMs:1500;
      await new Promise(r=>setTimeout(r,ms+(x.bl.outDelay|0)));
    }
  }else{
    for(const x of seq){
      await playPc(x.file);
      const d=x.bl.outDelay|0;if(d>0)await new Promise(r=>setTimeout(r,d));
    }
  }
  setStatus(t("chain_done"));
}

function removeBlock(id){

  project.links=project.links.filter(l=>l.from!==id&&l.to!==id);

function deleteSelected(){
  const ids=[...selectedIds].filter(id=>{const b=project.blocks.find(x=>x.id===id);return b&&b.type!=="engine"&&b.type!=="volume";});

function pasteClip(){

  pasteCount++;const off=GRID*2*pasteCount;

function isReady(b){
  const cat=BY_TYPE[b.type];if(!cat)return false;
  if(cat.kind==="engine")return !!b.files.idle;
  if(cat.kind==="setting")return true;
  if(cat.kind==="output")return (b.channel|0)>=0&&(b.channel|0)<=7;
  if(cat.kind==="input")return b.fn>=0&&b.fn<=28;
  if(cat.kind==="logicv")return true;
  if(cat.kind==="var")return !!b.varName;
  if(cat.kind==="delay")return (b.delayMs|0)>0;
  if(cat.kind==="cue")return !!b.files.sound;
  if(cat.mode==="speed")return (b.bands||[]).some(x=>x.file);
  if(cat.mode==="random")return (b.files.random||[]).some(Boolean);
  if(cat.mode==="decel")return !!b.files.sound;
  if(cat.mode==="mute")return true;
  if(cat.mode==="start"||cat.mode==="simple"||cat.mode==="loop"||cat.mode==="end")return !!b.files.sound;
  return !!(cat.roles||[]).some(r=>b.files[r]);
}

function graphLayers(){
  const nodes=project.blocks,adj={},pred={},indeg={};
  const kindOf=id=>{const b=nodes.find(n=>n.id===id);return b?BY_TYPE[b.type].kind:"";};
  nodes.forEach(n=>{adj[n.id]=[];pred[n.id]=[];indeg[n.id]=0;});
  project.links.forEach(l=>{if(l.from===l.to)return;if(adj[l.from]===undefined||indeg[l.to]===undefined)return;if(kindOf(l.from)==="output")return;adj[l.from].push(l.to);pred[l.to].push(l.from);indeg[l.to]++;});
  const layer={},q=[];
  nodes.forEach(n=>{if(indeg[n.id]===0){layer[n.id]=0;q.push(n.id);}});
  if(!q.length)nodes.forEach((n,i)=>layer[n.id]=i);
  while(q.length){const u=q.shift();adj[u].forEach(v=>{layer[v]=Math.max(layer[v]==null?0:layer[v],layer[u]+1);if(--indeg[v]===0)q.push(v);});}
  nodes.forEach(n=>{if(layer[n.id]==null)layer[n.id]=0;});
  const cols={};nodes.forEach(n=>{(cols[layer[n.id]]=cols[layer[n.id]]||[]).push(n);});
  const order={};Object.keys(cols).forEach(L=>cols[L].forEach((n,i)=>order[n.id]=i));
  for(let pass=0;pass<3;pass++){
    Object.keys(cols).map(Number).sort((a,b)=>a-b).forEach(L=>{
      cols[L].forEach(n=>{const ps=pred[n.id].filter(p=>order[p]!=null);n._b=ps.length?ps.reduce((s,p)=>s+order[p],0)/ps.length:(order[n.id]||0);});
      cols[L].sort((a,b)=>a._b-b._b);cols[L].forEach((n,i)=>order[n.id]=i);
    });
  }
  return {cols,layer};
}
function linkCondText(l){
  const a=project.blocks.find(x=>x.id===l.from),ak=a?BY_TYPE[a.type].kind:"";
  if(l.kind==="gate")return t("lc_gate");
  if(l.kind==="bind")return t("lc_bind");
  if(ak==="input")return t("lc_fx_on");
  if(ak==="logicv")return l.cond==="false"?t("lc_false"):t("lc_true");
  if(ak==="var")return t("lc_var_set");
  if(ak==="delay")return t("lc_delay_a")+(a.delayMs|0)+t("lc_delay_b");
  if(l.kind==="after"){const ev=(a&&a.outEvent==="start")?t("lc_direct"):t("lc_after_event");const d=(a&&a.outDelay)?(t("lc_delay_a")+a.outDelay+t("lc_delay_b")):"";return ev+d;}

}

  if(cat.mode==="mute"){L.push(t("f_duration")+": "+(b.outDelay|0)+" "+t("bd_delay_b"));return L;}

function buildSchemeSvg(){
  const {cols}=graphLayers();const layers=Object.keys(cols).map(Number).sort((a,b)=>a-b);
  const CARD_W=340,LH=15,info={};
  layers.forEach(L=>cols[L].forEach(n=>{info[n.id]=blockDetailLines(n);}));
  const cardH=id=>26+(info[id]?info[id].length:0)*LH+8;
  const colX={};let x=20;layers.forEach(L=>{colX[L]=x;x+=CARD_W+90;});
  const totalW=Math.max(x,200);const pos={};
  layers.forEach(L=>{let y=20;const rh=Math.max.apply(null,cols[L].map(n=>cardH(n.id)));cols[L].forEach(n=>{pos[n.id]={x:colX[L],y:y,h:cardH(n.id)};y+=rh+24;});});
  const totalH=Math.max.apply(null,Object.keys(pos).map(id=>pos[id].y+pos[id].h).concat([120]))+20;
  let svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+totalW+'" height="'+totalH+'" viewBox="0 0 '+totalW+' '+totalH+'" font-family="system-ui,Segoe UI,Roboto,sans-serif">';
  svg+='<rect x="0" y="0" width="'+totalW+'" height="'+totalH+'" fill="#0f1420"/>';
  svg+='<defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M3 2 L9 6 L3 10" fill="none" stroke="#7fa4cf" stroke-width="1.7" stroke-linecap="round"/></marker></defs>';
  project.links.forEach(l=>{const a=pos[l.from],b=pos[l.to];if(!a||!b)return;
    const x1=a.x+CARD_W,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,dx=Math.max(40,Math.abs(x2-x1)/2);
    svg+='<path d="M'+x1+' '+y1+' C'+(x1+dx)+' '+y1+' '+(x2-dx)+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="#7fa4cf" stroke-width="1.6" marker-end="url(#arr)"/>';
    svg+='<text x="'+((x1+x2)/2)+'" y="'+((y1+y2)/2-4)+'" fill="#9fb0c8" font-size="10" text-anchor="middle">'+esc(linkCondText(l))+'</text>';});
  layers.forEach(L=>cols[L].forEach(n=>{const p=pos[n.id];const c=GROUP_COLORS[(BY_TYPE[n.type]||{}).group]||"#888";
    svg+='<rect x="'+p.x+'" y="'+p.y+'" width="'+CARD_W+'" height="'+p.h+'" rx="8" fill="#1b2230" stroke="'+c+'"/>';
    svg+='<text x="'+(p.x+10)+'" y="'+(p.y+18)+'" fill="#e7ecf5" font-size="13" font-weight="600">'+esc(blockName(n))+'</text>';
    (info[n.id]||[]).forEach((line,i)=>{svg+='<text x="'+(p.x+10)+'" y="'+(p.y+35+i*LH)+'" fill="#93a0b5" font-size="11">'+esc(line)+'</text>';});}));
  svg+='</svg>';return svg;
}

window.addEventListener("keydown",ev=>{
  if(ev.target&&(ev.target.isContentEditable||/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)))return;
  if((ev.key==="Delete"||ev.key==="Backspace")&&!ev.ctrlKey&&!ev.metaKey){
    if(selectedLink){ev.preventDefault();project.links=project.links.filter(l=>l.id!==selectedLink);selectedLink="";render();return;}
    if(selected&&(project.texts||[]).some(x=>x.id===selected)){ev.preventDefault();removeText(selected);return;}
    if(selectedIds.size){ev.preventDefault();deleteSelected();}
    return;
  }
  /* Shortcuts use ev.code (physical key) so Ctrl+C/V/Z/Y/D work on any
   * keyboard layout (on a Russian layout ev.key is "с"/"м"/... instead). */
  if(ev.ctrlKey&&!ev.shiftKey&&ev.code==="Insert"){ev.preventDefault();copySelected();return;}
  if(ev.shiftKey&&!ev.ctrlKey&&!ev.metaKey&&ev.code==="Insert"){ev.preventDefault();pasteClip();return;}
  if(!(ev.ctrlKey||ev.metaKey))return;
  const k=(ev.key||"").toLowerCase(),code=ev.code||"";
  const is=ch=>code==="Key"+ch||k===ch.toLowerCase();
  if(is("Z")&&!ev.shiftKey){ev.preventDefault();undo();}
  else if(is("Y")||(is("Z")&&ev.shiftKey)){ev.preventDefault();redo();}
  else if(is("D")){ev.preventDefault();duplicateSelected();}
  else if(is("C")){ev.preventDefault();copySelected();}
  else if(is("V")){ev.preventDefault();pasteClip();}
});
$("b_save").onclick=doSave;

/* ---- boot ------------------------------------------------------------ */
lang=detectLang();
function applyStatic(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.getAttribute("data-i18n"));});
  document.querySelectorAll("[data-i18n-title]").forEach(el=>{el.setAttribute("title",t(el.getAttribute("data-i18n-title")));});
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{el.setAttribute("aria-label",t(el.getAttribute("data-i18n-aria")));});
  document.documentElement.setAttribute("lang",lang);
  document.title=t("doc_title");
  const b=$("b_lang");if(b){b.textContent=t("m_lang")+": "+lang.toUpperCase();b.setAttribute("title",t("lang_tip"));}
  applyTheme(document.documentElement.getAttribute("data-theme")||"dark");
}
function toggleLang(){lang=(lang==="en")?"ru":"en";try{localStorage.setItem("aura_lang",lang);}catch(e){}applyStatic();renderSnapBtn();render();}
$("b_lang").onclick=toggleLang;
/* toolbar dropdown menus */
document.querySelectorAll("header.top .tm").forEach(tm=>{
  const btn=tm.querySelector(".tm-btn"),panel=tm.querySelector(".tm-panel");
  btn.addEventListener("click",ev=>{ev.stopPropagation();
    const open=tm.classList.contains("open");
    document.querySelectorAll("header.top .tm.open").forEach(o=>o.classList.remove("open"));
    if(!open){tm.classList.add("open");panel.style.left="0";panel.style.right="auto";const r=panel.getBoundingClientRect();if(r.right>window.innerWidth-8){panel.style.left="auto";panel.style.right="0";}}
  });
});
document.addEventListener("click",()=>document.querySelectorAll("header.top .tm.open").forEach(o=>o.classList.remove("open")));
window.addEventListener("keydown",ev=>{if(ev.key==="Escape"){document.querySelectorAll("header.top .tm.open").forEach(o=>o.classList.remove("open"));if(textMode){textMode=false;$("b_text").classList.remove("on");$("stage").style.cursor="";setStatus(t("ready"));}}});
applyStatic();
loadDraft();if(!project)project=newProject();(()=>{let t="dark";try{const s=localStorage.getItem(THEME_KEY);if(s==="light"||s==="dark")t=s;}catch(e){}applyTheme(t);})();applyViewport();renderSnapBtn();historyReset();render();refreshStatus();setInterval(refreshStatus,3000);
window.__blocks={buildText:buildText,buildSchemeSvg:buildSchemeSvg,blockDetailLines:blockDetailLines,project:()=>project,compile:compile,validate:validate};
})();
</script>
